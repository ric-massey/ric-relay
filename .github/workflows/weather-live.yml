# The weather room against the real providers.
#
# The client's own tests run on fixtures, in checks.yml, on every push. They
# cannot tell whether Open-Meteo still has a field, whether the NWS moved a
# link, or whether Iowa State renamed a radar layer — and the room was first
# written in a sandbox that could reach none of them. projects/weather/test/live.mjs
# asks them, through the same functions the page calls, and reads the answers.
#
# It needs the network, so it is its own lane rather than part of checks.mjs.
# It runs when the weather code changes, once a day (a provider can change
# under a page that has not), and on demand. About fifty requests, and one
# whole Level II volume (~20 MB) for the storm-relative check at every tilt.

name: Weather live check

on:
  push:
    paths:
      - 'projects/weather/**'
      - 'weather.html'
      - '.github/workflows/weather-live.yml'
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: projects/weather
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node projects/weather/test/live.mjs
