# Deploy the Worker (training-log) from GitHub instead of from the Mac.
#
# Manual only — the Run workflow button in the Actions tab, which works from a
# phone. Nothing deploys on push: a Worker change goes live when Ric says so,
# the same as it always has with `npx wrangler deploy`.
#
# Needs one secret, CLOUDFLARE_API_TOKEN: a Cloudflare API token made from the
# "Edit Cloudflare Workers" template. CLOUDFLARE_ACCOUNT_ID too, if the token
# can see more than one account. The Worker's own secrets (LOG_TOKEN,
# GARMIN_READ_TOKEN, …) are set in the Cloudflare dashboard and a deploy leaves
# them alone.

name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # assets/scrub-media.js is imported by worker.mjs — the photo
          # scrub is one file shared with the page. mesogrid.js is the
          # mesoanalysis file's format, which worker/test.mjs builds its
          # /meso uploads with.
          sparse-checkout: |
            /worker/
            /assets/scrub-media.js
            /projects/weather/mesogrid.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same rules that guard every push, run again against what is about
      # to go live — both of the Worker's suites: the visitor counter it
      # imports is the only thing between visitors' rows and the public, and
      # this ran only the first (bug sweep A6-4).
      - run: node worker/test.mjs
      - run: node worker/visitors.test.mjs

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # An exact version, not @latest: this step holds the Cloudflare token,
          # and @latest ran whatever npm had that minute (bug sweep A2a-8).
          # Move it up by hand, to a release a couple of weeks old.
          npx --yes wrangler@4.150.0 deploy
