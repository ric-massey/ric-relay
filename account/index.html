<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <!-- Passwords are typed here. The page runs only its own scripts and the Supabase
       client, and only talks to Supabase. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Your account on Ric's site.">
  <title>Account — Ric's Terminal</title>
  <style>
    /* The terminal's phosphor, same as the HERMISCUS door. Dim clears AA on --bg. */
    :root { color-scheme: dark; --bg:#0a0a0a; --phosphor:#ffb000; --dim:#b07d00; --faint:#6b4d00; --danger:#ff8f6b; --ok:#8fe388; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body { margin:0; padding:28px 16px 96px; background:var(--bg); color:var(--phosphor);
           font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; text-shadow:0 0 6px rgba(255,176,0,.22); }
    main { width:min(100%, 560px); margin:0 auto; }
    .boot { color:var(--dim); font-size:12px; line-height:1.7; margin:0 0 18px; }
    .boot b { color:var(--phosphor); font-weight:400; }
    .panel { border:1px solid var(--faint); padding:22px 20px; margin:0 0 18px; }
    h1 { margin:0; font-size:clamp(26px, 8vw, 36px); letter-spacing:.14em; font-weight:600; }
    h2 { margin:0 0 12px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
    p { font-size:13px; line-height:1.6; color:var(--dim); margin:0 0 12px; }
    p b, li b { color:var(--phosphor); font-weight:400; }
    .sub { margin:6px 0 18px; font-size:12px; letter-spacing:.08em; }
    label.field { display:block; margin:14px 0 6px; color:var(--dim); font-size:12px; }
    label.field::before { content:"> "; }
    input[type=email], input[type=password], input[type=text], textarea {
      width:100%; border:1px solid var(--faint); border-radius:0; background:#000; color:var(--phosphor);
      caret-color:var(--phosphor); padding:12px 13px; font:inherit; font-size:16px; outline:none; }
    textarea { min-height:76px; resize:vertical; }
    input:focus, textarea:focus { border-color:var(--phosphor); box-shadow:0 0 0 1px var(--phosphor); }
    button { min-height:44px; border:1px solid var(--phosphor); border-radius:0; background:var(--phosphor); color:#0a0a0a;
             padding:11px 16px; font:700 13px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace; letter-spacing:.1em;
             text-transform:lowercase; cursor:pointer; text-shadow:none; }
    button.wide { width:100%; margin-top:20px; }
    button.ghost { background:transparent; color:var(--phosphor); }
    button.danger { background:transparent; color:var(--danger); border-color:var(--danger); }
    button:hover, button:focus-visible { filter:brightness(1.12); }
    button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--phosphor); outline-offset:3px; }
    button:disabled { opacity:.6; cursor:wait; }
    a { color:var(--phosphor); }
    .switch { background:none; border:0; color:var(--dim); padding:12px 0; min-height:44px; text-decoration:underline;
              font-size:12px; letter-spacing:.04em; text-transform:none; font-weight:400; }
    .message { min-height:18px; margin:12px 0 0; font-size:12px; color:var(--danger); }
    .message.good { color:var(--ok); }
    .checks { display:grid; gap:4px; margin:6px 0 0; }
    .checks label { display:flex; align-items:center; gap:10px; min-height:44px; font-size:13px; cursor:pointer; }
    .checks input { width:20px; height:20px; accent-color:var(--phosphor); }
    .checks small { color:var(--dim); }
    ul.pages { list-style:none; margin:0; padding:0; }
    ul.pages li { border-top:1px solid var(--faint); padding:12px 0; font-size:13px; }
    ul.pages a { display:inline-block; padding:6px 0; }
    .person { border-top:1px solid var(--faint); padding:14px 0; }
    .person:first-of-type { border-top:0; }
    .person .who { font-size:14px; color:var(--phosphor); overflow-wrap:anywhere; }
    .person .meta { font-size:12px; color:var(--dim); margin:4px 0 0; overflow-wrap:anywhere; }
    .person .note { font-size:12px; color:var(--dim); margin:8px 0 0; white-space:pre-wrap; border-left:2px solid var(--faint); padding-left:10px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .tag { display:inline-block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--faint); padding:3px 6px; margin-left:6px; }
    .tag.pending { color:var(--phosphor); border-color:var(--phosphor); }
    .tag.denied { color:var(--danger); border-color:var(--danger); }
    .count { color:#0a0a0a; background:var(--phosphor); padding:1px 7px; margin-left:8px; text-shadow:none; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <p class="boot" aria-hidden="true">guest@ric-terminal:~$ <b>login</b></p>

    <!-- signed out -->
    <section class="panel" id="signin-panel" hidden aria-labelledby="signin-title">
      <h1 id="signin-title">ACCOUNT</h1>
      <p class="sub">one sign-in for the private corners of the site</p>
      <form id="signin-form" novalidate>
        <label class="field" for="si-email">email</label>
        <input id="si-email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label class="field" for="si-pass">password</label>
        <input id="si-pass" type="password" autocomplete="current-password" required>
        <button class="wide" id="si-go" type="submit">sign in</button>
        <p class="message" id="si-msg" role="alert" aria-live="polite"></p>
      </form>
      <button class="switch" type="button" data-show="request-panel">no account? ask Ric for one →</button>
    </section>

    <section class="panel" id="request-panel" hidden aria-labelledby="request-title">
      <h1 id="request-title">ASK FOR ACCESS</h1>
      <p class="sub">Ric gets your request and decides what you can open</p>
      <form id="request-form" novalidate>
        <label class="field" for="rq-name">your name</label>
        <input id="rq-name" type="text" autocomplete="name" maxlength="60" required>
        <label class="field" for="rq-email">email</label>
        <input id="rq-email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label class="field" for="rq-pass">password <small>(8+ characters)</small></label>
        <input id="rq-pass" type="password" autocomplete="new-password" minlength="8" required>
        <p class="sub" id="rq-for" style="margin-top:14px"></p>
        <button class="wide" id="rq-go" type="submit">send request</button>
        <p class="message" id="rq-msg" role="alert" aria-live="polite"></p>
      </form>
      <button class="switch" type="button" data-show="signin-panel">already have an account? sign in →</button>
    </section>

    <!-- signed in -->
    <section class="panel" id="me-panel" hidden aria-labelledby="me-title">
      <h1 id="me-title">ACCOUNT</h1>
      <p class="sub" id="me-email"></p>
      <p id="me-status"></p>
      <ul class="pages" id="me-pages"></ul>
      <div class="row"><button class="ghost" id="signout" type="button">sign out</button></div>
    </section>

    <!-- Ric -->
    <section class="panel" id="admin-panel" hidden aria-labelledby="admin-title">
      <h2 id="admin-title">requests<span class="count" id="pending-count"></span></h2>
      <div id="pending-list"></div>
      <h2 style="margin-top:22px">everyone</h2>
      <div id="people-list"></div>
      <p class="message" id="admin-msg" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../atlas/config.js"></script>
  <script src="../assets/site-gate.js"></script>
  <script src="account.js"></script>
  <script src="../projects/relay-return.js" data-home="../index.html"></script>
</body>
</html>
