<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing Gallery — Ric's Terminal</title>
  <meta name="description" content="Photos and video from Ric's climbing trips, dated and tied to the route.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ric's Terminal">
  <meta property="og:title" content="Climbing Gallery — Ric's Terminal">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a5a40'/><text y='.85em' font-size='68' x='16'>🧗</text></svg>">
  <style>
    :root {
      --bar: #3a5a40; --bg: #f4f1e9; --card: #fff; --ink: #26241f;
      --soft: #6f6a5f; --line: #e2ddd0; --clay: #b5502a; --star: #e0a021;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55;
      font-family: "Helvetica Neue", Arial, sans-serif; padding-bottom: 5rem;
    }
    a { color: var(--clay); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar { background: var(--bar); color: #eef3ee; }
    .topbar .inner {
      max-width: 1100px; margin: 0 auto; padding: .7rem 1.25rem;
      display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
    }
    .topbar .brand { color: #fff; font-weight: 800; letter-spacing: .16em; font-size: .85rem; }
    .topbar .brand:hover { text-decoration: none; color: #d7e6d7; }
    .topbar .wing { color: #b8ccbb; font-size: .85rem; letter-spacing: .16em; }
    .topbar .links { margin-left: auto; display: flex; gap: .15rem; }
    .topbar .links a { color: #cfe0d1; font-size: .78rem; padding: .28rem .7rem; border-radius: 5px; }
    .topbar .links a:hover { color: #fff; background: rgba(255,255,255,.12); text-decoration: none; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.6rem 1.25rem 3rem; }
    .breadcrumb { color: var(--soft); font-size: .85rem; margin-bottom: .5rem; }
    .breadcrumb a { color: var(--soft); }
    h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.01em; }
    .lede { color: var(--soft); margin: .3rem 0 1.2rem; }

    .controls { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .3rem; }
    .search {
      flex: 1; min-width: 220px; padding: .6rem .8rem; font: inherit; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    }
    .search:focus { outline: 2px solid var(--bar); outline-offset: 1px; border-color: var(--bar); }
    .chips { display: flex; gap: .3rem; flex-wrap: wrap; margin: .55rem 0; }
    .chip {
      font: inherit; font-size: .74rem; cursor: pointer; padding: .22rem .65rem;
      border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--soft);
    }
    .chip:hover { border-color: var(--clay); color: var(--clay); }
    .chip[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); color: #fff; }
    .count { color: var(--soft); font-size: .78rem; margin: .5rem 0 .8rem; }

    .grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .shot {
      position: relative; display: block; padding: 0; border: 1px solid var(--line);
      border-radius: 8px; overflow: hidden; background: #ddd8cc; cursor: zoom-in;
      aspect-ratio: 3 / 2; font: inherit; color: inherit; text-align: left;
    }
    .shot img, .shot video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shot .meta {
      position: absolute; inset: auto 0 0 0; padding: .8rem .6rem .45rem;
      color: #fff; font-size: .76rem; line-height: 1.3;
      background: linear-gradient(transparent, rgba(20,18,14,.82));
    }
    .shot .meta b { display: block; font-size: .82rem; }
    .shot .meta span { opacity: .82; font-size: .72rem; }
    .shot .flag {
      position: absolute; top: .45rem; right: .45rem; padding: .1rem .45rem;
      border-radius: 999px; font-size: .64rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; background: rgba(20,18,14,.72); color: #fff;
    }
    .shot .flag.todo { background: rgba(181,80,42,.9); }
    .shot:hover { border-color: var(--bar); }
    .shot:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; }

    .empty {
      padding: 2.5rem 1.5rem; text-align: center; color: var(--soft);
      background: var(--card); border: 1px dashed var(--line); border-radius: 8px;
    }
    .empty code { background: var(--bg); padding: .1rem .35rem; border-radius: 4px; }

    /* lightbox */
    dialog.viewer {
      border: none; border-radius: 10px; padding: 0; max-width: min(94vw, 1000px);
      max-height: 92vh; background: var(--card); color: var(--ink);
    }
    dialog.viewer::backdrop { background: rgba(20,18,14,.82); }
    dialog.viewer img, dialog.viewer video { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; background: #000; }
    dialog.viewer .info { padding: .9rem 1.1rem; border-top: 1px solid var(--line); }
    dialog.viewer .info h2 { font-size: 1.05rem; }
    dialog.viewer .info p { color: var(--soft); font-size: .85rem; margin-top: .2rem; }
    dialog.viewer .did { margin-top: .5rem; font-size: .8rem; color: var(--soft); }
    dialog.viewer .close {
      position: absolute; top: .5rem; right: .6rem; font: inherit; cursor: pointer;
      border: none; border-radius: 999px; width: 2rem; height: 2rem;
      background: rgba(20,18,14,.62); color: #fff;
    }
    footer { margin-top: 2.5rem; color: var(--soft); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    @media (max-width: 620px) { .topbar .links { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="inner">
      <a class="brand" href="../../index.html">RIC'S TERMINAL</a>
      <span class="wing">· GALLERY</span>
      <span class="links">
        <a href="index.html">the log</a>
        <a href="../../climbing.html">↑ climbing</a>
      </span>
    </div>
  </div>

  <div class="wrap">
    <div class="breadcrumb"><a href="../../climbing.html">Climbing</a> &rsaquo; <a href="index.html">The Log</a> &rsaquo; Gallery</div>
    <h1>Gallery</h1>
    <p class="lede">Photos and video from the trips — dated, and tied to the route where I know it.</p>

    <div class="controls">
      <input type="search" class="search" id="search" autocomplete="off"
             placeholder="Search a route, a crag, a caption or a year">
    </div>
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
    <div id="grid" class="grid"></div>

    <footer>Captions live in <code>photos.md</code> — run <code>import-photos.py</code> after adding files.</footer>
  </div>

  <dialog class="viewer" id="viewer">
    <button class="close" id="close" aria-label="Close">✕</button>
    <div id="viewer-media"></div>
    <div class="info" id="viewer-info"></div>
  </dialog>

  <script src="climbs-data.js"></script>
  <script src="photos-data.js"></script>
  <script src="../relay-return.js" data-home="../../index.html"></script>
  <script>
  (() => {
    const PHOTOS = window.CLIMBING_PHOTOS || [];
    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const chipsEl = document.getElementById("chips");
    const searchEl = document.getElementById("search");
    const viewer = document.getElementById("viewer");

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fmtDate = (iso) => {
      if (!iso) return "Undated";
      const [y, m, d] = iso.split("-").map(Number);
      return `${MONTHS[m - 1]} ${d}, ${y}`;
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
    ));

    if (!PHOTOS.length) {
      countEl.textContent = "";
      grid.outerHTML = `<div class="empty">
        <p>No photos registered yet.</p>
        <p style="margin-top:.5rem">Drop files into <code>projects/climbing/photos/</code>
        and run <code>python3 projects/climbing/import-photos.py</code>.</p></div>`;
      return;
    }

    const years = [...new Set(PHOTOS.map((p) => p.date && p.date.slice(0, 4)).filter(Boolean))].sort().reverse();
    const areas = [...new Set(PHOTOS.map((p) => p.area).filter(Boolean))].sort();
    let state = { q: "", year: null, area: null, only: null };

    function renderChips() {
      const chip = (label, key, value) =>
        `<button class="chip" data-key="${key}" data-value="${esc(value)}" aria-pressed="${state[key] === value}">${esc(label)}</button>`;
      chipsEl.innerHTML = [
        ...years.map((y) => chip(y, "year", y)),
        ...areas.map((a) => chip(a, "area", a)),
        chip("Needs a label", "only", "unlabelled"),
        chip("Video", "only", "video"),
      ].join("");
    }

    function matches(p) {
      const q = state.q.trim().toLowerCase();
      if (state.year && (!p.date || p.date.slice(0, 4) !== state.year)) return false;
      if (state.area && p.area !== state.area) return false;
      if (state.only === "unlabelled" && p.route && p.date) return false;
      if (state.only === "video" && p.type !== "video") return false;
      if (!q) return true;
      return [p.route, p.caption, p.area, p.date, p.file, p.tripRoutes.join(" ")]
        .filter(Boolean).join(" ").toLowerCase().includes(q);
    }

    function render() {
      renderChips();
      const shown = PHOTOS.filter(matches);
      countEl.textContent = `${shown.length} of ${PHOTOS.length} — ${
        PHOTOS.filter((p) => p.route).length} named to a route, ${
        PHOTOS.filter((p) => !p.date).length} still undated`;

      grid.innerHTML = shown.map((p) => {
        const i = PHOTOS.indexOf(p);
        const media = p.type === "video"
          ? `<video src="${esc(p.src)}" muted playsinline preload="metadata"></video>`
          : `<img src="${esc(p.src)}" alt="${esc(p.route || p.caption || "Climbing photo")}" loading="lazy">`;
        const title = p.route || (p.area ? p.area : "Unlabelled");
        const sub = [p.date ? fmtDate(p.date) : "no date yet", p.route ? p.area : null]
          .filter(Boolean).join(" · ");
        const flag = p.type === "video" ? '<span class="flag">video</span>'
          : (!p.route || !p.date) ? '<span class="flag todo">needs a label</span>' : "";
        return `<button class="shot" data-i="${i}">
          ${media}${flag}
          <span class="meta"><b>${esc(title)}</b><span>${esc(sub)}</span></span>
        </button>`;
      }).join("") || `<div class="empty">Nothing matches that.</div>`;
    }

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest(".shot");
      if (!btn) return;
      const p = PHOTOS[Number(btn.dataset.i)];
      document.getElementById("viewer-media").innerHTML = p.type === "video"
        ? `<video src="${esc(p.src)}" controls playsinline></video>`
        : `<img src="${esc(p.src)}" alt="${esc(p.route || p.caption || "Climbing photo")}">`;
      document.getElementById("viewer-info").innerHTML = `
        <h2>${esc(p.route || "Not labelled yet")}</h2>
        <p>${esc([p.date ? fmtDate(p.date) : "No date", p.area].filter(Boolean).join(" · "))}${
          p.approx ? " <em>(date approximate)</em>" : ""}</p>
        ${p.caption ? `<p>${esc(p.caption)}</p>` : ""}
        ${p.tripRoutes.length ? `<div class="did">That day: ${esc(p.tripRoutes.join(" · "))}</div>` : ""}
        ${!p.route ? `<div class="did">Add a route and caption for <code>${esc(p.file)}</code> in photos.md.</div>` : ""}`;
      viewer.showModal();
    });

    document.getElementById("close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
    viewer.addEventListener("close", () => { document.getElementById("viewer-media").innerHTML = ""; });

    chipsEl.addEventListener("click", (e) => {
      const chip = e.target.closest("[data-key]");
      if (!chip) return;
      const { key, value } = chip.dataset;
      state[key] = state[key] === value ? null : value;
      render();
    });
    searchEl.addEventListener("input", () => { state.q = searchEl.value; render(); });

    render();
  })();
  </script>
</body>
</html>
