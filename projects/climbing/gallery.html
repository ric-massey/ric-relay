<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media — Climbing</title>
  <meta name="description" content="Photos and video from Ric's days out, newest first.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a5a40'/><text y='.85em' font-size='68' x='16'>&#129503;</text></svg>">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/climbing/nav.css">
  <link rel="stylesheet" href="../../assets/climbing/climbing.css">
  <style>
    dialog.viewer{border:0;padding:0;background:var(--card);color:var(--ink);position:relative;
      max-width:min(94vw,900px);border-radius:5px;box-shadow:0 30px 80px -30px rgba(20,18,14,.7)}
    dialog.viewer::backdrop{background:rgba(20,18,14,.86)}
    dialog.viewer img,dialog.viewer video{display:block;max-width:100%;max-height:74vh;margin:0 auto;background:#000}
    dialog.viewer .info{padding:.85rem 1.1rem;border-top:1px solid var(--line);
      display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap}
    dialog.viewer .info b{font-size:1rem}
    dialog.viewer .info span{color:var(--soft);font-size:.86rem}
    dialog.viewer .close{position:absolute;top:.4rem;right:.55rem;border:0;cursor:pointer;
      background:rgba(20,18,14,.6);color:#fff;font-size:1.3rem;line-height:1;
      width:2rem;height:2rem;border-radius:50%}
    dialog.viewer nav{margin-left:auto;display:flex;gap:.3rem}
    dialog.viewer nav button{font:inherit;font-size:.85rem;cursor:pointer;background:var(--bg);
      border:1px solid var(--line);border-radius:4px;padding:.25rem .7rem;color:var(--ink)}
  </style>
</head>
<body>

<script src="../../assets/climbing/nav.js" data-nav="media"></script>

<div class="wrap">
  <h1 class="ph">Media</h1>
  <div class="filters" id="filters"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</div>

<dialog class="viewer" id="viewer" aria-label="Media viewer">
  <button class="close" id="vclose" aria-label="Close">&times;</button>
  <div id="vmedia"></div>
  <div class="info" id="vinfo"></div>
</dialog>

<script src="climbs-data.js"></script>
<script src="photos-data.js"></script>
<script src="climb-vocab.js?v=2"></script>
<script src="climb-parse.js?v=2"></script>
<script src="climb-host.js?v=1"></script>
<script src="web-trips.js?v=4"></script>
<script src="climb-media.js?v=4"></script>
<script src="climb-ui.js?v=2"></script>
<script>
(async () => {
  await Promise.all([WebTrips.merge(window.CLIMBING_DATA), ClimbMedia.load()]);

  const DATA = window.CLIMBING_DATA || {};
  const { esc, fmt, crag } = ClimbUI;
  const view = document.getElementById("view");

  /* -- what counts as a climbing photo --
     photos/ holds 38 files named climbing-NN.jpg, and several of them are a
     lake, a snowy road, a view from a trailhead: pictures taken on the same
     phone on the same weekend, not pictures of climbing. Nothing in the file
     says which is which, so the test is the one thing actually known -- the
     media is tied to a day in the log. Anything that goes up through the add
     form is tied to a day by construction, and a repo photo qualifies once its
     date lands on a day he logged, or it names a route.

     Showing the whole folder instead is how a climbing gallery ends up leading
     with a picture of a lake. */
  const byDate = {};
  (DATA.trips || []).forEach(t => { if (t.date) byDate[t.date] = t; });

  const items = [];
  let loose = 0;

  (window.CLIMBING_PHOTOS || []).forEach(p => {
    const day = p.tripDate && byDate[p.tripDate];
    if (!day && !p.route) { loose++; return; }
    items.push({
      kind: p.type === "video" ? "video" : "photo",
      src: p.src, date: p.tripDate || p.date,
      /* Only a route the photo itself names. Falling back to the day's first
         route labelled four different photos "Bathtub Mary" because they came
         off the same afternoon — a guess, repeated, and wrong three times. The
         crag is the thing actually known. */
      route: p.route || null,
      where: crag(p.area || (day && day.area) || "") || null,
      caption: p.caption || null,
    });
  });

  /* Everything the phone sent up, which is attached to a day already. */
  (DATA.trips || []).forEach(t => {
    if (!t.date) return;
    ClimbMedia.of(t.date).forEach(m => items.push({
      kind: m.kind === "video" ? "video" : "photo",
      src: m.src, date: t.date,
      route: m.route || null, where: crag(t.area || "") || null, caption: m.caption || null,
    }));
  });

  items.sort((a, b) => String(b.date).localeCompare(String(a.date)));

  const FILTERS = [
    ["all", "Everything", () => true],
    ["video", "Video", i => i.kind === "video"],
    ["photo", "Photos", i => i.kind === "photo"],
  ];
  let filter = "all";
  /* What the arrows walk. Prev/Next used to step through every item rather
     than the ones on screen, so from "Video" the next tile was a photo the
     filter had just hidden. */
  let shownNow = items;

  const label = i => [fmt(i.date), i.route || i.where].filter(Boolean).join(" · ");

  function render() {
    document.getElementById("filters").innerHTML = FILTERS.map(([id, t, fn]) =>
      `<button data-f="${id}"${filter === id ? ' class="on"' : ""}>` +
      `${esc(t)} ${items.filter(fn).length}</button>`).join("");

    const shown = items.filter((FILTERS.find(f => f[0] === filter) || FILTERS[0])[2]);
    shownNow = shown;
    if (!shown.length) { view.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }

    /* Grouped by year, newest first, with repo photos and phone clips in one
       grid -- which bucket a file lives in is not something anyone looking at
       the page should have to think about. */
    const years = [];
    shown.forEach(i => {
      const y = String(i.date).slice(0, 4);
      const last = years[years.length - 1];
      if (last && last.y === y) last.items.push(i); else years.push({ y, items: [i] });
    });

    view.innerHTML = years.map(({ y, items: list }) =>
      `<div class="head" style="margin-top:2.2rem"><h2>${esc(y)}</h2>` +
      `<span class="more" style="color:var(--soft)">${list.length}</span></div>` +
      `<div class="tiles">` + list.map(i => {
        const n = shown.indexOf(i);
        const inner = i.kind === "video"
          ? `<video src="${esc(i.src)}" preload="metadata" muted loop playsinline></video>` +
            `<span class="play" aria-hidden="true"></span>`
          : `<img src="${esc(i.src)}" loading="lazy" alt="${esc(label(i))}">`;
        return `<figure class="tile${i.kind === "video" ? " vid" : ""}" data-i="${n}" tabindex="0">` +
               `${inner}<figcaption>${esc(label(i))}</figcaption></figure>`;
      }).join("") + `</div>`).join("");
  }

  /* -- the viewer --
     One dialog reused by every tile rather than one per thumbnail: a page of
     <video> elements all holding a connection is how a gallery with a few
     years in it becomes unopenable on a phone. */
  const dlg = document.getElementById("viewer");
  const vmedia = document.getElementById("vmedia");
  const vinfo = document.getElementById("vinfo");
  let at = 0;

  function open(n) {
    at = (n + shownNow.length) % shownNow.length;
    const i = shownNow[at];
    vmedia.innerHTML = i.kind === "video"
      ? `<video src="${esc(i.src)}" controls autoplay playsinline></video>`
      : `<img src="${esc(i.src)}" alt="${esc(label(i))}">`;
    vinfo.innerHTML =
      `<b>${esc(i.route || i.where || fmt(i.date, true))}</b>` +
      `<span>${esc([fmt(i.date, true), i.route ? i.where : null, i.caption]
        .filter(Boolean).join(" · "))}</span>` +
      `<nav><button data-step="-1">&lsaquo; Prev</button>` +
      `<button data-step="1">Next &rsaquo;</button></nav>`;
    if (!dlg.open) dlg.showModal();
  }

  view.addEventListener("click", e => {
    const t = e.target.closest("[data-i]");
    if (t) open(+t.dataset.i);
  });
  view.addEventListener("keydown", e => {
    const t = e.target.closest("[data-i]");
    if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(+t.dataset.i); }
  });
  vinfo.addEventListener("click", e => {
    const b = e.target.closest("[data-step]");
    if (b) open(at + +b.dataset.step);
  });
  document.getElementById("vclose").addEventListener("click", () => dlg.close());
  /* Stop the clip when the dialog goes, or it plays on out of sight. */
  dlg.addEventListener("close", () => { vmedia.innerHTML = ""; });
  dlg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); open(at + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); open(at - 1); }
  });

  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest("[data-f]");
    if (b) { filter = b.dataset.f; render(); }
  });

  render();

  document.getElementById("foot").innerHTML =
    "Everything here is tied to a day in the log. " +
    (loose > 0
      ? `${loose} file${loose === 1 ? "" : "s"} in <code>photos/</code> ` +
        `${loose === 1 ? "is" : "are"} not — no date, or a date that lands on no day out — ` +
        `so ${loose === 1 ? "it stays" : "they stay"} off the page. ` +
        `Attaching one to a day in <a href="add.html">the add form</a> brings it in.`
      : "");
})();
</script>

</body>
</html>
