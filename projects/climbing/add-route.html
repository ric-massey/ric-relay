<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Add a route — Climbing</title>
  <meta name="description" content="Add a route to the tick list.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a5a40'/><text y='.85em' font-size='68' x='16'>&#129503;</text></svg>">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/climbing-nav.css">
  <link rel="stylesheet" href="../../assets/climbing.css">
  <style>
    form{max-width:640px}
    .field{margin-bottom:1rem}
    .field label{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
                 color:var(--soft);font-weight:600;margin-bottom:.3rem}
    .field input,.field select,.field textarea{
      width:100%;font:inherit;font-size:1rem;padding:.62rem .8rem;background:var(--card);
      border:1px solid var(--line);border-radius:4px;color:var(--ink)}
    .field textarea{min-height:4.5rem;resize:vertical}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
    .btn{font:inherit;font-weight:700;cursor:pointer;background:var(--bar);color:#fff;
         border:1px solid var(--bar);border-radius:4px;padding:.66rem 1.3rem}
    .btn.ghost{background:transparent;color:var(--soft);border-color:var(--line);font-weight:600}
    .said{margin:1rem 0;padding:.7rem 1rem;border-radius:4px;font-size:.92rem}
    .said.good{background:#e4efe4;color:#22562c}
    .said.bad{background:#f8e2d9;color:#8d3417}
    .mine{border-top:1px solid var(--line);margin-top:2.5rem;padding-top:1.2rem}
    .mine .rt button{font:inherit;font-size:.76rem;cursor:pointer;background:transparent;
      border:1px solid var(--line);border-radius:3px;padding:.1rem .5rem;color:var(--soft)}
    .mine .rt button:hover{color:var(--clay);border-color:var(--clay)}
    @media(max-width:600px){.two,.three{grid-template-columns:1fr}}
  </style>
</head>
<body>

<script src="../../assets/climbing-nav.js" data-nav="list"></script>

<div class="wrap">
  <h1 class="ph">Add a route</h1>
  <p class="count">Something you want to get on. It lands on <a href="list.html">the list</a>.</p>

  <div id="signin"></div>
  <div id="said"></div>

  <form id="form" hidden>
    <div class="field">
      <label for="name">Route</label>
      <input type="text" id="name" required placeholder="Cobra Crack" autocomplete="off">
    </div>

    <div class="three">
      <div class="field">
        <label for="grade">Grade</label>
        <input type="text" id="grade" placeholder="5.14b or V7" autocomplete="off">
      </div>
      <div class="field">
        <label for="style">Style</label>
        <select id="style">
          <option value="">—</option>
          <option>Sport</option><option>Trad</option><option>Boulder</option>
          <option>Mixed</option><option>Aid</option>
        </select>
      </div>
      <div class="field">
        <label for="lengthFt">Length</label>
        <input type="number" id="lengthFt" min="1" max="9999" inputmode="numeric" placeholder="ft">
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="crag">Crag</label>
        <!-- A picker, not a text box. todo.md spells PMRP four ways and
             Northern Gorge five because every entry was typed fresh; the
             existing crags are offered so the list stops growing new spellings
             of places he already climbs. -->
        <input type="text" id="crag" list="crags" placeholder="PMRP" autocomplete="off">
        <datalist id="crags"></datalist>
      </div>
      <div class="field">
        <label for="wall">Wall or sector</label>
        <input type="text" id="wall" list="walls" placeholder="The Motherload" autocomplete="off">
        <datalist id="walls"></datalist>
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="pitches">Pitches</label>
        <input type="number" id="pitches" min="1" max="99" inputmode="numeric" placeholder="1">
      </div>
      <div class="field">
        <label for="note">Note</label>
        <input type="text" id="note" placeholder="Why you want it" autocomplete="off">
      </div>
    </div>

    <button type="submit" class="btn" id="save">Add it to the list</button>
  </form>

  <div class="mine" id="mine" hidden>
    <div class="head"><h2>Added from here</h2></div>
    <div class="routes" id="minelist"></div>
  </div>

  <footer>
    Days out go in <a href="add.html">the other form</a>.
  </footer>
</div>

<script src="../../assets/owner.js"></script>
<script src="climbs-data.js"></script>
<script src="climb-ui.js?v=1"></script>
<script src="web-todo.js?v=1"></script>
<script>
(async () => {
  const HOST = WebTodo.host();
  const { esc, row, crag: fold } = ClimbUI;
  const $ = s => document.querySelector(s);
  const said = $("#said");

  function say(msg, good) {
    said.innerHTML = msg ? `<div class="said ${good ? "good" : "bad"}">${esc(msg)}</div>` : "";
  }

  /* The crags and walls he already uses, offered rather than retyped. */
  const DATA = window.CLIMBING_DATA || {};
  const crags = new Set(), walls = new Set();
  (DATA.todo || []).forEach(t => {
    const [c, w] = String(t.location || "").split(",").map(x => x.trim());
    if (c) crags.add(fold(c));
    if (w) walls.add(w);
  });
  (DATA.trips || []).forEach(t => {
    if (t.area) crags.add(fold(t.area));
    t.routes.forEach(r => { if (r.wall) walls.add(r.wall); });
  });
  const fill = (id, set) => {
    document.getElementById(id).innerHTML =
      [...set].sort((a, b) => a.localeCompare(b)).map(v => `<option value="${esc(v)}">`).join("");
  };
  fill("crags", crags);
  fill("walls", walls);

  let mine = [];

  async function paint() {
    const on = Owner.on();
    $("#form").hidden = !on;
    $("#mine").hidden = !on;
    if (!on) {
      $("#signin").innerHTML = "";
      Owner.mountBox($("#signin"), { title: "Password" });
      return;
    }
    $("#signin").innerHTML =
      `<p class="count">Signed in. <button class="btn ghost" id="out">Sign out</button></p>`;
    $("#out").onclick = () => Owner.signOut();
    await refresh();
  }

  async function refresh() {
    const items = await WebTodo.fetchItems();
    mine = Object.values(items).sort((a, b) => String(b.added).localeCompare(String(a.added)));
    $("#minelist").innerHTML = mine.length
      ? mine.map(it => {
          const meta = [it.style, it.wall, it.lengthFt ? `${it.lengthFt}ft` : null]
            .filter(Boolean).join(" · ");
          return `<div class="rt"><span class="nm">${esc(it.name)}</span>` +
            `<span class="dot"></span>` +
            (meta ? `<span class="meta">${esc(meta)}</span>` : "") +
            (it.grade ? `<span class="g ${ClimbUI.band(it.grade)}">${esc(it.grade)}</span>` : "") +
            `<button data-del="${esc(it.id)}" title="Take it off the list">remove</button></div>`;
        }).join("")
      : '<p class="count">Nothing added from here yet.</p>';
  }

  $("#minelist").addEventListener("click", async e => {
    const b = e.target.closest("[data-del]");
    if (!b) return;
    b.disabled = true;
    const out = await Owner.post(`/todo/${b.dataset.del}`, { remove: true });
    if (out) { say("Taken off the list.", true); await refresh(); }
    else { say("Could not reach the log service.", false); b.disabled = false; }
  });

  $("#form").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#name").value.trim();
    if (!name) return;
    const grade = $("#grade").value.trim();
    const boulder = /^[Vv]\d/.test(grade);

    $("#save").disabled = true;
    const out = await Owner.post("/todo", {
      name,
      grade,
      /* Ranked here, where the vocabulary lives, so the list can sort a route
         added from a phone next to one out of climbs.md. */
      gradeKind: grade ? (boulder ? "boulder" : "rope") : null,
      gradeRank: rank(grade),
      style: $("#style").value || (boulder ? "Boulder" : null),
      crag: $("#crag").value.trim(),
      wall: $("#wall").value.trim(),
      pitches: $("#pitches").value || null,
      lengthFt: $("#lengthFt").value || null,
      note: $("#note").value.trim(),
    });
    $("#save").disabled = false;

    if (!out) { say("Could not reach the log service. Nothing was saved.", false); return; }
    say(`${name} is on the list.`, true);
    $("#form").reset();
    $("#name").focus();
    await refresh();
  });

  /* Same shape as build-data.py's ranking, so the two sort together. */
  function rank(g) {
    let m = /^5\.(\d+)([a-d])?/.exec(g || "");
    if (m) return Math.round(20 + (+m[1]) * 2 + (m[2] ? "abcd".indexOf(m[2]) * 0.4 : 0));
    m = /^[Vv](\d+)/.exec(g || "");
    if (m) return Math.round(40 + (+m[1]) * 2);
    return 0;
  }

  Owner.init({ host: HOST, onChange: paint });
  paint();
})();
</script>

</body>
</html>
