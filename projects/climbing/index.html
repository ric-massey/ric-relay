<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Climbing Log — Ric's Terminal</title>
  <meta name="description" content="Every climb Ric has recorded outside — searchable by route, crag, date and partner.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ric's Terminal">
  <meta property="og:title" content="The Climbing Log — Ric's Terminal">
  <meta property="og:description" content="Every climb Ric has recorded outside — searchable by route, crag, date and partner.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a5a40'/><text y='.85em' font-size='68' x='16'>🧗</text></svg>">
  <style>
    :root {
      --bar: #3a5a40;
      --bar-dark: #2d4632;
      --bg: #f4f1e9;
      --card: #ffffff;
      --ink: #26241f;
      --soft: #6f6a5f;
      --line: #e2ddd0;
      --clay: #b14f2a;
      --star: #e0a021;
      --sent: #2f8f4e;
      --proj: #c77d1a;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
      font-size: 15px;
      padding-bottom: 5rem;
    }

    a { color: var(--clay); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── top bar ─────────────────────────────────────────── */
    .topbar { background: var(--bar); color: #eef3ee; }
    .topbar .inner {
      max-width: 1000px; margin: 0 auto; padding: .7rem 1.25rem;
      display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
    }
    .topbar .brand { color: #fff; font-weight: 800; letter-spacing: .16em; font-size: .85rem; }
    .topbar .brand:hover { text-decoration: none; color: #d7e6d7; }
    .topbar .wing { color: #b8ccbb; font-size: .85rem; letter-spacing: .16em; }
    .topbar .up { margin-left: auto; color: #cfe0d1; font-size: .78rem; padding: .28rem .7rem; border-radius: 5px; }
    .topbar .up:hover { color: #fff; background: rgba(255,255,255,.12); text-decoration: none; }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 1.6rem 1.25rem 3rem; }

    .breadcrumb { color: var(--soft); font-size: .85rem; margin-bottom: .5rem; }
    .breadcrumb a { color: var(--soft); }
    h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.01em; }
    .lede { color: var(--soft); margin: .3rem 0 1.4rem; }

    /* ── the most recent trip, front and centre ──────────── */

    /* ── stat strip ──────────────────────────────────────── */

    /* ── controls ────────────────────────────────────────── */
    .controls { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: .7rem 0; border-bottom: 1px solid var(--line); }
    .search {
      width: 100%; padding: .65rem .85rem; font-size: 1rem; font-family: inherit; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    }
    .search:focus { outline: 2px solid var(--bar); outline-offset: 1px; border-color: var(--bar); }


    .chips { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .45rem; }
    .chip {
      font: inherit; font-size: .74rem; cursor: pointer; padding: .22rem .65rem;
      border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--soft);
    }
    .chip:hover { border-color: var(--clay); color: var(--clay); }
    .chip[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); color: #fff; }
    .chip.clear { border-style: dashed; }

    .count { color: var(--soft); font-size: .78rem; margin: .9rem 0 .5rem; }

    /* ── trips ───────────────────────────────────────────── */
    .trip {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: .95rem 1.1rem; margin-bottom: .8rem;
    }
    .trip > header { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
    .trip .date { font-weight: 700; font-size: 1rem; color: var(--ink); }
    .trip .date:hover { color: var(--clay); }
    .trip.opened { border-color: var(--bar); box-shadow: 0 0 0 3px rgba(58,90,64,.12); }
    .hidden-note {
      margin-top: .5rem; padding: .35rem .6rem; border-radius: 5px;
      background: var(--bg); color: var(--soft); font-size: .78rem; font-style: italic;
    }
    .trip .area { color: var(--clay); font-size: .9rem; }
    .trip .tally { margin-left: auto; color: var(--soft); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; }
    .trip .note { margin-top: .7rem; color: var(--soft); font-size: .86rem; white-space: pre-wrap; }
    .trip .people { margin-top: .55rem; display: flex; gap: .3rem; flex-wrap: wrap; }

    .who {
      font: inherit; font-size: .72rem; cursor: pointer; padding: .1rem .55rem;
      border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--soft);
    }
    .who:hover { border-color: var(--bar); color: var(--bar); }

    .walls { margin-top: .7rem; display: grid; gap: .6rem; }
    .wall .wname {
      color: var(--soft); font-size: .7rem; text-transform: uppercase;
      letter-spacing: .08em; border-bottom: 1px solid var(--line); padding-bottom: .2rem; margin-bottom: .3rem;
    }
    .route { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; padding: .16rem 0; }
    .route .rname { font-weight: 600; }
    .route .rname mark { background: #fdf0c8; color: inherit; border-radius: 2px; }
    .grade {
      font-weight: 700; font-size: .8rem; background: var(--bg);
      border: 1px solid var(--line); border-radius: 5px; padding: .02rem .4rem; white-space: nowrap;
    }
    .grade.boulder { background: #efe9f6; border-color: #ded2ec; }
    .fav { color: var(--star); }
    .rep { color: var(--soft); font-size: .76rem; }
    .style { color: var(--sent); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
    .style.attempt { color: var(--proj); }
    .rnote { color: var(--soft); font-size: .78rem; }

    /* ── ranked tables (routes / people) ─────────────────── */
    .rank { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .rank .row {
      display: grid; grid-template-columns: 2.2rem 1fr auto auto; gap: .5rem .8rem;
      align-items: center; padding: .55rem .9rem; border-bottom: 1px solid var(--line);
    }
    .rank .row:last-child { border-bottom: none; }
    .rank .row:hover { background: #faf8f3; }
    .rank .pos { color: var(--soft); font-size: .8rem; font-weight: 700; text-align: right; }
    .rank .sub { color: var(--soft); font-size: .77rem; }
    .rank .big { font-weight: 700; white-space: nowrap; }
    .rank .bar { grid-column: 2 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .rank .bar i { display: block; height: 100%; background: var(--bar); }

    .empty { padding: 1.4rem 1rem; color: var(--soft); font-style: italic; text-align: center; }
    footer { margin-top: 2.5rem; color: var(--soft); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 1rem; }

    /* ── a day, shut ─────────────────────────────────────
       The whole header is the button. Not a caret at the end of it: this gets
       opened on a phone by somebody scrolling with one thumb, and a 12px arrow
       is a target you miss. */
    .trip > header.tophead {
      display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
      width: 100%; text-align: left; font: inherit; color: inherit;
      background: none; border: 0; padding: 0; cursor: pointer;
    }
    .trip > header.tophead:hover .date { color: var(--clay); }
    .trip .caret {
      margin-left: auto; color: var(--soft); font-size: .8rem;
      transition: transform .15s ease; flex: 0 0 auto;
    }
    .trip.opened .caret { transform: rotate(90deg); }
    .trip .tally + .caret { margin-left: .5rem; }
    /* One line of the note, and only one — the point of a shut day is that a
       year of them can be read by scrolling. */
    .trip .peek {
      flex-basis: 100%; color: var(--soft); font-size: .85rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .trip .peek .cnt { color: var(--bar); font-weight: 700; }
    .trip .body[hidden] { display: none; }

    /* ── media ───────────────────────────────────────────
       Thumbnails, not players. The <video> only comes into being when a clip is
       actually opened; before that a poster-less video tag would have every
       browser fetching metadata for every clip on the page at once. */
    .media { margin-top: .8rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    .media .m {
      position: relative; width: 116px; height: 86px; border-radius: 7px; overflow: hidden;
      border: 1px solid var(--line); background: #ece7dc; cursor: pointer; padding: 0;
      flex: 0 0 auto; display: block;
    }
    .media .m img, .media .m video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media .m .play {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(0,0,0,.28); color: #fff; font-size: 1.6rem; text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
    .media .m .kill {
      position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; line-height: 1;
      border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
      font-size: .9rem; cursor: pointer; display: none;
    }
    .owner-on .media .m .kill { display: block; }
    .media .m .rt {
      position: absolute; left: 0; right: 0; bottom: 0; padding: .1rem .35rem;
      background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff;
      font-size: 0.69rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── the featured clip on the most recent day ──────── */

    /* ── adding it ───────────────────────────────────────
       Only ever rendered for the signed-in owner. A visitor being shown an
       upload box is a confusing lie, and one that returns 401 at that. */
    .add {
      margin-top: .8rem; padding: .6rem .7rem; border: 1px dashed var(--line);
      border-radius: 8px; background: var(--bg);
      display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    }
    .add label.pick {
      cursor: pointer; font-size: .8rem; font-weight: 700; padding: .35rem .8rem; min-height: 38px;
      display: inline-flex; align-items: center;
      border: 1px solid var(--bar); border-radius: 7px; background: var(--bar); color: #fff;
    }
    .add input[type=file] { display: none; }
    .add input[type=text] {
      font: inherit; font-size: .82rem; padding: .3rem .5rem; min-height: 38px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink);
      flex: 1 1 9rem; min-width: 0;
    }
    .add .say { flex-basis: 100%; color: var(--soft); font-size: .78rem; }
    .add .say.bad { color: var(--clay); font-weight: 700; }
    .add .bar { flex-basis: 100%; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .add .bar i { display: block; height: 100%; background: var(--bar); width: 0; transition: width .15s linear; }

    /* ── sign in ─────────────────────────────────────── */
    #ownerbar { margin-bottom: 1.2rem; }
    .ownerform { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .ownerlabel { font-weight: 700; font-size: .82rem; }
    .ownerform input {
      font: inherit; font-size: .85rem; padding: .35rem .55rem; min-height: 40px;
      border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--ink); flex: 0 1 12rem;
    }
    .ownerform button {
      font: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; min-height: 40px; padding: .35rem .9rem;
      border: 1px solid var(--bar); border-radius: 7px; background: var(--bar); color: #fff;
    }
    .ownermsg { flex-basis: 100%; color: var(--clay); font-size: .78rem; }
    .signedin {
      display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
      background: var(--bar); color: #fff; border-radius: 8px; padding: .5rem .8rem; font-size: .85rem;
    }
    .signedin button {
      font: inherit; font-size: .78rem; cursor: pointer; margin-left: auto; padding: .2rem .7rem;
      border: 1px solid #fff; border-radius: 6px; background: #fff; color: var(--bar); font-weight: 700;
    }

    /* ── the player ──────────────────────────────────────
       A dark room around the clip rather than a bordered box on a beige page:
       the thing being looked at is a video, and everything else should get out
       of its way. Three rows — where and when, the clip, the caption — so the
       chrome never sits on top of the picture. */
    dialog.viewer {
      border: 0; border-radius: 14px; padding: 0; background: #16150f; color: #f2efe6;
      max-width: min(1100px, 96vw); max-height: 96vh; width: auto; overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      /* A modal dialog centres itself with `margin: auto` — which the `*` reset
         at the top of this file sets to 0, so it opened pinned to the top-left
         corner instead. Put it back explicitly rather than carving an exception
         into the reset. */
      margin: auto;
    }
    dialog.viewer::backdrop { background: rgba(12,11,8,.88); backdrop-filter: blur(3px); }
    dialog.viewer[open] { animation: vpop .16s ease-out; }
    @keyframes vpop { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }

    .vtop {
      display: flex; align-items: center; gap: .6rem; padding: .6rem .7rem .55rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .vwhere { flex: 1 1 auto; min-width: 0; font-size: .82rem; color: #a9a291; letter-spacing: .04em; text-transform: uppercase; }
    .vclose {
      flex: 0 0 auto; font: inherit; font-size: 1.4rem; line-height: 1; cursor: pointer;
      border: 0; background: rgba(255,255,255,.07); color: #f2efe6;
      border-radius: 9px; width: 40px; height: 40px;
    }
    .vclose:hover { background: rgba(255,255,255,.16); }

    /* The clip sits on black, and the arrows sit beside it rather than over it —
       an arrow floating on the picture is an arrow covering the hold you were
       trying to see. */
    .vstage { position: relative; display: flex; align-items: center; background: #000; }
    .vstage #vmedia { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
    /* Naming a clip, from inside the viewer that is showing it — which is the
       only moment you actually know which route it was. */
    .vname { flex: 1 0 100%; display: flex; gap: .4rem; margin-bottom: .15rem; }
    .vname input {
      flex: 1 1 auto; min-width: 0; font: inherit; font-size: .9rem; padding: .45rem .6rem;
      border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
      background: rgba(255,255,255,.08); color: #f2eee2;
    }
    .vname input::placeholder { color: rgba(242,238,226,.55); }
    .vname button {
      font: inherit; font-size: .85rem; font-weight: 700; padding: .45rem .9rem; cursor: pointer;
      border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
      background: rgba(255,255,255,.14); color: #f2eee2;
    }
    .vname button:disabled { opacity: .55; cursor: default; }
    dialog.viewer video, dialog.viewer img {
      display: block; max-width: 100%; max-height: min(74vh, 720px); background: #000;
    }
    .vnav {
      flex: 0 0 auto; align-self: stretch; width: 52px; font: inherit; font-size: 1.9rem; line-height: 1;
      cursor: pointer; border: 0; background: rgba(255,255,255,.05); color: #f2efe6;
    }
    .vnav:hover { background: rgba(255,255,255,.14); }
    .vnav[disabled] { opacity: .22; cursor: default; background: none; }

    .vfoot {
      display: flex; align-items: baseline; gap: .8rem; padding: .65rem 1rem .8rem;
      border-top: 1px solid rgba(255,255,255,.08); flex-wrap: wrap;
    }
    .vcap { flex: 1 1 auto; font-size: .88rem; color: #cdc7b8; }
    .vcap strong { color: #fff; }
    .vcount { flex: 0 0 auto; font-size: .76rem; color: #8d8878; font-variant-numeric: tabular-nums; }

    @media (max-width: 620px) {
      /* Arrows under the thumb, not at arm's length, and a stage that uses the
         whole width — a 52px rail either side of a portrait phone clip leaves
         almost nothing for the clip. */
      .vstage { flex-wrap: wrap; }
      .vstage #vmedia { flex-basis: 100%; order: 1; }
      .vnav { order: 2; flex: 1 1 0; align-self: auto; height: 52px; width: auto; }
      .vnav.next { order: 3; }
      dialog.viewer video, dialog.viewer img { max-height: 62vh; }
    }

    @media (max-width: 620px) {
      .trip .tally { margin-left: 0; width: 100%; }
      .trip .tally + .caret { margin-left: auto; }
      .rank .row { grid-template-columns: 1.8rem 1fr auto; }
      .topbar .up { margin-left: 0; }
      .media .m { width: 96px; height: 72px; }
    }
  
    /* ── the day rows, tightened ──
       Every day was a white card with a border, a radius and 1.1rem of padding,
       so 74 of them ran to about 9,500px — the archive was mostly whitespace
       between days. A day is a row now: a rule under it, the date and the crag
       on one line, and the peek kept to one line so the rows stay the same
       height and the eye can run down them. The card only comes back when a
       day is open, which is the one time it is a card. */
    .trip {
      background: transparent; border: 0; border-radius: 0; box-shadow: none;
      border-bottom: 1px solid var(--line); padding: .1rem 0; margin: 0;
    }
    /* Centred, not baseline-aligned: the pitch tally is a smaller face, and on
       a baseline the rows carrying one stood taller than the rows without, so
       the run of days had a stutter in it. */
    .trip > header.tophead {
      padding: .62rem .25rem; gap: .55rem; flex-wrap: nowrap;
      align-items: center; min-height: 2.9rem;
    }
    /* One fixed height for every shut day, so the run of them has no stutter
       whatever a row happens to carry. */
    .trip:not(.opened) > header.tophead { height: 3.1rem; overflow: hidden; }
    .trip > header.tophead:hover { background: #faf8f2; }
    .trip .date { font-size: .95rem; white-space: nowrap; }
    .trip .area { white-space: nowrap; }
    .trip .peek {
      flex: 1 1 0; min-width: 0; margin: 0 .4rem 0 .5rem; color: var(--soft);
      font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .trip .tally { margin-left: 0; white-space: nowrap; }
    .trip .caret { margin-left: 0; }
    .trip.opened {
      background: var(--card); border: 1px solid var(--line); border-radius: 4px;
      box-shadow: 0 0 0 3px rgba(58,90,64,.10); margin: .5rem 0; padding: .2rem .9rem .9rem;
    }
    .trip.opened > header.tophead { padding-left: 0; padding-right: 0; }
    @media (max-width: 620px) {
      .trip > header.tophead { flex-wrap: wrap; }
      .trip .peek { flex-basis: 100%; margin: .15rem 0 0; }
    }
</style>

<body>
  <script src="../../assets/climbing-nav.js" data-nav="log"></script>

  <div class="wrap">
    <h1 class="ph">The log</h1>

    <!-- The tally and the most recent day live on the room page now. This page
         is the archive and nothing else. -->

    <div class="controls">
      <input type="search" class="search" id="search" autocomplete="off"
             aria-label="Search the logbook"
             placeholder="Search a route, crag, partner, date or grade — try “Cavers”, “Lane”, “V5”, “2023”">
      <div class="chips" id="chips"></div>
    </div>

    <p class="count" id="count"></p>
    <div id="view"></div>

    <!-- Signed out this is a password box; signed in it is a line saying so.
         It used to sit third from the top, so the first thing a stranger met
         after the numbers was a password prompt. Owner mode is a rendering
         hint — assets/owner.js says why at length. -->
    <div id="ownerbar"></div>

    <footer>
      Built from <code>climbs.md</code> — grades are opinions, memory is worse.
      <span id="stamp"></span>
    </footer>
  </div>

  <!-- The player. One dialog reused by every thumbnail on the page rather than
       one per clip: a hundred <video> elements all holding a connection is how
       a log page with a few years in it becomes unopenable on a phone. -->
  <dialog class="viewer" id="viewer" aria-label="Media viewer">
    <div class="vtop">
      <div class="vwhere" id="vwhere"></div>
      <button class="vclose" id="vclose" aria-label="Close">&times;</button>
    </div>
    <div class="vstage">
      <button class="vnav prev" id="vprev" aria-label="Previous">&lsaquo;</button>
      <div id="vmedia"></div>
      <button class="vnav next" id="vnext" aria-label="Next">&rsaquo;</button>
    </div>
    <div class="vfoot">
      <!-- Owner only. Most clips arrive from a crag with no route on them,
           because nothing at a crag asks; this is where that gets fixed. -->
      <form class="vname" id="vname" hidden>
        <input type="text" id="vroute" list="vroutes" placeholder="Which route is this?" autocomplete="off">
        <datalist id="vroutes"></datalist>
        <button type="submit" id="vsave">Save</button>
      </form>
      <div class="vcap" id="vcap"></div>
      <div class="vcount" id="vcount"></div>
    </div>
  </dialog>

  <script src="../../assets/owner.js"></script>
  <script src="climbs-data.js"></script>
  <script src="climb-vocab.js?v=2"></script>
  <script src="climb-parse.js?v=2"></script>
  <script src="climb-host.js?v=1"></script>
  <script src="web-trips.js?v=4"></script>
  <script src="climb-media.js?v=4"></script>
  <script src="../relay-return.js" data-home="../../index.html"></script>
  <script>
  (async () => {
    /* ── days logged from a phone ──
       The fetch and the reshaping live in web-trips.js, because climbing.html
       needs exactly the same thing and this page having its own private copy
       is precisely why the room page went weeks without showing one.

       The whole render waits on it. It is one small request and the
       alternative is the page painting once and jumping. If the log service is
       unreachable the merge is skipped and the archive renders alone. */
    /* Both at once. They are independent — one asks the log service what was
       climbed, the other what was filmed — and doing them in sequence made the
       page wait for the sum of two round trips to paint anything. */
    await Promise.all([
      WebTrips.merge(window.CLIMBING_DATA),
      ClimbMedia.load()
    ]);

    const DATA = window.CLIMBING_DATA;
    const view = document.getElementById("view");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("search");
    const chipsEl = document.getElementById("chips");

    if (!DATA) {
      view.innerHTML = '<p class="empty">climbs-data.js is missing — run <code>python3 build-data.py</code>.</p>';
      return;
    }

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fmtDate = (iso) => {
      if (!iso) return "Undated";
      const [y, m, d] = iso.split("-").map(Number);
      return `${MONTHS[m - 1]} ${d}, ${y}`;
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
    ));

    /* A trip's key is its id, its toggle handle and its deep-link anchor. The
       date alone is not unique — two days at the Red River share 2023-07-07,
       and every undated day is "undated" — so identical keys meant duplicate
       DOM ids, and, because the open-set is keyed on this, tapping one of the
       pair silently opened both. The first day on a date keeps the bare key so
       the #trip-YYYY-MM-DD links already out on the site still land; a second
       one is suffixed. */
    const keySeen = new Map();
    DATA.trips.forEach((trip) => {
      const base = trip.date || trip.dateRaw || "undated";
      const n = (keySeen.get(base) || 0) + 1;
      keySeen.set(base, n);
      trip._key = n === 1 ? base : `${base}-${n}`;
    });

    // Precompute one lowercase haystack per trip so search stays instant.
    DATA.trips.forEach((trip) => {
      trip._hay = [
        trip.date, trip.dateRaw, trip.area, trip.notes, trip.people.join(" "),
        trip.routes.map((r) => [r.name, r.grade, r.region, r.wall, r.styles.join(" ")].join(" ")).join(" "),
      ].join(" ").toLowerCase();
    });

    /* `open` is a set of dates rather than a single one, so opening a second day
       does not shut the first. It used to be read off location.hash, which meant
       exactly one day could be open and reading two required going back. */
    let state = { q: "", filter: null, person: null, open: new Set() };

    /* ── filter chips ─────────────────────────────────── */
    const FILTERS = [
      { id: "fav",     label: "★ Favourites & projects", test: (r) => r.star },
      { id: "sent",    label: "Sends",                   test: (r) => r.outcome === "sent" },
      { id: "attempt", label: "Projects / attempts",     test: (r) => r.outcome === "attempt" },
      { id: "rope",    label: "Ropes",                   test: (r) => r.gradeKind === "rope" },
      { id: "boulder", label: "Boulders",                test: (r) => r.gradeKind === "boulder" },
    ];

    function renderChips() {
      const parts = FILTERS.map((f) => (
        `<button class="chip" data-filter="${f.id}" aria-pressed="${state.filter === f.id}">${esc(f.label)}</button>`
      ));
      if (state.person) {
        parts.push(`<button class="chip clear" data-clear-person aria-pressed="true">with ${esc(state.person)} ✕</button>`);
      }
      chipsEl.innerHTML = parts.join("");
    }

    const activeFilter = () => FILTERS.find((f) => f.id === state.filter) || null;

    /* ── route rendering ──────────────────────────────── */
    function routeHTML(r, q) {
      let name = esc(r.name);
      if (q) {
        const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
        name = name.replace(re, "<mark>$1</mark>");
      }
      const bits = [];
      if (r.star) bits.push('<span class="fav" title="Favourite or project">★</span>');
      bits.push(`<span class="rname">${name}</span>`);
      if (r.grade) bits.push(`<span class="grade ${r.gradeKind === "boulder" ? "boulder" : ""}">${esc(r.grade)}</span>`);
      if (r.repeats > 1) bits.push(`<span class="rep">×${r.repeats}</span>`);
      if (r.outcome === "attempt") bits.push('<span class="style attempt">project</span>');
      else if (r.styles.length) bits.push(`<span class="style">${esc(r.styles[0])}</span>`);
      if (r.note) bits.push(`<span class="rnote">${esc(r.note)}</span>`);
      return `<div class="route">${bits.join(" ")}</div>`;
    }

    function wallsHTML(routes, q) {
      // Group consecutive routes by the wall they were climbed on.
      const groups = [];
      routes.forEach((r) => {
        const key = [r.region, r.wall].filter(Boolean).join(" › ");
        const last = groups[groups.length - 1];
        if (last && last.key === key) last.routes.push(r);
        else groups.push({ key, routes: [r] });
      });
      return groups.map((g) => `
        <div class="wall">
          ${g.key ? `<div class="wname">${esc(g.key)}</div>` : ""}
          ${g.routes.map((r) => routeHTML(r, q)).join("")}
        </div>`).join("");
    }

    /* ── media ────────────────────────────────────────
       A thumbnail is a button, and for video it is a still frame rather than a
       player. `preload="metadata"` on a poster-less <video> is enough to get the
       first frame drawn without pulling the clip, which is the difference
       between a log page opening and a log page downloading forty videos. */
    /* A div carrying role=button rather than a real <button>, because the remove
       control sits on top of it and a <button> inside a <button> is not markup —
       the parser unnests it, and the delete ends up beside the thumbnail
       instead of on it. */
    function thumbHTML(m) {
      return `
        <div class="m" role="button" tabindex="0" data-open="${esc(m.id)}" data-date="${esc(m.date)}"
             title="${esc(m.caption || m.route || m.name || "")}">
          ${m.kind === "video"
            ? `<video src="${esc(m.src)}#t=0.1" muted playsinline preload="metadata"></video>
               <span class="play" aria-hidden="true">▶</span>`
            : `<img src="${esc(m.src)}" alt="${esc(m.caption || m.route || "")}" loading="lazy">`}
          ${m.route ? `<span class="rt">${esc(m.route)}</span>` : ""}
          <button class="kill" data-kill="${esc(m.id)}" data-date="${esc(m.date)}"
                  title="Remove this" aria-label="Remove this">&times;</button>
        </div>`;
    }

    function mediaHTML(date) {
      const items = date ? ClimbMedia.of(date) : [];
      return items.length ? `<div class="media">${items.map(thumbHTML).join("")}</div>` : "";
    }

    /* The upload box. Rendered only when signed in — see the note in the CSS. */
    function addHTML(date) {
      if (!date || !Owner.on()) return "";
      return `
        <div class="add" data-add="${esc(date)}">
          <label class="pick">
            <input type="file" accept="${esc(ClimbMedia.ACCEPT)}" multiple>
            Add photo or video
          </label>
          <input type="text" class="rt-in" placeholder="Which route? (optional)">
          <div class="bar" hidden><i></i></div>
          <div class="say"></div>
        </div>`;
    }

    function tripHTML(trip, q, opened, hidden) {
      const tally = [];
      if (trip.pitches) tally.push(`${trip.pitches} pitches`);
      if (trip.boulders) tally.push(`${trip.boulders} boulders`);
      const key = trip._key;
      const shots = ClimbMedia.of(trip.date);
      const clips = shots.filter((m) => m.kind === "video").length;

      /* What a shut day says: the date, where, and one line of the note. If
         there is no note, the routes stand in for it — a day that reads
         "Aug 18 · Obed" and nothing else is not worth scrolling past. */
      const peek = trip.notes
        ? esc(trip.notes.replace(/\s+/g, " ").trim())
        : esc(trip.routes.slice(0, 4).map((r) => r.name).filter(Boolean).join(", "));
      const badge = shots.length
        ? `<span class="cnt">${clips ? `${clips} clip${clips === 1 ? "" : "s"}` : `${shots.length} photo${shots.length === 1 ? "" : "s"}`}</span> · `
        : "";

      return `
        <article class="trip${opened ? " opened" : ""}" id="trip-${esc(key)}">
          <header class="tophead" role="button" tabindex="0"
                  aria-expanded="${opened}" data-toggle="${esc(key)}">
            <span class="date">${esc(fmtDate(trip.date))}</span>
            <span class="area">${esc(trip.area || "")}</span>
            ${tally.length ? `<span class="tally">${esc(tally.join(" · "))}</span>` : ""}
            <span class="caret" aria-hidden="true">&rsaquo;</span>
            ${!opened && (peek || badge) ? `<span class="peek">${badge}${peek}</span>` : ""}
          </header>
          <div class="body"${opened ? "" : " hidden"}>
            ${hidden ? `<div class="hidden-note">${hidden} climb${
              hidden === 1 ? "" : "s"} I couldn't name.</div>` : ""}
            <div class="walls">${wallsHTML(trip.routes, q)}</div>
            ${trip.people.length ? `<div class="people">${
              trip.people.map((p) => `<button class="who" data-person="${esc(p)}">${esc(p)}</button>`).join("")
            }</div>` : ""}
            ${trip.notes ? `<div class="note">${esc(trip.notes)}</div>` : ""}
            ${mediaHTML(trip.date)}
            ${addHTML(trip.date)}
          </div>
        </article>`;
    }

    /* ── views ────────────────────────────────────────── */
    function tripsView() {
      const q = state.q.trim().toLowerCase();
      const f = activeFilter();
      let shown = 0, routeCount = 0;

      const html = DATA.trips.map((trip) => {
        if (q && !trip._hay.includes(q)) return "";
        if (state.person && !trip.people.some((p) => p.toLowerCase() === state.person.toLowerCase())) return "";
        /* A day is open because it was tapped, or deep-linked to — or because a
           search is running, and a search that returns rows of shut days has
           hidden the very thing it was asked to find. */
        const isOpen = state.open.has(trip._key) || !!q || !!f;
        // "did climb, not sure what i got on" is a real memory but not a route —
        // it stays out of the lists until you open that particular day.
        const hidden = isOpen ? 0 : trip.routes.filter((r) => r.unknown).length;
        let routes = isOpen ? trip.routes : trip.routes.filter((r) => !r.unknown);
        if (f) routes = routes.filter(f.test);
        // A search that matches routes should narrow to those routes; one that only
        // matches the crag, the notes or a partner leaves the whole day intact.
        const hits = (r) => [r.name, r.grade].filter(Boolean).join(" ").toLowerCase().includes(q);
        if (q && routes.some(hits)) routes = routes.filter(hits);
        if (!routes.length && (f || q)) return "";
        shown += 1;
        routeCount += routes.length;
        return tripHTML({ ...trip, routes }, q, isOpen, hidden);
      }).join("");

      countEl.textContent = `${shown} trip${shown === 1 ? "" : "s"} · ${routeCount} routes`;
      view.innerHTML = html || '<p class="empty">Nothing matches that. Try a route, a crag, a name or a year.</p>';
    }




    /* There was a VIEWS table here dispatching on state.tab across four views.
       Most climbed and People are the stats page now, Dream routes is the
       to-do page, and this page has one view — so the table, the tab bar it
       read and the three functions it pointed at are all gone. */
    function render() {
      renderChips();
      tripsView();
    }

    /* ── stats + most recent trip ─────────────────────── */
    /* renderHeader() lived here: it painted a five-cell tally and a card for
       the most recent day. Both are the room page's job now — this page is the
       archive — and it was still building them into hidden elements on every
       render. Sixty-eight lines of work nobody could see. */

    /* ── events ───────────────────────────────────────── */
    searchEl.addEventListener("input", () => { state.q = searchEl.value; render(); });

    chipsEl.addEventListener("click", (e) => {
      const chip = e.target.closest("[data-filter]");
      if (chip) {
        state.filter = state.filter === chip.dataset.filter ? null : chip.dataset.filter;
        render();
        return;
      }
      if (e.target.closest("[data-clear-person]")) {
        state.person = null;
        render();
      }
    });

    view.addEventListener("click", (e) => {
      const who = e.target.closest("[data-person]");
      if (!who) return;
      state.person = who.dataset.person;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* ── opening a day ────────────────────────────────
       Delegated from the container so it survives every re-render, and checked
       against the media controls first — a tap on "remove this" inside an open
       day would otherwise also fold the day up underneath it. */
    view.addEventListener("click", (e) => {
      if (e.target.closest("[data-open], [data-kill], .add")) return;
      const head = e.target.closest("[data-toggle]");
      if (!head) return;
      const key = head.dataset.toggle;
      if (state.open.has(key)) state.open.delete(key); else state.open.add(key);
      render();
    });
    view.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const head = e.target.closest("[data-toggle]");
      if (!head) return;
      e.preventDefault();
      head.click();
    });

    /* ── the player ───────────────────────────────────
       One dialog for the whole page. Clearing it on close is not tidiness: a
       <video> left in the DOM goes on holding the connection and, on iOS, goes
       on playing the audio. */
    const viewer = document.getElementById("viewer");
    const vmedia = document.getElementById("vmedia");
    const vcap = document.getElementById("vcap");
    const vwhere = document.getElementById("vwhere");
    const vcount = document.getElementById("vcount");
    const vprev = document.getElementById("vprev");
    const vnext = document.getElementById("vnext");

    /* The viewer holds the whole day, not one file. Opening a thumbnail from a
       day with five clips on it and then having to shut the player to see the
       second one is the thing that makes a gallery annoying to use. */
    let reel = [];
    let reelAt = 0;

    function showAt(i) {
      if (i < 0 || i >= reel.length) return;
      reelAt = i;
      const m = reel[i];
      const trip = DATA.trips.find((t) => t.date === m.date);
      vmedia.innerHTML = m.kind === "video"
        ? `<video src="${esc(m.src)}" controls autoplay playsinline></video>`
        : `<img src="${esc(m.src)}" alt="${esc(m.caption || m.route || "")}">`;
      vwhere.textContent = [fmtDate(m.date), trip && trip.area].filter(Boolean).join(" · ");
      vcap.innerHTML = [
        m.route ? `<strong>${esc(m.route)}</strong>` : "",
        esc(m.caption || "")
      ].filter(Boolean).join(" — ");
      /* The routes climbed that day, offered as the answer — because the
         answer is nearly always one of them, and typing "Amarillo Sunset" on a
         phone to label a photo of it is how photos stay unlabelled. */
      const nameBox = document.getElementById("vname");
      nameBox.hidden = !(window.Owner && Owner.on());
      if (!nameBox.hidden) {
        document.getElementById("vroutes").innerHTML = trip
          ? [...new Set(trip.routes.map((r) => r.name).filter(Boolean))]
              .map((n) => `<option value="${esc(n)}">`).join("")
          : "";
        document.getElementById("vroute").value = m.route || "";
        const save = document.getElementById("vsave");
        save.disabled = false;
        save.textContent = "Save";
      }
      vcount.textContent = reel.length > 1 ? `${i + 1} of ${reel.length}` : "";
      vprev.disabled = i === 0;
      vnext.disabled = i === reel.length - 1;
      /* Both arrows pointless on a single clip — hide the rail rather than show
         two dead buttons. */
      const solo = reel.length < 2;
      vprev.hidden = solo;
      vnext.hidden = solo;
    }

    function openViewer(date, id) {
      reel = ClimbMedia.of(date);
      const at = Math.max(0, reel.findIndex((m) => m.id === id));
      if (!reel.length) return;
      showAt(at);
      viewer.showModal();
    }
    function closeViewer() { viewer.close(); }

    /* Saving re-renders the row underneath, so the thumbnail's route chip and
       the gallery's "no route yet" both change without a reload. */
    document.getElementById("vname").addEventListener("submit", async (e) => {
      e.preventDefault();
      const m = reel[reelAt];
      if (!m) return;
      const save = document.getElementById("vsave");
      const route = document.getElementById("vroute").value.trim();
      save.disabled = true;
      save.textContent = "Saving…";
      const ok = await ClimbMedia.label(m.date, m.id, { route, caption: m.caption || "" });
      save.textContent = ok ? "Saved" : "Didn't save";
      save.disabled = false;
      if (!ok) return;
      m.route = route;
      vcap.innerHTML = [route ? `<strong>${esc(route)}</strong>` : "", esc(m.caption || "")]
        .filter(Boolean).join(" — ");
      render();
    });

    document.getElementById("vclose").onclick = closeViewer;
    vprev.onclick = () => showAt(reelAt - 1);
    vnext.onclick = () => showAt(reelAt + 1);
    /* Emptying on close is not tidiness: a <video> left in the DOM goes on
       holding its connection and, on iOS, goes on playing the audio. Bound to
       the close event so Escape gets the same treatment as the button. */
    viewer.addEventListener("close", () => { vmedia.innerHTML = ""; reel = []; });
    /* Clicking the backdrop shuts it. The dialog element reports a click on its
       own box for backdrop hits, so the target has to be the dialog itself. */
    viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });

    document.addEventListener("keydown", (e) => {
      if (!viewer.open) return;
      /* Not while the video has focus — space and the arrows are its own
         controls there, and stealing them breaks scrubbing. */
      if (e.target.tagName === "VIDEO") return;
      if (e.key === "ArrowLeft") { e.preventDefault(); showAt(reelAt - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); showAt(reelAt + 1); }
    });

    /* Swipe, because on a phone that is what a gallery is. Only counted when
       it is clearly horizontal, so scrolling a tall photo does not skip. */
    let touchX = null, touchY = null;
    vmedia.addEventListener("touchstart", (e) => {
      touchX = e.changedTouches[0].clientX;
      touchY = e.changedTouches[0].clientY;
    }, { passive: true });
    vmedia.addEventListener("touchend", (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      showAt(reelAt + (dx < 0 ? 1 : -1));
    }, { passive: true });

    /* ── media: open one, or take one down ────────────
       On document rather than on `view`, because the newest day's card lives
       outside it and has thumbnails too. */
    document.addEventListener("click", async (e) => {
      const kill = e.target.closest("[data-kill]");
      if (kill) {
        e.stopPropagation();
        if (!confirm("Remove this from the log? It is deleted for good.")) return;
        const okDone = await ClimbMedia.remove(kill.dataset.date, kill.dataset.kill);
        if (!okDone) { alert("That did not delete — check the connection, or sign in again."); return; }
        render();
        return;
      }
      const open = e.target.closest("[data-open]");
      if (!open) return;
      openViewer(open.dataset.date, open.dataset.open);
    });

    /* ── adding media ─────────────────────────────────
       Files go up one at a time rather than in parallel. On a phone at a crag,
       three 40MB clips racing each other is how all three time out; in order,
       the first one is safe before the second starts. */
    document.addEventListener("change", async (e) => {
      const input = e.target.closest('.add input[type=file]');
      if (!input) return;
      const box = input.closest("[data-add]");
      const date = box.dataset.add;
      const route = box.querySelector(".rt-in").value.trim();
      const say = box.querySelector(".say");
      const bar = box.querySelector(".bar");
      const fill = bar.querySelector("i");
      const files = [...input.files];
      input.value = "";
      if (!files.length) return;

      const tooBig = files.filter((f) => f.size > ClimbMedia.MAX_BYTES);
      if (tooBig.length) {
        say.className = "say bad";
        say.textContent = `${tooBig[0].name} is ${Math.round(tooBig[0].size / 1048576)}MB — the limit is ${
          ClimbMedia.MAX_BYTES / 1048576}MB. Trim the clip and try again.`;
        return;
      }

      bar.hidden = false;
      let done = 0;
      for (const f of files) {
        say.className = "say";
        say.textContent = `Uploading ${f.name}${files.length > 1 ? ` (${done + 1} of ${files.length})` : ""}…`;
        const out = await ClimbMedia.upload(date, f, {
          route,
          onProgress: (p) => { fill.style.width = Math.round(p * 100) + "%"; }
        });
        if (out.error) {
          say.className = "say bad";
          say.textContent = out.error;
          bar.hidden = true;
          return;
        }
        done += 1;
        fill.style.width = "0%";
      }
      bar.hidden = true;
      say.className = "say";
      say.textContent = `${done} added. ${done === 1 ? "It is" : "They are"} live now.`;
      /* Repaint both, because the newest day is drawn by the other one. */
      render();
    });

    /* ── owner mode ───────────────────────────────────
       The gate is the Worker; this only decides whether the controls are drawn.
       assets/owner.js says why that is not a hole at length. */
    function paintOwner() {
      const bar = document.getElementById("ownerbar");
      document.body.classList.toggle("owner-on", Owner.on());
      if (Owner.on()) {
        bar.innerHTML = `<div class="signedin"><strong>Signed in.</strong>
          <span>Open a day to add photos or video to it.</span>
          <button type="button" id="signout">sign out</button></div>`;
        bar.querySelector("#signout").onclick = () => Owner.signOut();
      } else {
        Owner.mountBox(bar, { title: "Password" });
      }
      render();
    }
    /* Signing in has to post /auth at whichever origin actually answers, and
       only climb-host.js knows that — and only after it has asked once. */
    ClimbHost.resolved().then(h => { Owner.init({ host: h, onChange: paintOwner }); paintOwner(); });

    // Deep links (#trip-2026-07-27) come in from the sitewide "newest day out"
    // banner, and from clicking a date here.
    function openFromHash(scroll) {
      if (!/^#trip-/.test(location.hash)) return;
      /* A deep link has to expand the day it points at, not just scroll to it —
         landing on a shut row is landing on nothing. */
      state.open.add(location.hash.replace(/^#trip-/, ""));
      render();
      const target = document.getElementById(location.hash.slice(1));
      if (target && scroll) target.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    window.addEventListener("hashchange", () => openFromHash(true));

    paintOwner();                 // draws the sign-in, then the header and list
    openFromHash(true);
  })();
  </script>
</body>
</html>
