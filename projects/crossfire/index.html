<!-- The game moved to ../kondrite/, and the seed comes with it.

     JavaScript rather than a meta refresh: a meta refresh drops the query
     string, and `?seed=1234` is a designed feature of this game — a sector is
     a place you can send somebody. `location.replace` rather than an assignment
     so the old address does not sit in the back button.

     GitHub Pages has no server-side redirects and 404.html cannot help here:
     Pages serves it for genuinely missing paths and it has no way to know what
     the query string meant. A file at the old path is the only mechanism there
     is, and this one is four lines and lasts forever — the links it serves are
     in other people's messages, where they cannot be edited. -->
<!DOCTYPE html><meta charset="utf-8"><meta name="robots" content="noindex">
<title>KONDRITE</title>
<script>location.replace("../kondrite/" + location.search + location.hash);</script>
<noscript><a href="../kondrite/">KONDRITE has moved.</a></noscript>
