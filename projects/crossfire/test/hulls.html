<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CROSSFIRE hull sheet</title>
<style>
  body { margin: 0; background: #05070c; color: #9fb0c8; font: 12px ui-monospace, Menlo, monospace; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Every hull on one sheet, drawn by the game's own drawing code. It lifts the
   ship table and `drawHullArt` straight out of ../index.html rather than
   keeping a copy, so what is on this page is what is in the sector.

   Top: the twenty-five, by category, empty and then laden. Bottom: each job the
   sector's traffic does, on the hull it flies, with its markings. Open it from
   the site root: /projects/crossfire/test/hulls.html */
(async () => {
  const src = await (await fetch("../index.html")).text();
  const cut = (from, to) => {
    const a = src.indexOf(from);
    const b = src.indexOf(to, a);
    if (a < 0 || b < 0) throw new Error("hull sheet cannot find " + from);
    return src.slice(a, b);
  };
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = 800, H = 1060, dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.scale(dpr, dpr);

  const game = new Function("ctx",
    "let wScale = 1, clock = 0.4;\n" +
    cut("  const MATERIALS = [", "  const matSpec") +
    cut("  function glow(colour, width, alpha, path) {", "  /* Anything near an edge") +
    cut("  const SHIPS = [", "  /* ── two axes") +
    cut("  /* ── one hull, drawn the same way", "  function drawShip(s) {") +
    cut("  /* ── what it is, at a glance", "  /* Somebody else's ship.") +
    "for (const sh of SHIPS) { Object.assign(sh, HULL_ART[sh.key]);" +
    " const xs = sh.art.map(p => p[0]); sh.noseX = Math.max(...xs); sh.tailX = Math.min(...xs); }\n" +
    "return { SHIPS, MATERIALS, drawHullArt, podColours, drawRoleMarks };");
  const G = game(ctx);

  const label = (s, x, y, c) => { ctx.fillStyle = c || "#9fb0c8"; ctx.fillText(s, x, y); };
  const order = ["CARGO", "COMMUTER", "COURIER", "SPORT", "MILITARY", "INDUSTRIAL",
                 "UTILITY", "EXPLORER"];
  const COL = "#ffcb42";
  const hold = { ice: 20, iron: 14, alloy: 6, iridium: 3 };

  // Every hull fitted to the same box, the way the hangar shows them.
  const draw = (sh, x, y, box, colour, load, t) => {
    let far = 1;
    for (const p of sh.art) far = Math.max(far, Math.hypot(p[0], p[1]));
    for (const f of sh.fins || []) far = Math.max(far, Math.hypot(...f[1]), Math.hypot(...f[0]));
    if (sh.weapon === "claw") far = Math.max(far, Math.hypot(sh.noseX + 12, 13));
    const k = box / far;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(k, k);
    G.drawHullArt(sh, colour, 1 / k, 1, { load });
    if (t) G.drawRoleMarks(t, sh, colour, 1 / k);
    ctx.restore();
  };

  label("THE TWENTY-FIVE: each drawn empty, then laden", 20, 20, "#e8eef8");
  let y = 70;
  for (const cat of order) {
    const row = G.SHIPS.filter(s => s.category === cat);
    label(cat, 20, y + 4, COL);
    let x = 120;
    for (const sh of row) {
      draw(sh, x + 30, y, 28, COL, null);
      draw(sh, x + 95, y, 28, COL, G.podColours(sh.pods, hold, 1));
      label(sh.name, x + 10, y + 42);
      x += 130;
    }
    y += 95;
  }

  label("THE SECTOR'S JOBS: the hull each flies, and its markings", 20, y, "#e8eef8");
  y += 60;
  const jobs = [
    ["FREIGHT", "drayman", "freight", "#6dc6ff", 1],
    ["TRADER", "harrier", "trader", "#6dc6ff", 0.6],
    ["SCAVENGER", "cradle", "scavenger", "#c0c8d8", 0.3],
    ["ESCORT", "spur", "escort", "#6dc6ff", 0],
    ["PATROL", "bastion", "patrol", "#6dc6ff", 0],
    ["PIRATE", "vane", "pirate", "#ff6d6d", 0],
    ["PIRATE", "stride", "pirate", "#ff6d6d", 0]
  ];
  let x = 70;
  for (const [name, key, role, colour, fill] of jobs) {
    const sh = G.SHIPS.find(s => s.key === key);
    draw(sh, x, y, 36, colour, G.podColours(sh.pods, hold, fill), { role, phase: 0 });
    label(name, x - 30, y + 54, colour);
    label(sh.name, x - 30, y + 68);
    x += 110;
  }
})();
</script>
</body>
</html>
