<script>
/* KONDRITE looks — a mood sheet, not the game.

   One living scene (the ship on a lazy loop, rocks drifting and turning, the
   home station, a target shot apart every couple of seconds) drawn thirteen
   ways: today's look, then twelve candidate styles. Each is a different way of
   DRAWING — painted light, ink, flat poster, neon wire, real pixels, print,
   and a photoreal one lit per pixel —
   not the same renderer in a different palette. Nothing here is
   read by the game; the point is to pick a direction before any of it goes in.

   Every candidate answers the same five things, because those are what
   separate a Steam game from an .io game:
     light     — one key light in the world; rocks are shaded and rim-lit
                 toward it, engines and blasts throw light onto what's near
     depth     — a painted far layer, three star layers, foreground dust,
                 all at different parallax
     material  — rock carries speckle, craters and its own detail (chondrules,
                 ice facets, hatching); hulls have shading and trim
     direction — each look has its own palette, grade, grain and vignette
     movement  — trails, sparks, flashes, shake, twinkle

   Keys: 0–9 or ←/→ to switch, space to pause.
   Open from the site root: /projects/kondrite/test/looks.html */
(() => {
"use strict";
const canvas = document.getElementById("c");
let ctx = canvas.getContext("2d");
const E = document.createElement("canvas");            // emissive layer, feeds the bloom
const ex = E.getContext("2d");
const ES = 0.5;                                        // emissive layer resolution
const FILTER_OK = (() => { const t = document.createElement("canvas").getContext("2d");
  if (!("filter" in t)) return false; t.filter = "blur(2px)"; return t.filter === "blur(2px)"; })();
const B1 = document.createElement("canvas"), B2 = document.createElement("canvas");  // fallback bloom chain
let vw = 0, vh = 0, dpr = 1;

/* ---------- noise ---------- */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const r = rng(seed), p = new Uint8Array(512), v = new Float32Array(256);
  for (let i = 0; i < 256; i++) { p[i] = i; v[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const h = (x, y) => v[p[(p[x & 255] + y) & 255]];
  const sm = t => t * t * (3 - 2 * t);
  const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; };
  return (x, y, oct = 5) => { let s = 0, a = 0.5, f = 1, n = 0;
    for (let o = 0; o < oct; o++) { s += a * vn(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; };
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const mixc = (c1, c2, t) => [mix(c1[0], c2[0], t), mix(c1[1], c2[1], t), mix(c1[2], c2[2], t)];
const rgba = (c, a) => `rgba(${c},${a})`;
const hex3 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/* ---------- the six looks ---------- */
const LOOKS = [
  { id: "today", name: "TODAY", blurb: "What KONDRITE looks like now: amber lines on black.", flat: true },

  { id: "ember", name: "PAINTED",
    blurb: "Soft painted light. A low sun, warm dust, dark basalt lit hard from one side, bloom and grain.",
    bg: ["#0a0610", "#1c0e0a"],
    neb: (n, m) => { const d = sstep(0.46, 0.82, n); const c = mixc([120, 36, 22], [230, 130, 60], sstep(0.3, 0.8, m));
      return [c[0], c[1], c[2], d * 0.55]; },
    sun: { x: 0.1, y: 0.14, r: 30, core: "255,226,170", glow: "255,140,50", streak: false },
    stars: ["255,236,214", "255,206,150", "210,215,255"],
    rock: { base: "#2b221e", speck: ["#40322a", "#17110f"], crater: "#130e0c", shadow: "10,5,7", light: "255,170,90", lightA: 0.32, rim: "255,196,120" },
    ship: { hull: "#3b302a", lit: "255,190,120", trim: "255,196,90", engine: "255,150,50" },
    station: { body: "#3a2e28", lights: "255,210,120" },
    shot: "255,220,140", boom: ["255,244,210", "255,180,80", "255,100,40"],
    dust: "255,196,150", dustA: 0.22, bloom: 0.95, grade: ["#ff9a4a", "soft-light", 0.14], vig: 0.7, grain: 0.06 },

  { id: "chart", name: "SURVEY CHART",
    blurb: "The survey is the style. Cream ink on navy, hatched shadow, contour nebulae, a plotted course.",
    ink: true, bg: ["#0d1726", "#0f1b2c"],
    neb: (n) => { const v = n * 11, f = v - Math.floor(v), e = Math.min(f, 1 - f); const line = 1 - sstep(0.02, 0.07, e);
      return [233, 223, 199, line * 0.22 * sstep(0.4, 0.66, n)]; },
    sun: { x: -0.3, y: -0.4, r: 0 },
    stars: ["233,223,199"],
    inkc: "233,223,199", red: "224,83,61", gold: "232,182,74",
    shot: "224,83,61", boom: ["224,83,61", "233,223,199", "232,182,74"],
    bloom: 0.3, grade: ["#e9dfc7", "soft-light", 0.05], vig: 0.55, grain: 0.1 },

  { id: "poster", name: "POSTER", kind: "poster", hires: true,
    blurb: "Flat graphic. Hard-edged three-tone shading, banded sky, a big flat planet. No gradients, no glow.",
    bg: ["#1b1f3b"],
    bands: [[0.47, "#22284f"], [0.57, "#2b2e62"], [0.67, "#373476"], [0.77, "#4a3b89"]],
    sun: { x: -0.2, y: -0.3, r: 0 },
    planet: { x: 0.8, y: 0.86, r: 0.42, lit: "#ff8a5c", shadow: "#b8476a", band: "#ff6f61", ring: "#ffd27a" },
    star: "#ffe6a8",
    rockc: { hi: "#a79be0", mid: "#6d62ad", lo: "#3a3170", crater: "#554a95" },
    shipc: { lit: "#f4f1ea", lo: "#a9a2c4", outer: "#ff7b54", inner: "#ffd166" },
    stationc: { lit: "#e8e3f5", lo: "#8f86b8", lights: "#06d6a0" },
    trail: "#ff7b54", shotc: "#ffd166", boomc: ["#ffffff", "#ffd166", "#ff7b54"] },

  { id: "neon", name: "NEON VECTOR", kind: "neon",
    blurb: "Everything is light. Glowing wire over a grid that ripples when something breaks.",
    bg: ["#03040c"], grid: "70,100,255",
    rockn: ["255,60,200", "120,255,90", "255,160,40", "60,220,255"],
    ship: { trim: "230,250,255", engine: "60,220,255" }, stationn: "60,220,255",
    shot: "255,240,120", boom: ["255,255,255", "255,200,80", "255,60,200"],
    bloom: 1.5, vig: 0.7, grain: 0.03 },

  { id: "pixel", name: "PIXEL",
    blurb: "Real pixels. Drawn at a third of the resolution, cut down to sixteen colours and dithered.",
    pixel: { scale: 3, spread: 30, pal: ["#0d0b1e", "#1d1030", "#2e1f47", "#46305e", "#6b4a7a", "#9a6a8c", "#c98f93", "#f2c3a0",
      "#fff1d6", "#ffb070", "#ff7a5c", "#c94b5b", "#2a4d6e", "#3e7f8f", "#6fc2b0", "#b8f0d0"] },
    bg: ["#0d0b1e", "#22143a"],
    neb: (n, m) => { const d = sstep(0.44, 0.84, n); const c = mixc([70, 40, 110], [60, 140, 150], sstep(0.35, 0.85, m));
      return [c[0], c[1], c[2], d * 0.7]; },
    sun: { x: 0.12, y: 0.15, r: 30, core: "255,240,210", glow: "255,150,90", streak: false },
    stars: ["255,241,214", "184,240,208", "242,195,160"],
    rock: { base: "#9a6a8c", speck: ["#c98f93", "#6b4a7a"], crater: "#46305e", shadow: "29,16,48", light: "255,200,150", lightA: 0.5, rim: "255,241,214" },
    ship: { hull: "#46305e", lit: "255,220,180", trim: "255,176,112", engine: "255,122,92" },
    station: { body: "#46305e", lights: "111,194,176" },
    shot: "255,241,214", boom: ["255,241,214", "255,176,112", "201,75,91"],
    dust: "242,195,160", dustA: 0.25 },

  { id: "comic", name: "COMIC", kind: "comic",
    blurb: "Printed. Halftone dots for shadow and sky, thick ink outlines, bursts that shout.",
    bg: ["#161a44"], dotA: "#d6337f", dotB: "#2fb6d6",
    sun: { x: -0.25, y: -0.35, r: 0 },
    rockcc: "#e3a15e", ghost: "#3fd0e0", ink: "#111118",
    vig: 0.35, grain: 0.07 },

  { id: "real", name: "REAL", kind: "real",
    blurb: "As a camera would see it. The Milky Way in a real sky, rubble-pile asteroids with cast shadows, a fighter lit pixel by pixel.",
    bg: ["#000000"], sun: { x: -0.35, y: -0.3, r: 0 },
    rock: { light: "255,248,235", shadow: "0,0,0" }, station: { body: "#6b7078", lights: "255,205,150" },
    bloom: 0.85, vig: 0.3, grain: 0.035 },

  { id: "ascii", name: "ASCII", kind: "ascii",
    blurb: "The terminal's own game. Every frame redrawn in text: light becomes . : - = + * # % @.",
    bloom: 0.55, vig: 0.55, grain: 0.04 },

  { id: "sensor", name: "SENSOR", kind: "sensor", sun: { x: -0.35, y: -0.3, r: 0 },
    blurb: "Space through the ship's instruments. Long-wave thermal: hot is white, cold rock is violet-black.",
    vig: 0.4, grain: 0.1 },

  { id: "onebit", name: "1-BIT", kind: "onebit", dark: "#11120e", light: "#e9e6d3",
    blurb: "Two colours, no grey. Every shade is a dither pattern, every edge a hard line." },

  { id: "paper", name: "PAPERCRAFT", kind: "paper", sun: { x: -0.3, y: -0.35, r: 0 }, bg: ["#1d2442"],
    blurb: "Cut paper, stacked. The nebula in five layers of card, every piece casting a soft shadow.",
    nebLayers: [[0.26, "#342e66"], [0.4, "#4b418e"], [0.54, "#6c5bb6"], [0.68, "#9884dd"], [0.8, "#c6b8f2"]],
    vig: 0.35 },

  { id: "moebius", name: "MOEBIUS", kind: "moebius", sun: { x: -0.3, y: -0.4, r: 0 }, bg: ["#163340", "#3b2f52"], line: "#1c1826",
    blurb: "Ligne claire. Thin even outlines, flat pastel colour, fine hatching in the shadows.",
    bands2: [[0.28, "#8f84c4"], [0.44, "#d98fa0"], [0.6, "#f2b79c"], [0.74, "#f7dcae"]],
    vig: 0.25, grain: 0.05 },
];
let look = 1;
const SRC = Object.assign({}, LOOKS[1], { id: "src", withNeb: true });   // the painted scene the text and dither looks render from

/* ---------- the world ---------- */
const WORLD_W = 1900, WORLD_H = 1300;
const R = rng(7);
const rocks = [];
for (let i = 0; i < 26; i++) {
  const rad = 22 + Math.pow(R(), 1.6) * 52, n = 9 + ((R() * 5) | 0), pts = [];
  for (let k = 0; k < n; k++) { const a = (k / n) * Math.PI * 2 + (R() - 0.5) * 0.35; const rr = rad * (0.74 + R() * 0.32);
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
  const chond = [], glints = [], craters = [], cracks = [], facets = [];
  for (let k = 0; k < 6 + R() * 7; k++) { const a = R() * 6.283, d = Math.sqrt(R()) * rad * 0.62; chond.push([Math.cos(a) * d, Math.sin(a) * d, 1.3 + R() * 2.4, R() * 6.28]); }
  for (let k = 0; k < 7; k++) { const a = R() * 6.283, d = (0.3 + R() * 0.5) * rad; glints.push([Math.cos(a) * d, Math.sin(a) * d, R() * 6.28]); }
  for (let k = 0; k < 2 + R() * 5; k++) { const a = R() * 6.283, d = Math.sqrt(R()) * rad * 0.6; craters.push([Math.cos(a) * d, Math.sin(a) * d, rad * (0.08 + R() * 0.15)]); }
  for (let k = 0; k < 3; k++) { const s = []; let a = R() * 6.28, x = Math.cos(a) * rad * 0.5, y = Math.sin(a) * rad * 0.5;
    for (let j = 0; j < 5; j++) { s.push([x, y]); a += (R() - 0.5) * 1.4; x += Math.cos(a) * rad * 0.16; y += Math.sin(a) * rad * 0.16; } cracks.push(s); }
  for (let k = 0; k < 7; k++) { const a = R() * 6.28, b = a + 1 + R() * 1.5; facets.push([a, b, R() < 0.5]); }
  rocks.push({ x: (R() - 0.5) * WORLD_W, y: (R() - 0.5) * WORLD_H, a: R() * 6.28, w: (R() - 0.5) * 0.5,
    vx: (R() - 0.5) * 14, vy: (R() - 0.5) * 14, rad, pts, chond, glints, craters, cracks, facets, mark: i % 6 === 2 ? "tri" : i % 6 === 4 ? "strike" : null, tex: {}, flash: 0 });
}
const STATION = { x: 170, y: -50, r: 66, a: 0 };
const NEB = { x: 820, y: -120, r: 950 };        // the supernebula; the ship's loop runs into it
const ship = { x: 0, y: 0, h: 0, trail: [] };
const cam = { x: 0, y: 0 };
let parts = [], shots = [], flashes = [], waves = [], shake = 0;
const WORDS = ["KRAK!", "THOOM", "BLAM!", "KSSH", "POW!"];
let t = 0, paused = false, fireT = 0, shotsAt = 0, target = null;

const stars = [0.08, 0.2, 0.45].map((p, li) => { const r = rng(100 + li), s = [];
  for (let i = 0; i < [420, 220, 90][li]; i++) s.push({ x: r() * 2400, y: r() * 1600, s: [0.6, 1.0, 1.6][li] * (0.6 + r() * 0.8), b: 0.25 + r() * 0.75, ph: r() * 6.28, c: (r() * 3) | 0 });
  return { p, s }; });
const dust = (() => { const r = rng(55), s = []; for (let i = 0; i < 70; i++) s.push({ x: r() * 2400, y: r() * 1600, s: 1 + r() * 3.5, ph: r() * 6.28 }); return s; })();

/* ---------- per-look caches ---------- */
const cache = {};
function buildLook(L) {
  if (cache[L.id]) return cache[L.id];
  const c = {};
  if (L.bands && !L.neb) { const bands = L.bands.map(([th, h]) => [th, hex3(h)]);
    L.neb = (n) => { let c = null; for (const [th, rgb] of bands) if (n > th) c = rgb; return c ? [c[0], c[1], c[2], 1] : [0, 0, 0, 0]; }; }
  if (L.kind === "comic") c.half = halftone(L);
  if (L.kind === "real") { c.sky = realSky(); c.ship = realShip(); c.neb = null; c.nebula = realNebula(); for (const r of rocks) r.real = realRock(r); }
  if (L.neb) {                                        // far layer, painted once from noise
    const W = (L.ink || L.hires) ? 1080 : 360, H = (L.ink || L.hires) ? 720 : 240, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const g = cv.getContext("2d"), img = g.createImageData(W, H), nz = makeNoise(L.id.length * 31 + 3), mz = makeNoise(99);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const wx = x / (W / 5.15), wy = y / (W / 5.15), warp = nz(wx * 0.7 + 5, wy * 0.7, 3);
      const n = nz(wx + warp * 1.6, wy + warp * 1.6, 5), m = mz(wx * 0.8, wy * 0.8, 3);
      const [r, gg, b, a] = L.neb(n, m, x / W, y / H); const i = (y * W + x) * 4;
      img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = clamp(a) * 255;
    }
    g.putImageData(img, 0, 0); c.neb = cv;
  }
  if (L.dust) { const d = document.createElement("canvas"); d.width = d.height = 32; const g = d.getContext("2d");
    const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, rgba(L.dust, 1)); gr.addColorStop(1, rgba(L.dust, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32); c.dust = d; }
  if (L.rock && !L.kind) for (const r of rocks) r.tex[L.id] = rockTexture(r, L);
  return (cache[L.id] = c);
}
function rockTexture(r, L) {
  const S = Math.ceil(r.rad * 2.4), cv = document.createElement("canvas"); cv.width = cv.height = S;
  const g = cv.getContext("2d"), rr = rng(r.rad * 1000 | 0), o = S / 2, P = L.rock;
  g.fillStyle = P.base; g.fillRect(0, 0, S, S);
  for (let i = 0; i < r.rad * 5; i++) { g.fillStyle = P.speck[i & 1]; g.globalAlpha = 0.35 + rr() * 0.4;
    g.beginPath(); g.arc(rr() * S, rr() * S, 0.6 + rr() * 1.8, 0, 6.28); g.fill(); }
  g.globalAlpha = 1;
  if (P.facets) for (const [a, b, lite] of r.facets) { g.fillStyle = lite ? "rgba(255,255,255,0.13)" : "rgba(10,30,70,0.16)";
    g.beginPath(); g.moveTo(o, o); g.lineTo(o + Math.cos(a) * r.rad * 1.2, o + Math.sin(a) * r.rad * 1.2);
    g.lineTo(o + Math.cos(b) * r.rad * 1.2, o + Math.sin(b) * r.rad * 1.2); g.closePath(); g.fill();
    g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 0.8; g.stroke(); }
  for (const [x, y, cr] of r.craters) { g.fillStyle = P.crater; g.globalAlpha = 0.75; g.beginPath(); g.arc(o + x, o + y, cr, 0, 6.28); g.fill();
    g.globalAlpha = 0.35; g.strokeStyle = P.speck[0]; g.lineWidth = 1.2; g.beginPath(); g.arc(o + x, o + y, cr, 0.4, 2.8); g.stroke(); }
  g.globalAlpha = 1;
  if (P.cracks) { g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 1; for (const s of r.cracks) { g.beginPath(); s.forEach(([x, y], i) => i ? g.lineTo(o + x, o + y) : g.moveTo(o + x, o + y)); g.stroke(); } }
  return cv;
}

/* ---------- helpers ---------- */
const sx = x => x - cam.x + vw / 2 + shakeX, sy = y => y - cam.y + vh / 2 + shakeY;
let shakeX = 0, shakeY = 0;
function sunScreen(L) { return [L.sun.x * vw, L.sun.y * vh]; }
function toLight(L, px, py, which) { const s = which ? [L.light2.x * vw, L.light2.y * vh] : sunScreen(L);
  const dx = s[0] - px, dy = s[1] - py, d = Math.hypot(dx, dy) || 1; return [dx / d, dy / d]; }
function both(fn) { fn(ctx, 1); fn(ex, ES); }        // draw into the frame and into the bloom
function path(g, pts, a, x, y) { const c = Math.cos(a), s = Math.sin(a); g.beginPath();
  pts.forEach(([px, py], i) => { const X = x + px * c - py * s, Y = y + px * s + py * c; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath(); }
function wrapPos(r) { r.x = cam.x + ((((r.x - cam.x + WORLD_W / 2) % WORLD_W) + WORLD_W) % WORLD_W) - WORLD_W / 2;
  r.y = cam.y + ((((r.y - cam.y + WORLD_H / 2) % WORLD_H) + WORLD_H) % WORLD_H) - WORLD_H / 2; }
function glowDot(g, x, y, rad, col, a) { const gr = g.createRadialGradient(x, y, 0, x, y, rad);
  gr.addColorStop(0, rgba(col, a)); gr.addColorStop(1, rgba(col, 0)); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }

const SHIP = [[17, 0], [5, -4], [-5, -11], [-10, -11], [-7, -4], [-9, 0], [-7, 4], [-10, 11], [-5, 11], [5, 4]].map(([x, y]) => [x * 1.5, y * 1.5]);
const SHIP_FLAT = [[14, 0], [-10, -8], [-6, 0], [-10, 8]].map(([x, y]) => [x * 1.4, y * 1.4]);

/* ---------- simulation ---------- */
function step(dt) {

    ctx.save(); ctx.translate(sx(p_.x), sy(p_.y)); ctx.rotate(p_.life * 5 + (p_.a || 0)); ctx.fillStyle = p_.k === "debris" ? "#6f6459" : ["#f1e7cf", "#f7cf55", "#f08a3c"][p_.c]; ctx.fillRect(-sz, -sz * 0.6, sz * 2, sz * 1.2); ctx.restore(); }

/* moebius: ligne claire */
function moeNeb(L) { if (NEBC.moe) return NEBC.moe; const size = 1400, cv = document.createElement("canvas"); cv.width = cv.height = size; const g = cv.getContext("2d");
  L.bands2.forEach(([th, col], k) => { const m = nebCanvas(size, (dn) => { const a = sstep(th - 0.01, th + 0.01, dn); return a > 0 ? [0, 0, 0, a] : null; });

    if (k === 0) { const hc = document.createElement("canvas"); hc.width = hc.height = size; const hg = hc.getContext("2d"); hg.strokeStyle = L.line; hg.globalAlpha = 0.3; hg.lineWidth = 1;
      hg.beginPath(); for (let q = -size; q < size * 2; q += 8) { hg.moveTo(q, 0); hg.lineTo(q - size, size); } hg.stroke();

function drawMoebius(L) {
  const line = L.line, lineRgb = hex3(line).join(",");
  const sky = ctx.createLinearGradient(0, 0, vw * 0.3, vh); sky.addColorStop(0, L.bg[0]); sky.addColorStop(1, L.bg[1]); ctx.fillStyle = sky; ctx.fillRect(0, 0, vw, vh);
  for (const layer of stars) for (const s_ of layer.s) { const x = ((s_.x - cam.x * layer.p) % 2400 + 2400) % 2400 - 100, y = ((s_.y - cam.y * layer.p) % 1600 + 1600) % 1600 - 100;

  drawNeb(ctx, moeNeb(L), 1);
  { const x = sx(STATION.x), y = sy(STATION.y), R0 = STATION.r;
    ctx.strokeStyle = line; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(x, y, R0, 0, 6.28); ctx.stroke(); ctx.strokeStyle = "#9fd6c2"; ctx.lineWidth = 12.5; ctx.stroke();
    for (let k = 0; k < 4; k++) { const a = STATION.a + k * Math.PI / 2; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 16, y + Math.sin(a) * 16); ctx.lineTo(x + Math.cos(a) * (R0 - 6), y + Math.sin(a) * (R0 - 6));
      ctx.strokeStyle = line; ctx.lineWidth = 6; ctx.stroke(); ctx.strokeStyle = "#f4ecd8"; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = "#f4ecd8"; ctx.strokeStyle = line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 17, 0, 6.28); ctx.fill(); ctx.stroke();
    for (let k = 0; k < 8; k++) { const a = STATION.a + k / 8 * 6.283; ctx.fillStyle = "#e56b5d"; ctx.beginPath(); ctx.arc(x + Math.cos(a) * R0, y + Math.sin(a) * R0, 3, 0, 6.28); ctx.fill(); ctx.stroke(); } }
  for (const r of rocks) { const x = sx(r.x), y = sy(r.y), rad = r.rad; if (x < -rad * 2 || y < -rad * 2 || x > vw + rad * 2 || y > vh + rad * 2) continue;
    const [lx, ly] = toLight(L, x, y), c = Math.cos(r.a), s_ = Math.sin(r.a);
    ctx.save(); path(ctx, r.pts, r.a, x, y); ctx.fillStyle = r.flash > 0.4 ? "#fff6e0" : "#e3c9a0"; ctx.fill(); ctx.clip();
    ctx.save(); halfPlane(ctx, x, y, lx, ly, -rad * 0.08, rad); ctx.fillStyle = "#bf9f7c"; ctx.fillRect(x - rad * 1.5, y - rad * 1.5, rad * 3, rad * 3);
    hatch(ctx, x, y, rad, Math.atan2(ly, lx) + 0.7, 3.4, 0.5, lineRgb); ctx.restore();
    ctx.strokeStyle = line; ctx.lineWidth = 1; for (const [px_, py_, cr] of r.craters) { ctx.beginPath(); ctx.ellipse(x + px_ * c - py_ * s_, y + px_ * s_ + py_ * c, cr, cr * 0.7, r.a, 0, 6.28); ctx.stroke(); }
    ctx.fillStyle = line; for (const [px_, py_] of r.chond) ctx.fillRect(x + px_ * c - py_ * s_, y + px_ * s_ + py_ * c, 1.2, 1.2);
    ctx.restore(); ctx.strokeStyle = line; ctx.lineWidth = 1.6; ctx.lineJoin = "round"; path(ctx, r.pts, r.a, x, y); ctx.stroke(); }
  for (const off of [-3, 3]) { ctx.beginPath(); for (let i = 1; i < ship.trail.length - 10; i++) { const [ax, ay] = ship.trail[i - 1], [bx, by] = ship.trail[i], dx = bx - ax, dy = by - ay, dd = Math.hypot(dx, dy) || 1;
      const X = sx(bx) - dy / dd * off, Y = sy(by) + dx / dd * off; i > 1 ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.strokeStyle = "rgba(247,236,210,0.55)"; ctx.lineWidth = 1.2; ctx.stroke(); }
  { const x = sx(ship.x), y = sy(ship.y); ctx.save(); ctx.translate(x, y); ctx.rotate(ship.h); const fl = 9 + Math.sin(t * 25) * 2;
    ctx.strokeStyle = line; ctx.lineWidth = 1.4;
    ctx.fillStyle = "#f7d56a"; ctx.beginPath(); ctx.moveTo(-12, -5); ctx.quadraticCurveTo(-22 - fl, 0, -12, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e56b5d"; ctx.beginPath(); ctx.moveTo(-12, -2.5); ctx.quadraticCurveTo(-17 - fl * 0.5, 0, -12, 2.5); ctx.closePath(); ctx.fill(); ctx.restore();
    path(ctx, SHIP, ship.h, x, y); ctx.fillStyle = "#f4ecd8"; ctx.fill(); ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.stroke();
    ctx.save(); ctx.translate(x, y); ctx.rotate(ship.h); ctx.lineWidth = 1;
    ctx.strokeStyle = "#e56b5d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1, -5); ctx.lineTo(-8, -14); ctx.moveTo(1, 5); ctx.lineTo(-8, 14); ctx.stroke();
    ctx.strokeStyle = line; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, 0); ctx.stroke();
    ctx.fillStyle = "#3fa7a0"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(8, 0, 4.5, 2.4, 0, 0, 6.28); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.lineCap = "round";
  for (const s_ of shots) { const k = Math.hypot(s_.vx, s_.vy), x0 = sx(s_.x), y0 = sy(s_.y), x1 = sx(s_.x - s_.vx / k * 14), y1 = sy(s_.y - s_.vy / k * 14);
    ctx.strokeStyle = line; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.strokeStyle = "#f7d56a"; ctx.lineWidth = 2.6; ctx.stroke(); }
  for (const p_ of parts) { if (p_.k === "ember") continue; const k = 1 - p_.life / p_.max, sz = (p_.k === "debris" ? p_.s * 1.2 : p_.s * 1.8) * Math.min(1, k * 1.5);
    ctx.save(); ctx.translate(sx(p_.x), sy(p_.y)); ctx.rotate(p_.life * 5 + (p_.a || 0)); ctx.fillStyle = p_.k === "debris" ? "#e3c9a0" : ["#f4ecd8", "#f7d56a", "#e56b5d"][p_.c];
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sz, 0); ctx.lineTo(0, sz * 0.6); ctx.lineTo(-sz, 0); ctx.lineTo(0, -sz * 0.6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }

      ctx.ellipse(x + Math.cos(a) * R0 * 0.55, y + Math.sin(a) * R0 * 0.55, R0 * 0.5, R0 * 0.2, a, 0, 6.28); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = "#f4ecd8"; ctx.beginPath(); ctx.arc(x, y, R0 * 0.3, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, R0 * 1.2 + f.life * 90, 0, 6.28); ctx.stroke(); ctx.globalAlpha = 1; }
}

/* today, for comparison */
function drawFlat() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, vw, vh);
  const A = "232,182,74";
  for (const s of stars[0].s) { const x = ((s.x - cam.x * 0.08) % 2400 + 2400) % 2400 - 100, y = ((s.y - cam.y * 0.08) % 1600 + 1600) % 1600 - 100;
    if (x > 0 && y > 0 && x < vw && y < vh && s.b > 0.8) { ctx.fillStyle = rgba(A, 0.15); ctx.fillRect(x, y, 1.5, 1.5); } }
  ctx.strokeStyle = rgba(A, 1); ctx.lineWidth = 1.2; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.arc(sx(STATION.x), sy(STATION.y), STATION.r, 0, 6.28); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx(STATION.x), sy(STATION.y), 14, 0, 6.28); ctx.stroke();
  for (const r of rocks) { path(ctx, r.pts, r.a, sx(r.x), sy(r.y)); ctx.stroke(); }
  path(ctx, SHIP_FLAT, ship.h, sx(ship.x), sy(ship.y)); ctx.stroke();
  ctx.fillStyle = rgba(A, 1); for (const s of shots) ctx.fillRect(sx(s.x) - 1, sy(s.y) - 2, 2, 4);
  for (const p of parts) { if (p.k === "ember") continue; const k = 1 - p.life / p.max; ctx.strokeStyle = rgba(A, k * 0.8);
    ctx.beginPath(); ctx.moveTo(sx(p.x), sy(p.y)); ctx.lineTo(sx(p.x - p.vx * 0.02), sy(p.y - p.vy * 0.02)); ctx.stroke(); }
}

/* ---------- grain, sizing, controls, loop ---------- */
const GRAIN = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return ctx.createPattern(c, "repeat"); })();
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 1.5); vw = Math.max(1, innerWidth); vh = Math.max(1, innerHeight);
  canvas.width = vw * dpr; canvas.height = vh * dpr; E.width = Math.ceil(vw * ES); E.height = Math.ceil(vh * ES);
  B1.width = Math.ceil(vw / 8); B1.height = Math.ceil(vh / 8); B2.width = Math.ceil(vw / 24); B2.height = Math.ceil(vh / 24); }
function sized() { if (innerWidth && (innerWidth !== vw || innerHeight !== vh)) resize(); return innerWidth > 0; }
addEventListener("resize", resize); resize();

const bar = document.getElementById("bar");
LOOKS.forEach((L, i) => { const b = document.createElement("button"); b.innerHTML = `<span>${i}</span>${L.name}`; b.onclick = () => pick(i); bar.appendChild(b); });
function pick(i) { look = (i + LOOKS.length) % LOOKS.length; const L = LOOKS[look];
  document.getElementById("name").textContent = L.name; document.getElementById("blurb").textContent = L.blurb;
  [...bar.children].forEach((b, k) => b.setAttribute("aria-pressed", k === look)); try { localStorage.setItem("kondrite-look", look); } catch (e) {} }
addEventListener("keydown", (e) => { if (e.key >= "0" && e.key <= "9") pick(+e.key); else if (e.key === "ArrowRight") pick(look + 1);
  else if (e.key === "ArrowLeft") pick(look - 1); else if (e.key === " ") { paused = !paused; e.preventDefault(); } });
try { const s = +localStorage.getItem("kondrite-look"); if (s >= 0 && s < LOOKS.length && localStorage.getItem("kondrite-look") !== null) look = s; } catch (e) {}
pick(look);
for (let i = 0; i < 120; i++) step(1 / 60);            // start mid-flight, not on a frozen first frame

let last = performance.now();

})();
