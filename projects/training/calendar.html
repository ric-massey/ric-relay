<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Training</title>
  <meta name="description" content="The training plan, month by month.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://ricmassey.com/projects/training/calendar.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fc4c02'/><text y='.85em' font-size='64' x='18'>📅</text></svg>">
  <link rel="stylesheet" href="../../assets/training/nav.css">
  <link rel="stylesheet" href="../../assets/training/training.css?v=2">
</head>
<body>
<script src="../../assets/training/nav.js" data-nav="calendar"></script>

  <div class="wrap">
    <div class="pagehead">
      <h1>Calendar</h1>
      <p>The whole season, month by month. Tap a day for what is on it.</p>
    </div>

    <div class="calwrap">
      <div class="calhead">
        <button type="button" class="calnav" id="calprev" aria-label="Previous month">‹</button>
        <!-- The month is the control, not a caption. Stepping from September to
             next June was eight taps on the arrow; now the label opens and you
             pick. The arrows stay because one month either way is the common
             move and a dropdown is the slower way to do it. -->
        <div class="caltitle">
          <button type="button" class="calmonth" id="calmonth"
                  aria-expanded="false" aria-controls="calpick"
                  aria-label="Choose month and year">—</button>
          <span class="calphase" id="calphase"></span>
        </div>
        <button type="button" class="caltoday" id="caltoday" hidden>Today</button>
        <button type="button" class="calnav" id="calnext" aria-label="Next month">›</button>
      </div>
      <div class="calpick" id="calpick" hidden>
        <label>Month <select id="pickmonth"></select></label>
        <label>Year <select id="pickyear"></select></label>
      </div>
      <div class="calsum" id="calsum" aria-live="polite"></div>
      <div class="caldow" aria-hidden="true"></div>
      <div class="calgrid" id="calgrid" role="grid" aria-labelledby="calmonth"></div>
      <div class="calkey">
        <span><i class="k-climb"></i> climbing</span>
        <span><i class="k-run"></i> running</span>
        <span><i class="k-rest"></i> rest</span>
        <span><i class="k-key"></i> key session</span>
        <span><i class="k-done"></i> done</span>
        <span><i class="k-owed"></i> not ticked</span>
        <span><i class="k-deload"></i> deload week</span>
      </div>
      <div id="calday"></div>
    </div>

    <div class="owner" id="ownerbar" hidden>
      <strong>Owner mode.</strong> <span id="ownerstate">checking…</span>
      <button type="button" class="ownerbtn" id="signout">sign out</button>
    </div>

    <footer>
      Ric's personal training log · powered by stubbornness<br>
      <span class="foot-dim">The plan is generated; ticks and notes are live.</span>
    </footer>
  </div>

  <script src="../../assets/owner.js"></script>
  <script src="../../projects/climbing/climb-host.js?v=1"></script>
  <script src="../../projects/climbing/climb-media.js?v=4"></script>
  <script src="../../assets/training/core.js?v=2"></script>
  <script>
  /* TRAINING — calendar
     ──────────────────────────────────────────────────────────────────────────
     The month grid and the panel that opens under a day. Lifted out of the old
     single-page training.html unchanged in behaviour — it now talks to
     Training (assets/training/core.js) for the plan and the ticks instead of
     reaching for module-level variables that used to sit beside it.

     ── deep links ──
     #d-2026-11-08 opens that day and scrolls to it, which is what the home
     page's "coming up" rows and anything else pointing here rely on. */
  (function () {
    const $ = s => document.querySelector(s);
    const T = Training;

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let CAL_MONTH = null;     // first of the month being shown
  let CAL_SEL = null;       // the day whose detail panel is open
  let SLIDE = 0;            // -1 / +1 for the month that was just turned, for the animation

  /* The standing morning practice is on every day in the plan, so it can never
     be what makes a day interesting. Same test the home page and the workout
     index use. */
  const substantive = s => s.kind !== 'rest' && !(s.kind === 'body' && !s.key);

  /* What a day is FOR — the sessions worth naming in its cell. The morning
     practice is on every day and would make every cell say the same thing, so
     it does not count; a rest day keeps its rest so the cell is not blank. */
  const headline = d => {
    const real = d.sessions.filter(substantive);
    return real.length ? real : d.sessions.filter(s => s.kind === 'rest');
  };

  /* Which dot to draw on a phone, where there is no room for words. A day is
     climbing if it has a climbing session, and so on; a key session gets the
     bigger dot. */
  function dotsFor(d) {
    const seen = new Map();
    for (const s of d.sessions) {
      if (s.kind !== 'climb' && s.kind !== 'run') continue;
      seen.set(s.kind, seen.get(s.kind) || !!s.key);
    }
    if (!seen.size) seen.set('rest', false);
    return [...seen].map(([k, key]) => `<i class="${k}${key ? ' key' : ''}"></i>`).join('');
  }

  /* A short name for a cell. "Long run — 10 mi" is the plan's prose; in a
     cell eight characters wide "Long 10 mi" is the same information. */
  const shortTitle = (iso, s) => String(T.titleOf(iso, s))
    .replace(/\s+\/\s+.*$/, '')
    .replace(/\s+[—–-]\s+(?=[\d.]+\s*mi\b)/g, ' ')
    .replace(/\s+[—–]\s+/g, ' · ')
    .replace(/(\w)\s+run\s+(?=\d)/i, '$1 ')
    .replace(/\s+/g, ' ').trim();

  const addDays = (iso, n) => {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return T.isoOf(d);
  };
  const monthOf = iso => {
    const d = new Date(iso + 'T00:00:00');
    return new Date(d.getFullYear(), d.getMonth(), 1);
  };

  function dayCell(date, inMonth) {
    const iso = T.isoOf(date), n = date.getDate();
    const d = T.dayOf(iso);
    const today = T.todayISO();
    if (!d) {
      return `<div class="calcell outside${inMonth ? '' : ' adj'}" role="gridcell" aria-disabled="true">
        <span class="cd">${n}</span></div>`;
    }
    const st = T.stateOf(iso);
    const doneCount = T.doneCountOf(st, d.sessions);
    const allDone = doneCount === d.sessions.length && d.sessions.length > 0;
    /* A past day still carrying real work nobody ticked. This is the whole
       point of the grid for catching up: glance, find the gaps, tap them.

       "Real work" excludes the standing morning practice, because it is on
       every single day of the year — counting it would paint the entire past
       as owed and the signal would mean nothing. A rest day cannot be owed
       either. */
    const owed = iso < today
      && d.sessions.filter(substantive).some(x => !T.doneOf(st, x));
    const heads = headline(d);
    const cls = ['calcell'];
    if (!inMonth) cls.push('adj');
    if (iso === today) cls.push('today');
    else if (iso < today) cls.push('past');
    if (iso === CAL_SEL) cls.push('sel');
    if (allDone) cls.push('isdone');
    if (owed) cls.push('owed');
    if (d.deload) cls.push('deload');
    const climbed = T.climbOn(iso) ? '<span class="cevent" aria-hidden="true">🧗</span>' : '';
    const chips = heads.slice(0, 2).map(s =>
      `<span class="chip ${s.kind}${s.key ? ' key' : ''}${T.doneOf(st, s) ? ' did' : ''}">${T.esc(shortTitle(iso, s))}</span>`).join('')
      + (heads.length > 2 ? `<span class="chip more">+${heads.length - 2}</span>` : '');
    const said = heads.map(s => T.titleOf(iso, s) + (s.key ? ' (key)' : '')).join(', ');
    return `<button type="button" class="${cls.join(' ')}" data-cal="${iso}" role="gridcell"
        tabindex="${iso === focusDay() ? 0 : -1}"
        aria-selected="${iso === CAL_SEL}"
        ${iso === today ? 'aria-current="date"' : ''}
        aria-label="${T.esc(T.pretty(iso))}: ${T.esc(said)}${allDone ? ', done' : owed ? ', not ticked' : ''}">
      <span class="ctop">${climbed}<span class="cd">${n}</span>${allDone ? '<span class="ctick" aria-hidden="true">✓</span>' : ''}</span>
      <span class="cdots" aria-hidden="true">${dotsFor(d)}</span>
      <span class="chips" aria-hidden="true">${chips}</span>
    </button>`;
  }

  /* The right-hand edge of each row on a wide screen: which week of the plan
     it is and how the running is going against the week's target. A week
     row is a plan week — both start on Sunday — so this is one number per
     row, not an average. Hidden on a phone; the day panel says the same. */
  function weekGutter(rowStart) {
    let d = null;
    for (let i = 0; i < 7 && !d; i++) d = T.dayOf(addDays(rowStart, i));
    if (!d) return '<div class="calwk" aria-hidden="true"></div>';
    const wk = T.weeks()[d.week] || {};
    const phase = T.phases().find(p => p.w0 === d.week);
    const ran = T.weekMetres(d.week) / 1609.344;
    const target = wk.miles || 0;
    const started = rowStart <= T.todayISO();
    const pct = target ? Math.min(100, Math.round(ran / target * 100)) : 0;
    return `<div class="calwk${wk.deload ? ' deload' : ''}" aria-hidden="true">
      ${phase ? `<span class="wk-phase">${T.esc(phase.name)}</span>` : ''}
      <span class="wk-n">Week ${d.week}</span>
      <span class="wk-mi">${started ? `${T.miles(ran * 1609.344) || 0}<span>/${target}</span>` : `${target}`} mi</span>
      ${started && target ? `<span class="wk-bar"><i style="width:${pct}%"></i></span>` : ''}
    </div>`;
  }

  /* One line over the grid: what the month holds, and — for the part of it
     that has happened — how much got done. */
  function monthSummary(y, m) {
    const today = T.todayISO();
    const inMonth = T.days().filter(d => {
      const [yy, mm] = d.date.split('-').map(Number);
      return yy === y && mm - 1 === m;
    });
    if (!inMonth.length) return '';
    let climbs = 0, runs = 0, keys = 0, owed = 0, due = 0, did = 0;
    for (const d of inMonth) {
      const real = d.sessions.filter(substantive);
      if (real.some(s => s.kind === 'climb')) climbs++;
      if (real.some(s => s.kind === 'run')) runs++;
      keys += real.filter(s => s.key).length;
      if (d.date <= today) {
        const st = T.stateOf(d.date);
        due += real.length;
        did += real.filter(s => T.doneOf(st, s)).length;
        if (d.date < today && real.some(s => !T.doneOf(st, s))) owed++;
      }
    }
    const bits = [
      `<span><b>${climbs}</b> climbing day${climbs === 1 ? '' : 's'}</span>`,
      `<span><b>${runs}</b> run${runs === 1 ? '' : 's'}</span>`,
      `<span><b>${keys}</b> key</span>`
    ];
    if (due) bits.push(`<span class="sum-done${did === due ? ' all' : ''}"><b>${did}</b>/${due} done so far</span>`);
    if (owed) bits.push(`<span class="sum-owed"><b>${owed}</b> to tick</span>`);
    return bits.join('');
  }

  /* Which phases this month falls in, for the line under its name. */
  function monthPhases(y, m) {
    const names = [];
    for (const d of T.days()) {
      const [yy, mm] = d.date.split('-').map(Number);
      if (yy === y && mm - 1 === m && !names.includes(d.phase)) names.push(d.phase);
    }
    return names.join(' → ');
  }

  /* The day keyboard focus lives on. Arrow keys move it; Tab lands on it. The
     open day if there is one in this month, else today, else the 1st. */
  let FOCUS = null;
  function focusDay() {
    const y = CAL_MONTH.getFullYear(), m = CAL_MONTH.getMonth();
    const inView = iso => iso && monthOf(iso).getTime() === new Date(y, m, 1).getTime() && T.dayOf(iso);
    if (inView(FOCUS)) return FOCUS;
    if (inView(CAL_SEL)) return CAL_SEL;
    if (inView(T.todayISO())) return T.todayISO();
    const first = T.days().find(d => inView(d.date));
    return first ? first.date : null;
  }

  function renderCal() {
    if (!T.ready() || !T.days().length) return;
    const first = T.days()[0].date, last = T.days()[T.days().length - 1].date;
    if (!CAL_MONTH) {
      const anchor = T.dayOf(T.todayISO()) ? T.todayISO() : first;
      CAL_MONTH = monthOf(anchor);
    }
    const y = CAL_MONTH.getFullYear(), m = CAL_MONTH.getMonth();
    $('#calmonth').textContent = `${MONTH_NAMES[m]} ${y}`;
    $('#calphase').textContent = monthPhases(y, m);
    $('#calsum').innerHTML = monthSummary(y, m);
    $('.caldow').innerHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
      .map(x => `<span><b>${x[0]}</b><em>${x.slice(1)}</em></span>`).join('') + '<span class="dow-wk">Week</span>';

    /* Whole weeks, Sunday to Saturday, with the neighbouring months' days
       filling the ends of the first and last rows. They are the plan too —
       tapping one goes there — just quieter, so the month still reads as the
       month. */
    const gridStart = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    const monthEnd = new Date(y, m + 1, 0);
    const rows = [];
    for (let row = new Date(gridStart); row <= monthEnd; row.setDate(row.getDate() + 7)) {
      const cells = [];
      for (let i = 0; i < 7; i++) {
        const day = new Date(row.getFullYear(), row.getMonth(), row.getDate() + i);
        cells.push(dayCell(day, day.getMonth() === m));
      }
      rows.push(`<div class="calrow" role="row">${cells.join('')}${weekGutter(T.isoOf(row))}</div>`);
    }
    const grid = $('#calgrid');
    grid.innerHTML = rows.join('');
    grid.classList.remove('slide-l', 'slide-r');
    if (SLIDE) { void grid.offsetWidth; grid.classList.add(SLIDE > 0 ? 'slide-l' : 'slide-r'); SLIDE = 0; }

    /* Do not offer months the plan does not cover. */
    const prevEnd = new Date(y, m, 0), nextStart = new Date(y, m + 1, 1);
    $('#calprev').disabled = T.isoOf(prevEnd) < first;
    $('#calnext').disabled = T.isoOf(nextStart) > last;

    $('#calday').innerHTML = CAL_SEL ? calDayPanel(CAL_SEL) : '';
    /* Scoped: #today already carries its listeners and must not be handed a
       second set every time a month is turned. */
    if (CAL_SEL) T.wire($('#calday'));

    /* Three months out and the only way home was tapping ‹ until you got there.
       Hidden when today is already the open day on screen, so it is never a
       button that does nothing. */
    const today = T.todayISO();
    const onToday = CAL_SEL === today && CAL_MONTH.getTime() === monthOf(today).getTime();
    $('#caltoday').hidden = onToday || !T.dayOf(today);
    grid.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
      FOCUS = b.dataset.cal;
      /* Tapping the open day closes it; tapping any other opens that one. */
      if (CAL_SEL === b.dataset.cal) { CAL_SEL = null; renderCal(); refocus(); return; }
      openDay(b.dataset.cal, { focus: true });
    });
  }

  function turn(by) {
    const btn = by < 0 ? $('#calprev') : $('#calnext');
    if (btn.disabled) return;
    SLIDE = by;
    CAL_MONTH = new Date(CAL_MONTH.getFullYear(), CAL_MONTH.getMonth() + by, 1);
    CAL_SEL = null;
    FOCUS = null;
    renderCal();
  }

  function refocus() {
    const el = $(`#calgrid [data-cal="${focusDay()}"]`);
    if (el) el.focus({ preventScroll: true });
  }

  function calDayPanel(iso) {
    const d = T.dayOf(iso);
    if (!d) return '';
    const st = T.stateOf(iso);
    const wk = T.weeks()[d.week] || {};
    const today = T.todayISO();
    const rel = iso === today ? 'Today' : iso === addDays(today, 1) ? 'Tomorrow'
              : iso === addDays(today, -1) ? 'Yesterday' : '';
    const real = d.sessions.filter(substantive);
    const did = real.filter(s => T.doneOf(st, s)).length;
    const status = !real.length ? ''
      : did === real.length ? '<span class="dstat ok">done</span>'
      : iso < today ? `<span class="dstat owe">${did}/${real.length} ticked</span>` : '';
    return `<div class="calday">
      <div class="calday-head">
        <button type="button" class="daystep" data-step="-1" aria-label="Previous day"${T.dayOf(addDays(iso, -1)) ? '' : ' disabled'}>‹</button>
        <div class="calday-title">
          <h3>${rel ? `<span class="rel">${rel}</span> ` : ''}${T.esc(T.pretty(iso))} ${status}</h3>
          <div class="sub">${T.esc(d.phase)} · week ${d.week}${d.deload ? ' · deload' : ''} · ${
            T.miles(T.weekMetres(d.week)) || 0} of ${wk.miles ?? '—'} mi run that week</div>
        </div>
        <button type="button" class="daystep" data-step="1" aria-label="Next day"${T.dayOf(addDays(iso, 1)) ? '' : ' disabled'}>›</button>
      </div>
      ${T.runLink(iso)}
      ${d.sessions.map((s, i) => T.sessionRow(iso, s, i)).join('')}
      ${Owner.on() && d.sessions.length > 1 ? `<button type="button" class="allbtn" data-all="${T.esc(iso)}">Did all of it</button>` : ''}
      ${T.notesBlock(iso)}
      ${T.climbLink(iso)}
    </div>`;
  }

    /* ── the month picker ──
       The label opens two selects. They are built from the plan's own first and
       last day rather than a hard-coded range, so a plan that moves or grows
       needs no edit here, and a month the plan does not cover cannot be chosen:
       the year list holds only years it touches, and months outside it are
       disabled rather than hidden, so the shape of the year stays readable.

       Picking lands on the 1st of that month with no day selected — the same
       state the arrows leave you in — except where the month contains today, in
       which case today opens, because that is almost certainly why you came
       back to it. */
    function planRange() {
      const days = T.days();
      return [days[0].date, days[days.length - 1].date];
    }

    function fillPicker(y, m) {
      const [first, last] = planRange();
      const y0 = +first.slice(0, 4), y1 = +last.slice(0, 4);
      const ys = $('#pickyear'), ms = $('#pickmonth');
      ys.innerHTML = '';
      for (let n = y0; n <= y1; n++) {
        const o = document.createElement('option');
        o.value = n; o.textContent = n; o.selected = n === y;
        ys.appendChild(o);
      }
      ms.innerHTML = '';
      MONTH_NAMES.forEach((name, i) => {
        const o = document.createElement('option');
        o.value = i; o.textContent = name; o.selected = i === m;
        /* A month is reachable if any of it falls inside the plan. */
        const monthEnd = T.isoOf(new Date(y, i + 1, 0));
        const monthStart = T.isoOf(new Date(y, i, 1));
        o.disabled = monthEnd < first || monthStart > last;
        ms.appendChild(o);
      });
    }

    function openPicker(open) {
      const btn = $('#calmonth'), panel = $('#calpick');
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      if (open) $('#pickmonth').focus();
    }

    function jumpTo(y, m) {
      const [first, last] = planRange();
      const today = T.todayISO();
      const inThisMonth = +today.slice(0, 4) === y && +today.slice(5, 7) - 1 === m;
      openPicker(false);
      if (inThisMonth && T.dayOf(today)) { openDay(today); return; }
      CAL_MONTH = new Date(y, m, 1);
      CAL_SEL = null;
      renderCal();
    }

    $('#calmonth').addEventListener('click', () => {
      const open = $('#calpick').hidden;
      if (open) fillPicker(CAL_MONTH.getFullYear(), CAL_MONTH.getMonth());
      openPicker(open);
    });
    $('#pickmonth').addEventListener('change', e =>
      jumpTo(+$('#pickyear').value, +e.target.value));
    $('#pickyear').addEventListener('change', e => {
      /* Changing the year can leave the chosen month outside the plan — 2027
         only runs to August — so the options are rebuilt and the month is
         pulled to the nearest one that exists rather than jumping somewhere
         the calendar cannot show. */
      const y = +e.target.value;
      fillPicker(y, CAL_MONTH.getMonth());
      const ms = $('#pickmonth');
      if (ms.selectedOptions[0] && ms.selectedOptions[0].disabled) {
        const ok = [...ms.options].filter(o => !o.disabled);
        if (!ok.length) return;
        const want = CAL_MONTH.getMonth();
        const near = ok.reduce((a, b) =>
          Math.abs(+b.value - want) < Math.abs(+a.value - want) ? b : a);
        near.selected = true;
      }
      jumpTo(y, +ms.value);
    });

    /* Anywhere else closes it, and so does Escape — a panel you can only shut
       by choosing something is a trap when you opened it to look. */
    document.addEventListener('click', e => {
      if (!$('#calpick').hidden && !e.target.closest('#calpick, #calmonth')) openPicker(false);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('#calpick').hidden) { openPicker(false); $('#calmonth').focus(); }
    });

    /* A link in with a date on it opens that day. Read once, on the first
       render after the plan lands, and then taken OUT of the address bar.

       Leaving it there was the "stuck on September" bug's second half: the
       home page's last-workout card links here as #d-<that day>, and with the
       hash still in the URL every reload — and any home-screen shortcut saved
       from it — reopened that same September day forever, however far the
       season had moved on. A link is a request to look at a day once, not a
       new front door. */
    const hashDay = () => /^#d-\d{4}-\d{2}-\d{2}$/.test(location.hash) ? location.hash.slice(3) : null;
    let wantDay = hashDay();
    let firstRender = true;
    const dropHash = () => {
      if (location.hash) history.replaceState(history.state, '', location.pathname + location.search);
    };

    /* Selecting a day, wherever the request came from — a tap, the Today
       button, a day-step arrow, the keyboard, or a #d- link. One function so
       they all land the same way: the month containing it, the day open, and
       the panel brought into view. */
    function openDay(iso, opts = {}) {
      if (!T.dayOf(iso)) return;
      const to = monthOf(iso);
      if (CAL_MONTH && to.getTime() !== CAL_MONTH.getTime()) SLIDE = to > CAL_MONTH ? 1 : -1;
      CAL_SEL = iso;
      FOCUS = iso;
      CAL_MONTH = to;
      renderCal();
      if (opts.focus) refocus();
      if (opts.scroll !== false) {
        const el = $('#calday');
        if (el) el.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }
    }

    $('#calprev').addEventListener('click', () => turn(-1));
    $('#calnext').addEventListener('click', () => turn(1));
    $('#caltoday').addEventListener('click', () => openDay(T.todayISO(), { focus: true }));

    /* The day panel's own ‹ › — walking a week day by day without going back
       up to the grid, which on a phone is a scroll away. Delegated, because
       the panel is redrawn on every tick. */
    $('#calday').addEventListener('click', e => {
      const b = e.target.closest('[data-step]');
      if (!b || b.disabled || !CAL_SEL) return;
      openDay(addDays(CAL_SEL, +b.dataset.step), { scroll: false });
    });

    /* Arrow keys walk the grid the way every calendar does: a day sideways, a
       week up and down, Home/End to the ends of the week, Page Up/Down a
       month. Walking off the month turns it. Enter and Space are the
       buttons' own. */
    $('#calgrid').addEventListener('keydown', e => {
      const at = e.target.closest('[data-cal]');
      if (!at) return;
      const iso = at.dataset.cal;
      const dow = new Date(iso + 'T00:00:00').getDay();
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7, Home: -dow, End: 6 - dow }[e.key];
      let to = null;
      if (step !== undefined) to = addDays(iso, step);
      else if (e.key === 'PageUp' || e.key === 'PageDown') {
        const d = new Date(iso + 'T00:00:00');
        d.setMonth(d.getMonth() + (e.key === 'PageUp' ? -1 : 1));
        to = T.isoOf(d);
      }
      if (!to) return;
      e.preventDefault();
      if (!T.dayOf(to)) return;
      FOCUS = to;
      const mo = monthOf(to);
      if (mo.getTime() !== CAL_MONTH.getTime()) {
        SLIDE = mo > CAL_MONTH ? 1 : -1;
        CAL_MONTH = mo;
        renderCal();
      } else {
        $('#calgrid').querySelectorAll('[data-cal]').forEach(b => b.tabIndex = b.dataset.cal === to ? 0 : -1);
      }
      refocus();
    });

    /* A sideways swipe on the grid turns the month — the gesture a phone
       calendar has taught everyone. Only a clearly horizontal one, so a
       thumb scrolling the page past the grid never turns it by accident. */
    let touch = null;
    $('#calgrid').addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { touch = null; return; }
      touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    $('#calgrid').addEventListener('touchend', e => {
      if (!touch) return;
      const dx = e.changedTouches[0].clientX - touch.x;
      const dy = e.changedTouches[0].clientY - touch.y;
      touch = null;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      turn(dx < 0 ? 1 : -1);
    }, { passive: true });

    /* A #d- link followed while already on this page arrives as a hashchange,
       not a load. */
    window.addEventListener('hashchange', () => {
      const iso = hashDay();
      dropHash();
      if (iso && T.ready()) openDay(iso);
    });

    /* Midnight, or coming back to a tab that has been asleep since yesterday.
       If the page was sitting on the old today — its day open, or its month
       showing with nothing chosen — it follows the clock. If you had walked
       off somewhere else on purpose, it leaves you there. */
    T.onNewDay((was, now) => {
      const onOld = CAL_SEL === was
        || (!CAL_SEL && CAL_MONTH && CAL_MONTH.getTime() === monthOf(was).getTime());
      if (!onOld || !T.dayOf(now)) return;
      if (CAL_SEL === was || CAL_SEL === null) CAL_SEL = now;
      FOCUS = now;
      CAL_MONTH = monthOf(now);
    });

    function render() {
      if (!T.ready()) return;
      T.mountOwnerBar();
      /* Arrive with today already open. The page used to land on a grid of
         dots with an empty panel under it, so the commonest thing you could
         want here — tick what I did today — cost a tap before anything was
         even on screen. A #d- link still wins, and after the first render this
         steps back and lets the taps decide. */
      if (firstRender) {
        const want = (wantDay && T.dayOf(wantDay)) ? wantDay
                   : T.dayOf(T.todayISO()) ? T.todayISO() : null;
        if (want) { CAL_SEL = want; FOCUS = want; CAL_MONTH = monthOf(want); }
        firstRender = false;
        dropHash();
      }
      renderCal();
      if (wantDay) {
        const el = $('#calday');
        if (el) el.scrollIntoView({ block: 'nearest' });
        wantDay = null;
      }
    }

    T.onChange(render);
    T.load();
  })();
  </script>
  <script src="../../effects.js"></script>
</body>
</html>
