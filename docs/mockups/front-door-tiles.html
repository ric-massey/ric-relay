<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front door tiles — mockup</title>
  <!-- A mockup for Ric to pick a tile style (2026-10-29): nine subject tiles
       instead of the scrolling feed, in three looks. Not part of the site. -->
  <style>
    :root {
      --bg: #0a0b0d; --bg-2: #15161a; --ink: #eef0f3; --muted: #9a9fa8; --hair: rgba(255,255,255,.1);
      --violet: #7b3cff; --magenta: #ff2d8a; --cyan: #00c2ff;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --narrow: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.2,.7,.2,1);
      --gutter: clamp(16px, 4vw, 56px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); min-height: 100vh; }

    /* the mockup's own switch — not part of the design */
    .pick { position: sticky; top: 0; z-index: 50; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      padding: 10px var(--gutter); background: rgba(10,11,13,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--hair); }
    .pick span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
    .pick button { font: 600 14px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--hair); padding: 10px 14px; min-height: 44px; cursor: pointer; }
    .pick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    header.top { padding: clamp(28px, 6vh, 64px) var(--gutter) clamp(20px, 3vh, 32px); max-width: 1320px; margin: 0 auto; }
    h1 { font: 600 clamp(38px, 6vw, 84px)/.92 var(--sans); letter-spacing: -.05em; }
    h1 i { font-style: normal; color: var(--magenta); }
    .term { margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #0a0a0a; border: 1px solid #6b4d00; color: #ffb000; font: 15px var(--mono); max-width: 100%; }
    .term .c { width: 8px; height: 16px; background: #ffb000; animation: blink 1s steps(1) infinite; }
    .term .ph { color: #c08a10; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @keyframes blink { 50% { opacity: 0; } }

    main { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter) 60px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr 1fr; gap: 8px; } }

    /* a tile, any style */
    .tile { position: relative; cursor: pointer; border: 0; text-align: left; font: inherit; color: var(--ink); background: none; display: block; width: 100%; }
    .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .tile .name, .tile .count { position: relative; z-index: 2; }
    .tile .count { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; }

    /* what opens under a tile: its things, one line each */
    .open { grid-column: 1 / -1; overflow: hidden; }
    .open ul { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 28px; }
    .open li a { display: block; padding: 12px 0; min-height: 44px; color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; border-color: color-mix(in srgb, currentColor 16%, transparent); }
    .open li b { display: block; font-weight: 600; }
    .open li span { display: block; font-size: 14px; opacity: .78; line-height: 1.4; }
    .open li a:hover b { text-decoration: underline; text-underline-offset: 3px; }

    /* ─── A: torn paper ─── each tile is torn from its room's own paper */
    .s-paper .tile { aspect-ratio: 4 / 3; background: var(--paper); color: var(--tink); padding: 20px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
      clip-path: var(--tear); transition: transform .35s var(--ease); }
    .s-paper .tile:hover, .s-paper .tile:focus-visible { transform: translateY(-4px) rotate(var(--tilt)); outline: 0; }
    .s-paper .tile canvas { opacity: .95; }
    .s-paper .tile .wash { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, transparent 30%, var(--paper) 88%); }
    .s-paper .tile .name { font: var(--hw, 700) clamp(22px, 2.6vw, 34px)/1 var(--hf, var(--sans)); letter-spacing: var(--hls, -.03em); text-transform: var(--htt, none); }
    .s-paper .tile .count { color: var(--tmuted); }
    .s-paper .open { background: var(--paper); color: var(--tink); padding: 8px 24px 18px; margin-top: -4px; clip-path: var(--tear2); }
    @media (max-width: 760px) { .s-paper .tile { aspect-ratio: 1 / 1; padding: 14px; } }

    /* ─── B: shop windows ─── the room running fills the tile, the name sits on it */
    .s-window .grid { gap: 14px; }
    .s-window .tile { aspect-ratio: 16 / 10; background: var(--paper); overflow: hidden; border-radius: 4px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: flex-end;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
    .s-window .tile::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.78)); }
    .s-window .tile:hover, .s-window .tile:focus-visible, .s-window .tile[aria-expanded="true"] { transform: scale(1.025); box-shadow: 0 0 0 2px var(--accent), 0 18px 50px -12px var(--accent); outline: 0; z-index: 3; }
    .s-window .tile .name { color: #fff; font: 700 clamp(20px, 2.2vw, 30px)/1.05 var(--sans); letter-spacing: -.03em; }
    .s-window .tile .count { color: rgba(255,255,255,.82); margin-top: 4px; }
    .s-window .open { background: var(--bg-2); color: var(--ink); padding: 6px 22px 16px; border-top: 2px solid var(--accent); border-radius: 4px; }
    @media (max-width: 760px) { .s-window .tile { aspect-ratio: 1 / 1; padding: 12px; } }

    /* ─── C: home screen ─── it's an internet: apps on a desktop, folders open */
    .s-home .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 28px 18px; max-width: 820px; margin: 12px auto 0; }
    .s-home .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .s-home .icon { position: relative; width: clamp(84px, 11vw, 112px); aspect-ratio: 1; border-radius: 24%; overflow: hidden; background: var(--paper);
      box-shadow: 0 10px 28px -10px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.12); transition: transform .3s var(--ease); }
    .s-home .tile:hover .icon, .s-home .tile:focus-visible .icon { transform: scale(1.08); }
    .s-home .tile:focus-visible { outline: 0; }
    .s-home .tile .name { font: 500 14px var(--sans); color: var(--ink); }
    .s-home .tile .count { display: none; }
    .s-home .badge { position: absolute; top: 6px; right: 6px; z-index: 3; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; background: var(--magenta); color: #fff; font: 700 12px/22px var(--sans); text-align: center; }
    .folder { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.55); backdrop-filter: blur(18px); }
    .folder[hidden] { display: none; }
    .folder .box { width: min(560px, 100%); max-height: 86vh; overflow: auto; background: var(--paper); color: var(--tink); border-radius: 28px; padding: 22px 24px 18px; animation: pop .35s var(--ease); }
    .folder h2 { font: 700 26px var(--sans); letter-spacing: -.03em; margin-bottom: 4px; }
    .folder ul { list-style: none; }
    .folder li a { display: block; padding: 12px 0; min-height: 44px; color: inherit; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, currentColor 16%, transparent); }
    .folder li b { display: block; } .folder li span { display: block; font-size: 14px; opacity: .78; }
    .folder .x { float: right; width: 44px; height: 44px; border: 0; background: none; color: inherit; font-size: 26px; cursor: pointer; }
    @keyframes pop { from { transform: scale(.86); opacity: 0; } }

    .note { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter) 40px; color: var(--muted); font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="pick" role="group" aria-label="Tile style">
    <span>Style</span>
    <button type="button" data-s="paper" aria-pressed="true">A · Torn paper</button>
    <button type="button" data-s="window" aria-pressed="false">B · Shop windows</button>
    <button type="button" data-s="home" aria-pressed="false">C · Home screen</button>
  </div>
  <header class="top">
    <h1>Ric Massey's own internet<i>.</i></h1>
    <div class="term"><span>~$</span><span class="ph" id="ph">star wars</span><i class="c"></i></div>
  </header>
  <main id="main" class="s-paper"><div class="grid" id="grid"></div></main>
  <p class="note">Mockup. Tap a tile to open it. The drawings are stand-ins for the live ones the real page would use.</p>
  <div class="folder" id="folder" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="fh"><button class="x" id="fx" aria-label="Close">×</button><h2 id="fh"></h2><ul id="fl"></ul></div></div>

  <script>
    const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Nine subjects. Colours are the rooms' own papers from index.html.
    const TILES = [
      { id: "games", name: "Games", paper: "#05070c", ink: "#f3d67a", muted: "#bcae7c", accent: "#8a7bff", hf: "var(--mono)", hw: 500, htt: "uppercase", hls: ".12em", art: "ships", items: [
        ["KONDRITE", "A space game — chart a sector alone or fight with friends."], ["Interstate 40", "Drive the real I-40, 2,551 miles, real traffic counts."],
        ["Starfield", "Fly through real stars toward light speed."], ["FARLIGHT", "A little ship, a lot of hills."], ["The Arcade", "Every game on one shelf."],
        ["Counter-Strike", "Every match replayed from above."], ["Apex", "Kills, legends and ranked."]] },
      { id: "space", name: "Space", paper: "#0b0a14", ink: "#ece8ff", muted: "#a9a3c9", accent: "#a78bfa", hf: "var(--serif)", hw: 400, hls: "-.02em", art: "rings", items: [
        ["How Big Everything Is", "Quark to cosmos, every rung to scale."], ["How Speed Affects Time", "One slider, two clocks, the real sky."],
        ["The Geometry of Spacetime", "Relativity in four chapters you can play with."], ["The Leviathan", "KONDRITE's giant derelict, laid flat."]] },
      { id: "films", name: "Films & TV", paper: "#0b0a08", ink: "#fff8e6", muted: "#c9b98a", accent: "#f5c518", hf: "var(--narrow)", hw: 800, htt: "uppercase", hls: ".01em", art: "posters", items: [
        ["Entertainment", "What we've watched, and what to watch tonight."], ["The Library", "Every title — filter by service, genre, decade."],
        ["Siege Conductor", "Star Wars: Siege of Mandalore + Revenge of the Sith as one story."]] },
      { id: "weather", name: "Weather", paper: "#0f2747", ink: "#ffffff", muted: "#b7c9e0", accent: "#7cc4ff", hf: "var(--sans)", hw: 300, hls: "-.03em", art: "radar", items: [
        ["Weather", "Now, the next hours, ten days, radar."], ["Weather Pro", "The full map, soundings, models."]] },
      { id: "climbing", name: "Climbing", paper: "#f4f0e6", ink: "#1f2a22", muted: "#57605a", accent: "#3c7a3b", hf: "var(--serif)", hw: 400, hls: "-.025em", art: "holds", items: [
        ["Climbing", "Every day out — sends, clips, the to-do."], ["The Boards", "Kilter and Tension, holds lit up."],
        ["Climbing Media", "Photos by the day."], ["Climbing Stats", "Hardest each year, crags, partners."]] },
      { id: "training", name: "Training", paper: "#ffffff", ink: "#242428", muted: "#5f5f66", accent: "#fc4c02", hf: "var(--sans)", hw: 800, hls: "-.035em", art: "route", items: [
        ["Training", "Every run, the moment the watch syncs."], ["Training Calendar", "The year's plan, month by month."], ["Trips & Races", "What's coming up."]] },
      { id: "photos", name: "Photos", paper: "#160b09", ink: "#f6e2d8", muted: "#c79d8c", accent: "#ff4b2b", hf: "var(--mono)", hw: 300, htt: "uppercase", hls: ".2em", art: "frames", items: [
        ["Captures", "Over 1,300 photographs, newest first."]] },
      { id: "mind", name: "Mind", paper: "#ece3cf", ink: "#2a2130", muted: "#5e5463", accent: "#8a4fa3", hf: "var(--serif)", hw: 400, hls: "-.02em", art: "mood", items: [
        ["Psyche", "A field notebook on minds."], ["State of Mind", "My mood as a moving line."],
        ["The Shape of the Criteria", "How the DSM-5 describes autism."], ["Studies", "Search every clinical trial."]] },
      { id: "built", name: "Things I built", paper: "#04070d", ink: "#d8ecff", muted: "#8fa7bd", accent: "#38ff9c", hf: "var(--mono)", hw: 500, htt: "uppercase", hls: ".1em", art: "pulse", items: [
        ["Orrin", "A program that keeps running on its own."], ["The Terminal", "Type a room's name and you're in."], ["ATLAS", "The crew's private map. Sign in."]] },
    ];

    // ── stand-in drawings, one per subject ──
    const ART = {
      ships(x, w, h, t, s) {
        s.p ||= Array.from({ length: 70 }, () => [Math.random(), Math.random(), Math.random()]);
        x.fillStyle = "#05070c"; x.fillRect(0, 0, w, h);
        for (const p of s.p) { const px = ((p[0] - t * 0.02 * (p[2] + .2)) % 1 + 1) % 1 * w; x.fillStyle = `rgba(243,214,122,${.25 + p[2] * .6})`; x.fillRect(px, p[1] * h, 1 + p[2] * 1.5, 1 + p[2] * 1.5); }
        for (let i = 0; i < 3; i++) { const a = t * .5 + i * 2.1, cx = w * (.5 + .28 * Math.cos(a)), cy = h * (.42 + .2 * Math.sin(a * 1.3));
          x.save(); x.translate(cx, cy); x.rotate(a + Math.PI / 2 + .6); x.strokeStyle = i ? "#8a7bff" : "#f3d67a"; x.lineWidth = 1.5;
          x.beginPath(); x.moveTo(0, -9); x.lineTo(6, 7); x.lineTo(0, 3); x.lineTo(-6, 7); x.closePath(); x.stroke(); x.restore(); }
      },
      rings(x, w, h, t) {
        x.fillStyle = "#0b0a14"; x.fillRect(0, 0, w, h);
        for (let i = 0; i < 9; i++) { const r = ((i / 9 + t * .06) % 1) ** 2 * Math.max(w, h) * .9;
          x.strokeStyle = `rgba(167,139,250,${.7 * (1 - r / (Math.max(w, h) * .9))})`; x.lineWidth = 1; x.beginPath(); x.arc(w * .5, h * .42, r, 0, 7); x.stroke(); }
        x.fillStyle = "#ece8ff"; x.beginPath(); x.arc(w * .5, h * .42, 2.5, 0, 7); x.fill();
      },
      posters(x, w, h, t, s) {
        s.c ||= Array.from({ length: 14 }, (_, i) => `hsl(${(i * 53) % 360} 45% ${22 + (i * 7) % 20}%)`);
        x.fillStyle = "#0b0a08"; x.fillRect(0, 0, w, h);
        const pw = h * .42, ph = pw * 1.5, gap = 10, off = (t * 18) % (pw + gap);
        for (let r = 0; r < 2; r++) for (let i = -1; i < w / (pw + gap) + 2; i++) {
          const px = i * (pw + gap) - (r ? -off : off) - pw * .5 * r, py = h * .06 + r * (ph * .55);
          x.fillStyle = s.c[(i + 20 + r * 5) % s.c.length]; x.fillRect(px, py, pw, ph);
          x.fillStyle = "rgba(245,197,24,.55)"; x.fillRect(px + 6, py + ph - 14, pw * .6, 3); }
      },
      radar(x, w, h, t, s) {
        s.b ||= Array.from({ length: 9 }, () => [Math.random() * 1.4 - .2, Math.random(), 18 + Math.random() * 46]);
        x.fillStyle = "#0f2747"; x.fillRect(0, 0, w, h);
        x.strokeStyle = "rgba(183,201,224,.13)"; for (let i = 0; i < w; i += 28) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 40, h); x.stroke(); }
        for (const b of s.b) { const cx = ((b[0] + t * .015) % 1.4 - .2) * w, cy = b[1] * h * .8;
          for (const [k, col] of [[1, "rgba(60,180,90,.45)"], [.6, "rgba(240,210,60,.55)"], [.3, "rgba(230,70,50,.7)"]]) { x.fillStyle = col; x.beginPath(); x.ellipse(cx, cy, b[2] * k * 1.3, b[2] * k * .8, .4, 0, 7); x.fill(); } }
      },
      holds(x, w, h, t, s) {
        x.fillStyle = "#f4f0e6"; x.fillRect(0, 0, w, h);
        s.h ||= Array.from({ length: 34 }, (_, i) => [((i * 37) % 11) / 11 + .04, ((i * 19) % 13) / 15 + .02, Math.random()]);
        const lit = Math.floor(t * 1.4) % s.h.length;
        s.h.forEach((p, i) => { const on = (i - lit + s.h.length) % s.h.length < 6; x.fillStyle = on ? (i % 6 === 0 ? "#3c7a3b" : "#d85a2a") : "rgba(31,42,34,.18)";
          x.beginPath(); x.arc(p[0] * w, p[1] * h * .8, on ? 7 : 5, 0, 7); x.fill(); });
      },
      route(x, w, h, t) {
        x.fillStyle = "#ffffff"; x.fillRect(0, 0, w, h);
        x.fillStyle = "rgba(36,36,40,.06)"; x.beginPath(); x.moveTo(0, h * .7);
        for (let i = 0; i <= w; i += 6) x.lineTo(i, h * (.62 - .12 * Math.sin(i * .02) - .06 * Math.sin(i * .051))); x.lineTo(w, h); x.lineTo(0, h); x.fill();
        const n = 160, k = Math.floor((t * 40) % (n + 40));
        x.strokeStyle = "#fc4c02"; x.lineWidth = 3; x.lineJoin = "round"; x.beginPath();
        for (let i = 0; i < Math.min(k, n); i++) { const a = i / n * Math.PI * 2, px = w * (.5 + .3 * Math.cos(a) + .06 * Math.sin(a * 3)), py = h * (.36 + .2 * Math.sin(a) + .05 * Math.cos(a * 5)); i ? x.lineTo(px, py) : x.moveTo(px, py); }
        x.stroke();
      },
      frames(x, w, h, t) {
        x.fillStyle = "#160b09"; x.fillRect(0, 0, w, h);
        const fw = h * .55, off = (t * 22) % (fw + 14);
        x.fillStyle = "#2a1410"; x.fillRect(0, h * .1, w, fw * .82 + 24);
        for (let i = -1; i < w / (fw + 14) + 2; i++) { const px = i * (fw + 14) - off;
          const g = x.createLinearGradient(px, 0, px + fw, h); g.addColorStop(0, `hsl(${15 + i * 25} 40% 35%)`); g.addColorStop(1, `hsl(${200 + i * 40} 25% 18%)`);
          x.fillStyle = g; x.fillRect(px, h * .1 + 12, fw, fw * .82);
          x.fillStyle = "rgba(255,75,43,.5)"; for (let j = 0; j < fw; j += 12) { x.fillRect(px + j, h * .1 + 3, 6, 5); x.fillRect(px + j, h * .1 + fw * .82 + 15, 6, 5); } }
      },
      mood(x, w, h, t) {
        x.fillStyle = "#ece3cf"; x.fillRect(0, 0, w, h);
        const line = (amp, col, lw, ph) => { x.strokeStyle = col; x.lineWidth = lw; x.beginPath();
          for (let i = 0; i <= w; i += 4) { const v = Math.sin(i * .018 + t * .6 + ph) * amp + Math.sin(i * .007 - t * .3) * amp * .6; i ? x.lineTo(i, h * .4 + v) : x.moveTo(i, h * .4 + v); } x.stroke(); };
        line(h * .05, "rgba(42,33,48,.3)", 1.5, 1); line(h * .2, "#8a4fa3", 2.5, 0);
      },
      pulse(x, w, h, t) {
        x.fillStyle = "#04070d"; x.fillRect(0, 0, w, h);
        const nodes = [[.2, .3], [.45, .18], [.7, .32], [.35, .55], [.62, .58], [.85, .5], [.15, .62]];
        nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j <= i || (i + j) % 3) return;
          const on = .2 + .8 * Math.max(0, Math.sin(t * 2 - i - j)); x.strokeStyle = `rgba(56,255,156,${.12 + on * .35})`; x.lineWidth = 1;
          x.beginPath(); x.moveTo(a[0] * w, a[1] * h); x.lineTo(b[0] * w, b[1] * h); x.stroke(); }));
        nodes.forEach((a, i) => { x.fillStyle = `rgba(56,255,156,${.4 + .6 * Math.max(0, Math.sin(t * 2 - i))})`; x.beginPath(); x.arc(a[0] * w, a[1] * h, 3, 0, 7); x.fill(); });
      },
    };

    // a torn edge, different every tile
    const tear = (seed, top) => { let r = seed; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647; const pts = [];
      if (top) { for (let i = 0; i <= 24; i++) pts.push(`${(i / 24 * 100).toFixed(1)}% ${(rnd() * 2.2).toFixed(2)}%`); pts.push("100% 100%", "0% 100%"); }
      else { pts.push("0% 0%", "100% 0%"); for (let i = 24; i >= 0; i--) pts.push(`${(i / 24 * 100).toFixed(1)}% ${(97 + rnd() * 3).toFixed(2)}%`); }
      return `polygon(${pts.join(",")})`; };

    const grid = document.getElementById("grid"), main = document.getElementById("main");
    const live = new Set();
    let style = "paper", openId = "";
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const list = (T) => T.items.map(([n, d]) => `<li><a href="#"><b>${esc(n)}</b><span>${esc(d)}</span></a></li>`).join("");

    function build() {
      live.clear(); grid.textContent = ""; main.className = `s-${style}`;
      TILES.forEach((T, i) => {
        const b = document.createElement("button");
        b.className = "tile"; b.type = "button"; b.dataset.id = T.id; b.setAttribute("aria-expanded", "false");
        Object.entries({ paper: T.paper, tink: T.ink, tmuted: T.muted, accent: T.accent, hf: T.hf, hw: T.hw, htt: T.htt || "none", hls: T.hls,
          tear: tear(i * 7919 + 13), tear2: tear(i * 104729 + 7, true), tilt: `${(i % 3 - 1) * .4}deg` }).forEach(([k, v]) => b.style.setProperty(`--${k}`, v));
        const cv = document.createElement("canvas"); cv.dataset.art = T.art; cv.st = {};
        const n = `${T.items.length} ${T.items.length === 1 ? "thing" : "things"}`;
        if (style === "home") {
          const ic = document.createElement("span"); ic.className = "icon"; ic.style.setProperty("--paper", T.paper); ic.append(cv);
          ic.insertAdjacentHTML("beforeend", T.items.length > 1 ? `<span class="badge">${T.items.length}</span>` : ""); b.append(ic);
          b.insertAdjacentHTML("beforeend", `<span class="name">${esc(T.name)}</span>`);
        } else {
          b.append(cv); b.insertAdjacentHTML("beforeend", `${style === "paper" ? '<span class="wash"></span>' : ""}<span class="name">${esc(T.name)}</span><span class="count">${n}</span>`);
        }
        grid.append(b); live.add(cv);
      });
      openId = "";
    }

    // open a tile: in place under its row (A, B), or as a folder (C)
    const folder = document.getElementById("folder");
    grid.addEventListener("click", (e) => {
      const b = e.target.closest(".tile"); if (!b) return;
      const T = TILES.find((x) => x.id === b.dataset.id);
      if (style === "home") {
        const box = folder.querySelector(".box"); box.style.setProperty("--paper", T.paper); box.style.setProperty("--tink", T.ink);
        document.getElementById("fh").textContent = T.name; document.getElementById("fl").innerHTML = list(T); folder.hidden = false; folder.querySelector(".x").focus(); return;
      }
      grid.querySelector(".open")?.remove(); grid.querySelectorAll(".tile").forEach((x) => x.setAttribute("aria-expanded", "false"));
      if (openId === T.id) { openId = ""; return; }
      openId = T.id; b.setAttribute("aria-expanded", "true");
      // the panel goes after the last tile in this tile's row
      const tiles = [...grid.querySelectorAll(".tile")], cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
      const idx = tiles.indexOf(b), end = tiles[Math.min(tiles.length - 1, Math.floor(idx / cols) * cols + cols - 1)];
      const p = document.createElement("div"); p.className = "open";
      Object.entries({ paper: T.paper, tink: T.ink, accent: T.accent, tear2: b.style.getPropertyValue("--tear2") }).forEach(([k, v]) => p.style.setProperty(`--${k}`, v));
      p.innerHTML = `<ul>${list(T)}</ul>`; end.after(p);
    });
    const shut = () => { folder.hidden = true; };
    document.getElementById("fx").onclick = shut;
    folder.addEventListener("click", (e) => { if (e.target === folder) shut(); });
    addEventListener("keydown", (e) => { if (e.key === "Escape") shut(); });

    document.querySelectorAll(".pick button").forEach((btn) => btn.addEventListener("click", () => {
      style = btn.dataset.s; document.querySelectorAll(".pick button").forEach((x) => x.setAttribute("aria-pressed", String(x === btn))); build();
    }));
    addEventListener("resize", () => { if (openId) { const b = grid.querySelector(`[data-id="${openId}"]`); openId = ""; b?.click(); } });

    // the terminal hint types a few searches
    { const ph = document.getElementById("ph"), words = ["star wars", "rain", "climbing", "kondrite", "what to watch"]; let i = 0;
      if (!STILL) setInterval(() => { ph.textContent = words[++i % words.length]; }, 2200); }

    let t0 = performance.now();
    (function frame(now) {
      const t = STILL ? 3 : (now - t0) / 1000;
      for (const c of live) { const w = c.clientWidth, h = c.clientHeight, d = Math.min(2, devicePixelRatio || 1); if (!w) continue;
        if (c.width !== Math.round(w * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
        const x = c.getContext("2d"); x.setTransform(d, 0, 0, d, 0, 0); ART[c.dataset.art](x, w, h, t, c.st); }
      requestAnimationFrame(frame);
    })(t0);
    build();
  </script>
</body>
