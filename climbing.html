<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing — Ric's Terminal</title>
  <meta name="description" content="Ric's climbing ledger — days out, projects, and the tick list.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ric's Terminal">
  <meta property="og:title" content="Climbing — Ric's Terminal">
  <meta property="og:description" content="Ric's climbing ledger — days out, projects, and the tick list.">
  <meta property="og:url" content="https://ricmassey.com/climbing.html">
  <meta property="og:image" content="https://ricmassey.com/assets/og-terminal.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://ricmassey.com/climbing.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a5a40'/><text y='.85em' font-size='68' x='16'>🧗</text></svg>">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/climbing/nav.css">
  <link rel="stylesheet" href="assets/climbing/climbing.css">
</head>
<body>

<script src="assets/climbing/nav.js" data-nav="home"></script>

<!-- The headline sits ON the photo rather than after it: the old page spent a
     whole phone screen on a picture and then started the page underneath it. -->
<header class="hero" id="hero">
  <div class="wrap">
    <div class="kicker" id="kicker"></div>
    <h1>Climbing</h1>
    <div class="tally" id="tally"></div>
  </div>
</header>

<div class="wrap">
  <!-- Hidden until it has an answer. An empty "next out" is worse than none. -->
  <div id="nextout"></div>

  <section>
    <div class="head">
      <h2>Last days out</h2>
      <a class="more" href="projects/climbing/index.html" id="alldays">All days &rarr;</a>
    </div>
    <div id="lastday"></div>
  </section>
</div>

<div class="band" id="band" hidden>
  <div class="cap"><strong id="bandcap"></strong></div>
</div>

<div class="wrap">
  <footer>
    Built from <code>climbs.md</code> — grades are opinions, memory is worse.
    <span id="stamp"></span>
  </footer>

  <!-- Signing in happens here, last thing on the room page, and nowhere else in
       the section. It was on the log before, where it met every stranger who
       arrived from a search with a password prompt three lines under the
       numbers. Signed in, the Add tab appears in the bar beside Boards; that is
       the whole visible consequence, because owner mode is a rendering hint and
       the Worker is what actually says yes — assets/owner.js says why at
       length. -->
  <div id="ownerbar"></div>
</div>

<script src="assets/owner.js?v=1"></script>
<script src="projects/climbing/climbs-data.js"></script>
<script src="projects/climbing/climb-vocab.js?v=2"></script>
<script src="projects/climbing/climb-parse.js?v=2"></script>
<script src="projects/climbing/climb-host.js?v=1"></script>
<script src="projects/climbing/web-trips.js?v=4"></script>
<script src="projects/climbing/climb-media.js?v=4"></script>
<script src="projects/climbing/climb-ui.js?v=2"></script>
<script src="projects/climbing/web-todo.js?v=3"></script>
<script>
(async () => {
  /* Both at once: one asks the log service what was climbed, the other what was
     filmed. In sequence the page waited for the sum of two round trips. */
  await Promise.all([
    WebTrips.merge(window.CLIMBING_DATA),
    WebTodo.merge(window.CLIMBING_DATA),
    ClimbMedia.load()
  ]);

  const DATA = window.CLIMBING_DATA;
  const $ = id => document.getElementById(id);
  const esc = ClimbUI.esc;
  if (!DATA) return;

  /* band, fmt and esc were written out again here before this page loaded
     climb-ui.js. Two copies of a grade band is how the room page and the log
     page end up disagreeing about what colour a 5.12 is. */
  const { band, fmt } = ClimbUI;

  /* ── the hero ─────────────────────────────────────────
     Four numbers, one of them the lead. The old ledger put seven equal cells in
     one flex row: at 940px they crushed to about 130px each and "Cold Hard
     Bitch · Slam Dunk · HARDEST SEND" became a six-line paragraph beside a
     two-line "207 SENDS". Anything past four goes to the stats page. */
  const s = DATA.stats;
  const hardest = (DATA.index && DATA.index.hardest) || bestSend();
  function bestSend() {
    let best = null;
    DATA.trips.forEach(t => t.routes.forEach(r => {
      if (r.outcome !== "sent" || !r.grade || r.gradeKind === "boulder") return;
      if (!best || (r.gradeRank || 0) > best.rank) best = { g: r.grade, rank: r.gradeRank || 0 };
    }));
    return best ? best.g : null;
  }
  const todoOpen = (DATA.todo || []).filter(t => !t.done).length;
  /* Each number goes to the page that number came from — the three counts to
     the stats it was taken off, the to-do to the to-do — landing on the section
     itself rather than the top of the page. They are deliberately not dressed
     as links: this is a headline, and four underlined words across a photo is a
     worse hero than four numbers. The cursor is the only tell, which is enough
     for the one person who goes looking. */
  $("tally").innerHTML = [
    [s.trips, "days out", true, "projects/climbing/stats.html#totals"],
    [s.sends, "sends", false, "projects/climbing/stats.html#totals"],
    [hardest || "—", "hardest", false, "projects/climbing/stats.html#hardest"],
    [todoOpen, "on the to-do", false, "projects/climbing/list.html"],
  ].map(([n, l, lead, href]) =>
    `<a href="${href}"${lead ? ' class="lead"' : ""}><b>${esc(n)}</b><span>${esc(l)}</span></a>`).join("");

  /* The crags he actually goes to, biggest first — not a hand-typed list that
     goes stale the first time he climbs somewhere new. */
  const areaCount = {};
  /* The phone sends "Obed" and "Ijams crag"; climbs.md says "The Obed" and
     "Ijams Crag". Unfolded, the same crag counts twice and the page shows
     whichever spelling that day happened to use. */
  const where = t => t.area ? ClimbUI.crag(t.area) : null;
  DATA.trips.forEach(t => { const a = where(t); if (a) areaCount[a] = (areaCount[a] || 0) + 1; });
  const areas = Object.entries(areaCount).sort((a, b) => b[1] - a[1]);
  $("kicker").textContent = areas.slice(0, 4).map(a => a[0]).join(" · ");

  /* A hero photo that rotates is a hero photo you cannot art-direct. One shot,
     chosen, with the focal point on him. */
  $("hero").style.backgroundImage = "url('photos/climbing-05.jpg')";

  /* ── next day out ─────────────────────────────────────
     From the crag plan, and only when there is one. */
  try {
    const plan = await (await fetch("assets/training/crag-plan.json", { cache: "no-store" })).json();
    /* Today where he is, not in UTC. toISOString() is UTC, and Knoxville runs
       four or five hours behind it — so from about 8pm the filter below was
       already on tomorrow's date and dropped the day out he had not had yet.
       The card skipped straight past it, every evening. */
    /* The page already folds every spelling of a crag to one name — ClimbUI.crag
       is why "PMRP", "PMPR" and "PMRP - Bears Den" are one row in the trip list
       above. The plan is a second source for the same places and was not going
       through it, so this card said "Ijams" on a day the rest of the page calls
       "Ijams Crag", depending only on whether the plan named the venue outright
       or left it to be read out of the prose.

       A venue naming a CHOICE of two places — "Obed or Lilly", a day out where
       the crag is not settled — is not a misspelling of either one, and folding
       it would pick a crag the plan deliberately did not. Those stay as written. */
    const venueName = v => !v ? "Out" : /\bor\b/i.test(v) ? v : ClimbUI.crag(v);

    const now = new Date();
    const todayISO = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}` +
                     `-${String(now.getDate()).padStart(2, "0")}`;
    const next = (plan.days || []).map(d => d)
      .filter(d => d.date >= todayISO)
      .sort((a, b) => a.date.localeCompare(b.date))[0];
    if (next) {
      /* Noon on BOTH sides. Noon is the usual guard against a DST change
         stretching or shrinking the day into a different answer, but it only
         works if both ends carry it: measuring noon from midnight left half a
         day on every result, and rounding turned that half into a whole one.
         Today read "Tomorrow", tomorrow read "In 2 days", and a day six out
         crossed the seven-day cutoff and lost its wording entirely. */
      const days = Math.round(
        (new Date(next.date + "T12:00") - new Date(todayISO + "T12:00")) / 864e5);
      const when = days <= 0 ? "Today" : days === 1 ? "Tomorrow"
                 : days < 7 ? `In ${days} days` : fmt(next.date, true);
      $("nextout").innerHTML =
        `<div class="next"><span class="in">${esc(when)}</span>` +
        `<span class="where">${esc(venueName(next.venue))}</span>` +
        /* A day at the home crag publishes as "Rope Day" in both fields now —
           the plan stopped naming Ijams on 2026-09-18 — so printing both would
           say it twice. The line is for what is planned when that is something
           other than the label above it. */
        (next.title && next.title !== venueName(next.venue)
          ? `<span class="what">${esc(next.title)}</span>` : "") +
        `<span class="when">${esc(fmt(next.date, true))}</span></div>`;
    }
  } catch (e) { /* No plan file, no card. The page is correct either way. */ }

  /* ── the last three days out ──────────────────────────
     One day was too thin a slice of a log this size: come back a fortnight
     later and the page looked identical. Three reads as a run of days.

     The newest gets the full treatment with its own media beside it — his
     clip, off that day, from the log service. The two behind it are compact,
     because their job is to say what the last couple of weeks looked like, not
     to be read in full; the log is one click away for that. */
  const recent = DATA.trips.filter(t => t.date).slice(0, 3);
  if (recent.length) {
    $("alldays").textContent = `All ${s.trips} →`;

    /* Guidebook lines: name left, leader dots, grade hard right. The outcome
       rides on the grade itself — filled sent, outline been on it — rather
       than a third word racing the other two to the right edge. */
    const routesHTML = (trip, withWalls) => {
      let wall = null;
      return trip.routes.map(r => {
        const head = [r.region, r.wall].filter(Boolean).join(" · ");
        const bar = withWalls && head && head !== wall
          ? (wall = head, `<div class="crag">${esc(head)}</div>`) : "";
        const cls = band(r.grade) + (r.outcome === "sent" ? "" : " try");
        return bar +
          `<div class="rt"><span class="nm">${r.star ? '<span class="fav">★</span> ' : ""}` +
          `${esc(r.name)}</span><span class="dot"></span>` +
          (r.repeats > 1 ? `<span class="meta">×${r.repeats}</span>` : "") +
          (r.grade ? `<span class="g ${cls}">${esc(r.grade)}</span>` : "") + `</div>`;
      }).join("");
    };

    const noteOf = t => {
      /* climbs.md hands back an array of note lines; a day logged from the
         phone hands back one string. Both arrive here. */
      const raw = t.notes;
      return Array.isArray(raw) ? raw.filter(Boolean).join(" ") : (raw || "");
    };

    const head = recent[0];
    const media = ClimbMedia.feature(head.date);
    /* Phone clips are portrait. Cropped into a wide frame you got rock and sky
       and no climber, so the frame follows the media, not the reverse. */
    const figure = media
      ? `<figure>${media.kind === "video"
          ? `<video src="${esc(media.src)}" autoplay muted loop playsinline
                    aria-label="Clip from ${esc(fmt(head.date, true))}"></video>`
          : `<img src="${esc(media.src)}" alt="From ${esc(fmt(head.date, true))}">`}
         <figcaption>${esc(fmt(head.date))} &middot; ${esc(where(head) || "")}</figcaption></figure>`
      : "";
    const note = noteOf(head);

    const rest = recent.slice(1).map(t => {
      const n = noteOf(t);
      const shots = ClimbMedia.of(t.date).length;
      return `<article class="pastday">` +
        `<div class="when">${esc(fmt(t.date, true))}` +
          (shots ? ` · ${shots} clip${shots === 1 ? "" : "s"}` : "") + `</div>` +
        `<h4><a href="projects/climbing/index.html#trip-${esc(t.date)}">${esc(where(t) || "Out")}</a></h4>` +
        (t.people.length ? `<div class="with">${esc(t.people.join(", "))}</div>` : "") +
        `<div class="routes">${routesHTML(t, false)}</div>` +
        (n ? `<p class="pastnote">${esc(n)}</p>` : "") +
      `</article>`;
    }).join("");

    $("lastday").innerHTML =
      `<div class="day"><div>` +
        `<div class="when">${esc(fmt(head.date, true))}</div>` +
        `<h3>${esc(where(head) || "Out")}</h3>` +
        (head.people.length ? `<div class="with">${esc(head.people.join(", "))}</div>` : "") +
        `<div class="routes">${routesHTML(head, true)}</div>` +
        (note ? `<p style="margin-top:1.2rem">${esc(note)}</p>` : "") +
        `<p style="margin-top:1rem"><a href="projects/climbing/index.html#trip-${esc(head.date)}">` +
        `See this day in the log →</a></p>` +
      `</div>${figure}</div>` +
      (rest ? `<div class="pastdays">${rest}</div>` : "");
  }

  /* ── the photo band ───────────────────────────────────
     One true sentence about where he actually climbs, and a picture of it. */
  if (areas.length) {
    const [topArea, n] = areas[0];
    $("bandcap").textContent = `${n} of ${s.trips} days were at ${topArea}`;
    $("band").style.backgroundImage = "url('photos/climbing-01.jpg')";
    $("band").hidden = false;
  }

  /* The old guard asked only whether a stamp EXISTED — and the field held the
     string "build-data.py", which is perfectly truthy, so the footer printed
     " Updated ." for months. build-data.py writes a real timestamp now; this
     checks the value looks like a date before saying anything about it. */
  const built = String(DATA.generated || DATA.builtAt || "").slice(0, 10);
  if (/^\d{4}-\d{2}-\d{2}$/.test(built)) $("stamp").textContent = ` Updated ${fmt(built, true)}.`;
})();
</script>

<script>
/* ── signing in ───────────────────────────────────────
   Its own block, outside the async one above, because that one returns early
   when there is no data and the password box is not something to lose along
   with the day list. */
(() => {
  const bar = document.getElementById("ownerbar");

  function paintOwner() {
    if (Owner.on()) {
      bar.innerHTML = `<div class="signedin"><strong>Signed in.</strong>
        <span><a href="projects/climbing/add.html">Add</a> is in the bar now.</span>
        <button type="button" id="signout">sign out</button></div>`;
      bar.querySelector("#signout").onclick = () => Owner.signOut();
    } else {
      Owner.mountBox(bar, { title: "Password" });
    }
    /* The bar was written during parse, before any of this ran, so it has to be
       told. Without this the tab only turns up on the next page you open. */
    if (window.ClimbNav) ClimbNav.refresh();
  }

  /* /auth has to be posted at whichever origin actually answers, and only
     climb-host.js knows which — and only after it has asked once. */
  ClimbHost.resolved().then(h => { Owner.init({ host: h, onChange: paintOwner }); paintOwner(); });
})();
</script>

</body>
</html>
