<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing — Ric's Terminal</title>
  <meta name="description" content="Ric's climbing ledger — days out, projects, and the tick list.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ric's Terminal">
  <meta property="og:title" content="Climbing — Ric's Terminal">
  <meta property="og:description" content="Ric's climbing ledger — days out, projects, and the tick list.">
  <meta property="og:url" content="https://ricmassey.com/climbing.html">
  <meta property="og:image" content="https://ricmassey.com/assets/og-terminal.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://ricmassey.com/climbing.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a5a40'/><text y='.85em' font-size='68' x='16'>🧗</text></svg>">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/climbing-nav.css">
  <link rel="stylesheet" href="assets/climbing.css">
</head>
<body>

<script src="assets/climbing-nav.js" data-nav="home"></script>

<!-- The headline sits ON the photo rather than after it: the old page spent a
     whole phone screen on a picture and then started the page underneath it. -->
<header class="hero" id="hero">
  <div class="wrap">
    <div class="kicker" id="kicker"></div>
    <h1>Climbing</h1>
    <div class="tally" id="tally"></div>
  </div>
</header>

<div class="wrap">
  <!-- Hidden until it has an answer. An empty "next out" is worse than none. -->
  <div id="nextout"></div>

  <section>
    <div class="head">
      <h2>Last day out</h2>
      <a class="more" href="projects/climbing/index.html" id="alldays">All days &rarr;</a>
    </div>
    <div id="lastday"></div>
  </section>
</div>

<div class="band" id="band" hidden>
  <div class="cap"><strong id="bandcap"></strong></div>
</div>

<div class="wrap">
  <footer>
    Built from <code>climbs.md</code> — grades are opinions, memory is worse.
    <span id="stamp"></span>
  </footer>
</div>

<script src="projects/climbing/climbs-data.js"></script>
<script src="projects/climbing/climb-vocab.js?v=2"></script>
<script src="projects/climbing/climb-parse.js?v=2"></script>
<script src="projects/climbing/web-trips.js?v=2"></script>
<script src="projects/climbing/climb-media.js?v=2"></script>
<script>
(async () => {
  /* Both at once: one asks the log service what was climbed, the other what was
     filmed. In sequence the page waited for the sum of two round trips. */
  await Promise.all([
    WebTrips.merge(window.CLIMBING_DATA),
    ClimbMedia.load()
  ]);

  const DATA = window.CLIMBING_DATA;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  if (!DATA) return;

  /* ── grade bands ──
     The densest token on the page, and until now every grade was the same grey
     pill — so a 5.9 and a 5.14 looked identical in a list you scan by grade.
     Light to dark as it gets harder, which needs no key next to it. */
  function band(g) {
    if (!g) return "easy";
    let m = /^5\.(\d+)/.exec(g);
    if (m) {
      const n = +m[1];
      return n >= 14 ? "g14" : n >= 13 ? "g13" : n >= 12 ? "g12"
           : n >= 11 ? "g11" : n >= 10 ? "g10" : "easy";
    }
    m = /^[Vv](\d+)/.exec(g);
    if (m) {
      const n = +m[1];
      return n >= 8 ? "g13" : n >= 6 ? "g12" : n >= 4 ? "g11" : n >= 3 ? "g10" : "easy";
    }
    return "easy";
  }
  const grade = g => g ? `<span class="g ${band(g)}">${esc(g)}</span>` : "";

  const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmt(iso, long) {
    const [y, m, d] = String(iso).split("-").map(Number);
    if (!y) return esc(iso);
    return long ? `${d} ${MONTH[m - 1]} ${y}` : `${d} ${MONTH[m - 1]}`;
  }

  /* ── the hero ─────────────────────────────────────────
     Four numbers, one of them the lead. The old ledger put seven equal cells in
     one flex row: at 940px they crushed to about 130px each and "Cold Hard
     Bitch · Slam Dunk · HARDEST SEND" became a six-line paragraph beside a
     two-line "207 SENDS". Anything past four goes to the stats page. */
  const s = DATA.stats;
  const hardest = (DATA.index && DATA.index.hardest) || bestSend();
  function bestSend() {
    let best = null;
    DATA.trips.forEach(t => t.routes.forEach(r => {
      if (r.outcome !== "sent" || !r.grade || r.gradeKind === "boulder") return;
      if (!best || (r.gradeRank || 0) > best.rank) best = { g: r.grade, rank: r.gradeRank || 0 };
    }));
    return best ? best.g : null;
  }
  const todoOpen = (DATA.todo || []).filter(t => !t.done).length;
  $("tally").innerHTML = [
    [s.trips, "days out", true],
    [s.sends, "sends", false],
    [hardest || "—", "hardest", false],
    [todoOpen, "on the list", false],
  ].map(([n, l, lead]) =>
    `<div${lead ? ' class="lead"' : ""}><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");

  /* The crags he actually goes to, biggest first — not a hand-typed list that
     goes stale the first time he climbs somewhere new. */
  const areaCount = {};
  DATA.trips.forEach(t => { if (t.area) areaCount[t.area] = (areaCount[t.area] || 0) + 1; });
  const areas = Object.entries(areaCount).sort((a, b) => b[1] - a[1]);
  $("kicker").textContent = areas.slice(0, 4).map(a => a[0]).join(" · ");

  /* A hero photo that rotates is a hero photo you cannot art-direct. One shot,
     chosen, with the focal point on him. */
  $("hero").style.backgroundImage = "url('photos/climbing-05.jpg')";

  /* ── next day out ─────────────────────────────────────
     From the crag plan, and only when there is one. */
  try {
    const plan = await (await fetch("assets/crag-plan.json", { cache: "no-store" })).json();
    const next = (plan.days || []).map(d => d)
      .filter(d => d.date >= new Date().toISOString().slice(0, 10))
      .sort((a, b) => a.date.localeCompare(b.date))[0];
    if (next) {
      const days = Math.round(
        (new Date(next.date + "T12:00") - new Date(new Date().toDateString())) / 864e5);
      const when = days <= 0 ? "Today" : days === 1 ? "Tomorrow"
                 : days < 7 ? `In ${days} days` : fmt(next.date, true);
      $("nextout").innerHTML =
        `<div class="next"><span class="in">${esc(when)}</span>` +
        `<span class="where">${esc(next.venue || "Out")}</span>` +
        (next.title ? `<span class="what">${esc(next.title)}</span>` : "") +
        `<span class="when">${esc(fmt(next.date, true))}</span></div>`;
    }
  } catch (e) { /* No plan file, no card. The page is correct either way. */ }

  /* ── the last day out ─────────────────────────────────
     The media is HIS, off that day, from the log service — the page used to
     show a stock photo next to a day it had nothing to do with. */
  const latest = DATA.trips.find(t => t.date);
  if (latest) {
    $("alldays").textContent = `All ${s.trips} →`;

    const media = ClimbMedia.feature(latest.date);
    /* Phone clips are portrait. Cropped into a wide frame you got rock and sky
       and no climber, so the frame follows the media, not the other way round. */
    const figure = media
      ? `<figure>${media.kind === "video"
          ? `<video src="${esc(media.src)}" autoplay muted loop playsinline
                    aria-label="Clip from ${esc(fmt(latest.date, true))}"></video>`
          : `<img src="${esc(media.src)}" alt="From ${esc(fmt(latest.date, true))}">`}
         <figcaption>${esc(fmt(latest.date))} &middot; ${esc(latest.area || "")}</figcaption></figure>`
      : "";

    /* Guidebook lines: name left, leader dots, grade hard right. The outcome
       rides on the grade itself — filled sent, outline been on it — instead of
       a third word racing the other two to the right edge. */
    let wall = null;
    const rows = latest.routes.map(r => {
      const head = [r.region, r.wall].filter(Boolean).join(" · ");
      const bar = head && head !== wall ? (wall = head,
        `<div class="crag">${esc(head)}</div>`) : "";
      const cls = band(r.grade) + (r.outcome === "sent" ? "" : " try");
      return bar +
        `<div class="rt"><span class="nm">${r.star ? '<span class="fav">★</span> ' : ""}` +
        `${esc(r.name)}</span><span class="dot"></span>` +
        (r.repeats > 1 ? `<span class="meta">×${r.repeats}</span>` : "") +
        (r.grade ? `<span class="g ${cls}">${esc(r.grade)}</span>` : "") + `</div>`;
    }).join("");

    /* climbs.md hands back an array of note lines; a day logged from the phone
       hands back one string. Both arrive here, so both are handled. */
    const raw = latest.notes;
    const note = Array.isArray(raw) ? raw.filter(Boolean).join(" ") : (raw || "");
    $("lastday").innerHTML =
      `<div class="day"><div>` +
        `<div class="when">${esc(fmt(latest.date, true))}</div>` +
        `<h3>${esc(latest.area || "Out")}</h3>` +
        (latest.people.length ? `<div class="with">${esc(latest.people.join(", "))}</div>` : "") +
        `<div class="routes">${rows}</div>` +
        (note ? `<p style="margin-top:1.2rem">${esc(note)}</p>` : "") +
        `<p style="margin-top:1rem"><a href="projects/climbing/index.html#trip-${esc(latest.date)}">` +
        `See this day in the log →</a></p>` +
      `</div>${figure}</div>`;
  }

  /* ── the photo band ───────────────────────────────────
     One true sentence about where he actually climbs, and a picture of it. */
  if (areas.length) {
    const [topArea, n] = areas[0];
    $("bandcap").textContent = `${n} of ${s.trips} days were at ${topArea}`;
    $("band").style.backgroundImage = "url('photos/climbing-01.jpg')";
    $("band").hidden = false;
  }

  const stamp = DATA.generated || DATA.builtAt;
  if (stamp) $("stamp").textContent = ` Updated ${fmt(String(stamp).slice(0, 10), true)}.`;
})();
</script>

</body>
</html>
