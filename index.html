<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RIC//NET — Ric Massey's own internet</title>
  <!-- the front door: home since 2026-10-17, a portal since 2026-10-30 — the
       quick stats, the room people use most, today's game, tonight's film,
       and every room by subject, most used first (AGENTS.md, "The front
       door"). The terminal is terminal.html. -->
  <meta name="description" content="Ric Massey's own internet — games you can play, space you can explore, climbing, training, photos, and Orrin.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ric's Terminal">
  <meta property="og:title" content="RIC//NET — Ric Massey's own internet">
  <meta property="og:description" content="Games you can play, space you can explore, climbing, training, photos, and Orrin.">
  <meta property="og:url" content="https://ricmassey.com/">
  <meta property="og:image" content="https://ricmassey.com/assets/og-terminal.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ric's Terminal — amber text on a black CRT screen">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://ricmassey.com/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0c0e'/><polygon points='50,12 90,86 10,86' fill='none' stroke='%23eceef2' stroke-width='7'/><polygon points='50,50 63,76 37,76' fill='%237b3cff'/></svg>">
  <script>
    /* Night or day, chosen before first paint so the page never flashes the
       wrong one. A visitor's own pick wins; otherwise their OS decides. */
    document.documentElement.classList.add("js");
    try { const t = localStorage.getItem("frontdoor-theme"); if (t === "day" || t === "night") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    /* The front door is a feed of rooms, and every room is torn from its own
       paper: Counter-Strike's steel, the cinema's black and gold, the climbing
       log's cream, the darkroom's red, the terminal's amber. Each post tears
       at its foot onto the next one, and the rip in it shows that room
       working — drawn fresh on every visit, so no two visits look alike.
       Every colour that carries words clears 4.5:1 against what is behind it. */
    :root {
      --bg: #d5d7db;
      --bg-2: #eef0f2;
      --ink: #0c0d0f;
      --muted: #4a4e55;
      --field: rgba(255,255,255,.55);
      --hair: rgba(12,13,15,.14);
      --head: rgba(221,223,226,.78);
      --violet: #7b3cff;
      --magenta: #ff2d8a;
      --cyan: #00c2ff;
      /* never narrower than the notch: viewport-fit=cover (for the phone's
         bottom bar) lets the page run under it when the phone is sideways */
      --gutter: max(clamp(16px, 4.4vw, 64px), env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
      --post-pt: clamp(84px, 12vh, 140px); --post-pb: clamp(96px, 13vh, 150px);
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --narrow: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.2,.7,.2,1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="day"]) {
        --bg: #0a0b0d; --bg-2: #15161a; --ink: #eef0f3; --muted: #9a9fa8;
        --field: rgba(255,255,255,.05); --hair: rgba(255,255,255,.1); --head: rgba(10,11,13,.78); --ixmix: 62%;
        color-scheme: dark;
      }
    }
    :root[data-theme="night"] {
      --bg: #0a0b0d; --bg-2: #15161a; --ink: #eef0f3; --muted: #9a9fa8;
      --field: rgba(255,255,255,.05); --hair: rgba(255,255,255,.1); --head: rgba(10,11,13,.78); --ixmix: 62%;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); overflow-x: clip; }
    body { color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; background: var(--bg); }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    /* ─── top bar: the brand, the terminal, night/day ─── */
    .bar {
      position: sticky; top: 0; z-index: 100000; display: flex; align-items: center; gap: 14px;
      height: 64px; padding: 0 var(--gutter);
      background: var(--head); -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
      border-bottom: 1px solid var(--hair);
    }
    .brand { display: flex; align-items: center; gap: 10px; font: 600 13px var(--sans); letter-spacing: .24em; text-decoration: none; white-space: nowrap; margin-right: auto; }
    .brand svg { width: 18px; height: 18px; }
    .brand .o { fill: none; stroke: var(--ink); stroke-width: 1.5; }
    .mode { flex: none; width: 40px; height: 40px; border: 1px solid var(--hair); background: var(--field); cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .mode svg { width: 16px; height: 16px; }
    /* The terminal, in the bar: a little of the terminal's own screen — black
       glass, amber phosphor, scanlines — with a prompt you can type into and
       the TERMINAL key beside it. A command typed here runs in the terminal
       (terminal.html?run=…); a room's name goes straight to the room. */
    .term {
      flex: none; position: relative; display: flex; align-items: stretch; height: 42px;
      background: #0a0a0a; border: 1px solid #6b4d00; overflow: hidden;
      box-shadow: 0 0 22px rgba(255,176,0,.16), 0 0 40px rgba(255,176,0,.06) inset;
      font: 500 13px var(--mono); color: #ffb000;
    }
    .term::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
    .term .ps { display: flex; align-items: center; padding: 0 2px 0 12px; color: #b07d00; white-space: nowrap; }
    .term input {
      width: 230px; min-width: 0; padding: 0 10px 0 8px; border: 0; outline: 0; background: transparent;
      font: inherit; color: #ffb000; caret-color: #ffb000; text-shadow: 0 0 10px rgba(255,176,0,.45);
    }
    .term input::placeholder { color: #b07d00; opacity: 1; text-shadow: none; }
    .term:focus-within { border-color: #ffb000; box-shadow: 0 0 0 1px rgba(255,176,0,.35), 0 0 30px rgba(255,176,0,.28), 0 0 40px rgba(255,176,0,.06) inset; }
    /* what a command answers, under the bar, on the same black glass */
    .term-out {
      position: absolute; top: calc(100% + 8px); right: var(--gutter); z-index: 2;
      width: min(560px, calc(100vw - 2 * var(--gutter))); max-height: min(55vh, 460px); overflow: auto;
      padding: 14px 40px 14px 16px; border: 1px solid #6b4d00; color: #e6a200;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px), #0a0a0a;
      box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 30px rgba(255,176,0,.12);
      font: 500 13px/1.6 var(--mono); overflow-wrap: anywhere;
    }
    #term-lines { white-space: pre-wrap; }
    .term-out[hidden] { display: none; }
    .term-out .cmd { color: #ffb000; text-shadow: 0 0 10px rgba(255,176,0,.45); margin-top: 10px; }
    .term-out .cmd:first-child { margin-top: 0; }
    .term-out .cmd::before { content: "~$ "; color: #b07d00; text-shadow: none; }
    .term-x { position: absolute; top: 6px; right: 8px; width: 28px; height: 28px; border: 0; background: none; color: #b07d00; font: 400 20px/1 var(--mono); cursor: pointer; }
    .term-x:hover, .term-x:focus-visible { color: #ffb000; outline: none; }
    .tbtn {
      flex: none; position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 0 14px 0 16px;
      background: #0a0a0a; color: #ffb000; text-decoration: none; border-left: 1px solid #6b4d00;
      font: 700 12.5px var(--mono); letter-spacing: .34em; text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255,176,0,.6), 0 0 30px rgba(255,176,0,.2);
      transition: background-color .3s, color .3s;
    }
    .tbtn:hover, .tbtn:focus-visible { background: #ffb000; color: #0a0a0a; text-shadow: none; outline: none; }
    .tbtn .cur { display: block; width: 8px; height: 14px; background: currentColor; margin-left: -4px; animation: blink 1.1s steps(1) infinite; box-shadow: 0 0 10px rgba(255,176,0,.6); }
    /* the ending's key stands alone, framed like the bar's */
    .fin .tbtn { height: 50px; padding: 0 22px 0 24px; border: 1px solid #6b4d00; box-shadow: 0 0 22px rgba(255,176,0,.16); }
    @keyframes blink { 50% { opacity: 0; } }

    /* ─── the front door (mockup, 2026-10-30) ───
       One block, written fresh. Phones (≤760px) and desktops (≥1000px) are
       laid out separately on purpose — Ric: "optimized for phones and desktop
       separately, but still the same style" — and nothing here may look like
       a generated page: no pills with dots, glows, numbered headings, spaced
       capitals or hover lifts (Ric: "i dont want it to look like an ai built
       it"). The rooms bring the colour: their clips, drawings and papers. */

    /* clip, not hidden: hidden makes <body> a scroll box, and then nothing
       inside it — the bar, the desktop index — can stay put while you scroll */
    body { overflow-x: clip; }

    /* the top: the name, then the quick stats */
    .hero { position: relative; z-index: 2; background: var(--bg); padding: clamp(36px, 7vh, 84px) var(--gutter) clamp(26px, 4vh, 40px); }
    .hero-in { max-width: 1400px; margin: 0 auto; }
    h1 { font: 600 clamp(40px, 7vw, 112px)/.92 var(--display); letter-spacing: -.055em; }
    h1 .dot { font-style: normal; color: var(--magenta); }
    #latest[hidden], .latest-relay[hidden] { display: none; }

    /* the quick stats: a word, a value, its age; a link each */
    .glance { max-width: 1400px; margin: clamp(18px, 2.6vh, 28px) auto 0; display: flex; flex-wrap: wrap; gap: 6px 0; }
    .gl { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 48px; padding: 0 clamp(16px, 2vw, 28px); border-left: 1px solid var(--line); color: var(--ink); text-decoration: none; min-width: 0; }
    .gl:first-child { padding-left: 0; border-left: 0; }
    .gl-k { font: 400 13px var(--sans); color: var(--muted); }
    .gl-k b { font-weight: 600; color: var(--magenta); margin-left: 6px; }
    .gl-val { display: flex; align-items: baseline; gap: 7px; min-width: 0; white-space: nowrap; }
    .gl-big { font: 600 clamp(17px, 1.5vw, 20px)/1.25 var(--display); letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    .gl-line { font: 400 13px var(--sans); color: var(--muted); }
    .gl-src { display: none; }
    .gl:hover .gl-big, .gl:focus-visible .gl-big { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .res { display: inline-block; padding: 0 5px; border-radius: 3px; font: 700 11px/17px var(--mono); vertical-align: 2px; color: #fff; }
    .res.W { background: #1f8f4e; } .res.L { background: #b42d2d; } .res.T { background: #6b6f78; }

    /* right now: modules, each a piece of its own room */
    .portal { max-width: 1400px; margin: 0 auto; padding: 0 var(--gutter); display: grid; gap: 10px; }
    .mod { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; border-radius: 4px; padding: 16px 18px 14px;
      background: var(--paper, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
    .mod::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--pattern, none); }
    .mod > * { position: relative; }
    .mod-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font: 600 14px var(--sans); }
    .mod-h a { margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; margin-block: -12px; color: var(--muted); text-decoration: none; font-weight: 500; }
    .mod-h a:hover { color: var(--ink); text-decoration: underline; }
    .mod-b { flex: 1; min-width: 0; }
    .src { margin-top: 12px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); font-size: 12px; color: var(--muted); }
    .k { font: 500 12px var(--sans); color: var(--muted); margin-bottom: 4px; }
    .mid { font: 600 19px/1.2 var(--display); letter-spacing: -.02em; }
    .row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 14px; color: var(--muted); }
    .row b { color: var(--ink); font-weight: 600; }
    .said { margin-top: 2px; font: italic 15px/1.45 var(--serif); }
    .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #2fdc86; margin-right: 8px; vertical-align: middle; }

    /* a room running: Weather, Play, Explore */
    .m-run-room { padding: 0; min-height: 280px; color: #fff; }
    .m-run-room canvas, .m-run-room video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .over { position: absolute !important; inset: auto 0 0 0; padding: 56px 18px 12px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.78)); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 18px; }
    .nm2 { font-family: var(--hf); font-weight: var(--hw); font-style: var(--hstyle); text-transform: var(--htt); letter-spacing: var(--hls); font-size: clamp(28px, 3vw, 40px); line-height: 1; color: var(--ink); }
    .what2 { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,.88); }
    .what2 b { font-weight: 600; color: #fff; }
    .go2s { display: flex; gap: 22px; }
    .go2 { display: inline-flex; align-items: center; min-height: 44px; color: #fff; font: 600 15px var(--sans); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
    .go2:hover { text-decoration-thickness: 2px; }

    /* tonight: the cinema's black and gold, its bulbs along the top */
    .mod.m-tv { --pattern: radial-gradient(circle, rgba(245,197,24,.75) 1.6px, transparent 2.6px) 6px 4px / 18px 12px repeat-x; padding-top: 24px; }
    .m-tv .mod-h { font: 800 15px var(--narrow); letter-spacing: .12em; text-transform: uppercase; color: #f5c518; }
    .m-tv .mod-h a { font: 600 13px var(--sans); letter-spacing: 0; text-transform: none; color: #c9b98a; }
    .tv { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: start; color: inherit; text-decoration: none; }
    .tv img { width: 88px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px; display: block; }
    .m-tv .mid { font: 800 22px/1 var(--narrow); text-transform: uppercase; color: #f5c518; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 3px; border: 1px solid rgba(245,197,24,.35); font-size: 12px; color: #fff8e6; }

    /* the crag day, when fresh: the climbing log's cream and serif */
    .m-crag .mod-h { font: italic 400 17px var(--serif); }
    .m-crag .mid { font: 400 21px/1.2 var(--serif); }
    .m-crag .k { color: #3c7a3b; }
    /* Orrin, while running: black, mono, a live green */
    .m-orrin .mod-h { font: 500 13px var(--mono); letter-spacing: .06em; color: #38ff9c; }
    .m-orrin .mid { font: 500 16px var(--mono); color: #38ff9c; }

    /* every room */
    .dir-h { max-width: 1400px; margin: clamp(46px, 7vh, 80px) auto 0; padding: 0 var(--gutter); }
    .dir-h h2 { font: 600 clamp(28px, 3vw, 42px)/1 var(--display); letter-spacing: -.04em; }
    .dir-h h2 .dot { font-style: normal; color: var(--magenta); }
    #feed { max-width: 1400px; margin: 0 auto; padding: 0 var(--gutter) 30px; --page-ink: var(--ink); --page-muted: var(--muted); }
    .shelf { padding-top: clamp(36px, 5vh, 56px); scroll-margin-top: 70px; }
    .shelf-head h3 { font: 650 clamp(20px, 1.9vw, 26px)/1.1 var(--display); letter-spacing: -.025em; margin-bottom: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); grid-auto-flow: dense; gap: 12px; }
    .card { position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; background: var(--paper); color: var(--ink); text-decoration: none;
      border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
    .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--pattern, none); }
    .card .media, .card .txt { position: relative; z-index: 1; }
    .card .media { aspect-ratio: 16 / 10; overflow: hidden; background: var(--paper); }
    .card .media video, .card .media canvas, .card .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .txt { display: flex; flex-direction: column; gap: 2px; padding: 12px 15px 14px; }
    .card .nm { font-family: var(--hf); font-weight: var(--hw); font-style: var(--hstyle); text-transform: var(--htt); letter-spacing: var(--hls); font-size: 17px; line-height: 1.15; }
    .card .what { font-size: 13px; color: var(--muted); }
    .card:hover, .card:focus-visible { border-color: color-mix(in srgb, var(--ink) 40%, transparent); outline: 0; }
    .card:hover .nm, .card:focus-visible .nm { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .card.big { grid-column: span 2; grid-row: span 2; }
    .card.big .media { aspect-ratio: auto; flex: 1; min-height: 220px; }
    .card.big .nm { font-size: 22px; }

    /* the end */
    .fin { max-width: 1400px; margin: clamp(40px, 6vh, 70px) auto 0; padding: 0 var(--gutter) clamp(50px, 8vh, 80px); text-align: center; }
    .fin h2 { font: 600 clamp(24px, 2.6vw, 36px)/1 var(--display); letter-spacing: -.04em; }
    .fin h2 .dot { font-style: normal; color: var(--magenta); }
    .fin .lede { margin: 12px auto 18px; font-size: 15px; color: var(--muted); }
    .fin-b { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 28px; }
    .fin-top { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); font: 500 14px var(--sans); text-underline-offset: 4px; }
    .tabbar { display: none; }

    /* ── desktop ── (research pass, 2026-10-30) NN/g: on a big screen keep
       the navigation visible, on the left, in words, most important first;
       people scan by headings and look top-left; a sticky bar stays solid.
       So: the rooms down the left from the very top, staying put, the page to
       their right; the name beside the stats; a grid with no holes. */
    .side { display: none; }
    @media (min-width: 1000px) {
      .bar { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: var(--bg) !important; }
      main { display: grid; grid-template-columns: 210px minmax(0, 1fr); column-gap: clamp(28px, 3vw, 48px); max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }
      main > * { grid-column: 2; }
      main > .side { grid-column: 1; grid-row: 1 / span 30; }
      .side { display: block; position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 64px); overflow-y: auto; padding: clamp(36px, 7vh, 84px) 6px 30px 0; scrollbar-width: thin; }
      .side .sh { font: 600 13px var(--sans); color: var(--muted); margin: 18px 0 4px; }
      .side .sh:first-child { margin-top: 0; }
      .side .sh a { color: inherit; text-decoration: none; }
      .side .sh.on a { color: var(--ink); }
      .side ul { list-style: none; }
      .side li a { display: block; padding: 3px 0; color: var(--ink); text-decoration: none; font: 400 14.5px/1.35 var(--sans); }
      .side li a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
      .side .home { display: block; margin-bottom: 4px; font: 600 15px var(--sans); color: var(--ink); text-decoration: none; }

      .hero, .portal, .dir-h, #feed, .fin { max-width: none; margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
      /* the stats' last line sits on the name's last line; the name's tight
         leading lets its letters hang below its box, so the script measures
         that and drops the stats to match (--drop) */
      .hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: end; column-gap: clamp(28px, 3vw, 56px); }
      .hero > .hero-in, .hero > .glance { max-width: none; margin: 0; }
      .glance { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 0; transform: translateY(var(--drop, 0px)); }
      .glance > .gl:nth-child(2n+1) { padding-left: 0; border-left: 0; }
      .portal { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-flow: dense; }
      .portal > .m-wxf { grid-column: span 4; min-height: 330px; }
      .rail { display: contents; }
      .rail > .m-tv { grid-column: span 2; }
      .rail > .m-play, .rail > .m-explore { grid-column: span 3; min-height: 300px; }
      .rail > .m-crag, .rail > .m-orrin { grid-column: span 3; }
      .dir-h { margin-top: clamp(46px, 7vh, 80px); }
    }
    /* a big monitor gets the width: about 1,700px of page and another card a row */
    @media (min-width: 1700px) {
      main { max-width: 1720px; }
    }
    /* ── between ── */
    @media (min-width: 761px) and (max-width: 999px) {
      .portal { grid-template-columns: 1fr 1fr; }

  <script>
    /* ─── trial alerts ─────────────────────────────────────
       The studies this browser's site account tracks from Psyche → Studies,
       checked against ClinicalTrials.gov on every visit. Without an account
       session in this browser nothing loads and nothing is fetched; with one,
       supabase-js comes in, the account is checked for Studies, and it costs
       one read of the list and one cached search. */
    (() => {
      const T = window.Trials;
      const el = document.getElementById("trial-alert");
      if (!T || !el || !T.hasSession()) return;
      T.checkWatch().then((r) => {
        if (!r || !r.alerts.length) return;
        const a = r.alerts;
        const span = (cls, text) => { const s = document.createElement("span"); s.className = cls; s.textContent = text; return s; };
        const title = document.createElement("strong");
        title.className = "latest-title";
        /* Registry titles run to thirty words; the alert says which study and
           what moved, and the Studies page has the rest. */
        const clip = (s, n) => (s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s);
        title.textContent = a.length === 1 ? clip(a[0].title.replace(/:.*$/, "") || a[0].title, 64) : `${a.length} tracked studies changed`;
        const desc = a.slice(0, 3).map((x) => `${x.id} — ${x.changes.map((c) => c.text).join(", ")}`).join(" · ");
        el.replaceChildren(
          span("latest-kicker", "TRIAL ALERT // " + (a.some((x) => x.changes.some((c) => c.kind === "results")) ? "results posted" : "status changed")),
          title,
          span("latest-description", desc + (a.length > 3 ? ` · and ${a.length - 3} more` : "")),
          span("latest-meta", "open →"),
        );
        el.setAttribute("aria-label", `Trial alert: ${title.textContent}`);
        el.hidden = false;
      }).catch(() => {});
    })();
  </script>

      const NIGHT = '<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M14.8 11.6A6.3 6.3 0 0 1 6.4 3.2a6.3 6.3 0 1 0 8.4 8.4Z" fill="currentColor"/></svg>';
      const isNight = () => root.dataset.theme ? root.dataset.theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches;

      // Orrin: a web of nodes in clusters, signals running between them and

      // Captures: a photograph developing in the tray under the safelight,

      // How Speed Affects Time, the real optics: each star is moved by

      // Spacetime: a Minkowski diagram — the light cone fixed at 45°, a

      // Siege Conductor: two timelines — the series in blue, the film in red —

      // The terminal itself, answering: real commands, typed.

          ["$ whoami", "guest — but if you're reading this,", "you're probably family. hi."],
          ["$ coffee", "brewing... ☕ dispensed. carry on."],

      // The Leviathan: a hull drawn the way the plan view draws it — bulkheads,
      // compartments and gun decks — built along a scan line, then built again
      // differently, the way "another" does on the page.
      leviathan(x, w, h, t, st) {

          const r = rng((st.seed ??= Math.floor(st.r() * 1e9)) + k * 7919), n = 9 + Math.floor(r() * 5);

        for (let gy = 0; gy < h; gy += 24) { x.beginPath(); x.moveTo(0, gy + 0.5); x.lineTo(w, gy + 0.5); x.stroke(); }

      },

      // Time Dilation: two clocks, one at rest and one moving, ticking apart.
      clocks(x, w, h, t) {
        x.fillStyle = "#101012"; x.fillRect(0, 0, w, h);
        const R = Math.min(h * 0.32, w * 0.2), y = h * 0.5, beta = 0.8, g = 1 / Math.sqrt(1 - beta * beta);

      // The Loss of Now: a flash in the middle of a moving car reaches both

      // Space Expanding: a field of galaxies all running from each other,

      expand(x, w, h, t, st) {

      // Climbing Media: the climbing photographs as a grid, one tile at a time

      // Climbing Stats: the hardest send of each year, bars growing up out of

        x.fillStyle = "#f4f0e6"; x.fillRect(0, 0, w, h);

        if (!st.years) {

      // Training Calendar: a month of the plan filling in, day by day, each
      // session ticking off as it lands.
      calendar(x, w, h, t, st) {
        const KINDS = [["#fc4c02", 0.34], ["#3a7bd5", 0.22], ["#7b52c7", 0.16], ["#2f9e6b", 0.12]];
        st.days ||= Array.from({ length: 35 }, () => { const r = st.r(); let a = 0; for (const [c, p] of KINDS) { a += p; if (r < a) return c; } return null; });

      // Trips & Races: a made-up course profile drawn out to the finish, the
      // distance counting up as the runner climbs it.

        st.prof ||= smooth1(st.r, 0.18); st.dist ||= pick(st.r, [3.1, 13.1, 26.2]);

      // The Movie List: the whole catalogue as a wall, sorting itself — every
      // few seconds the posters trade places, the way a filter rearranges them.
      shelf(x, w, h, t, st) {
        const pw = Math.max(58, Math.min(96, w / 9)), ph = pw * 1.5, gap = 6;
        const cols = Math.ceil(w / (pw + gap)) + 1, rows = Math.ceil(h / (ph + gap)) + 1, N = cols * rows;
        if (!st.list || st.list.length !== N) { st.list = Array.from({ length: N }, () => `assets/posters/${pick(st.r, POSTERS)}.jpg`); st.from = st.list.map((_, i) => i); st.to = st.from.slice(); }

      // The Log: transmissions, as a signal on a scope — quiet, then a burst
      // every time something goes out.
      signal(x, w, h, t, st) {
        st.n ||= smooth1(st.r, 0.05);

        x.strokeStyle = "rgba(211,123,255,.08)"; x.lineWidth = 1;

        for (let gy = (h / 2) % 40; gy < h; gy += 40) { x.beginPath(); x.moveTo(0, gy); x.lineTo(w, gy); x.stroke(); }

      },

      // The Shape of the Criteria: the two domains as rows on a four-point
      // scale, each marker settling on an answer and moving on.
      criteria(x, w, h, t, st) {
        st.rows ||= Array.from({ length: 7 }, () => ({ p: smooth1(st.r, 2.2) }));
        x.fillStyle = "#f4efe6"; x.fillRect(0, 0, w, h);
        const m = w * 0.1, gap = (h * 0.72) / st.rows.length, oy = h * 0.14 + gap / 2;

          x.strokeStyle = "rgba(28,26,23,.2)"; x.beginPath(); x.moveTo(m, y); x.lineTo(w - m, y); x.stroke();

        });
      },

      // The Arcade: all four games playing at once, each in its own window —
      // the Arcade's own clips, paused again when the post goes to sleep.
      arcade(x, w, h, t, st) {
        if (!st.vids) {
          st.vids = ["offramp", "kondrite", "starfield", "farlight"].sort(() => st.r() - 0.5).map((g) => {
            const v = document.createElement("video"); v.muted = true; v.loop = true; v.playsInline = true; v.preload = "auto";
            v.poster = `assets/games/${g}.jpg`; v.src = `assets/games/${g}.mp4`; return v;
          });

        }
        x.fillStyle = "#000"; x.fillRect(0, 0, w, h);
        const wide = w / h > 2.2, cols = wide ? 4 : 2, rows = wide ? 1 : 2, g = 6;
        const tw = (w - g * (cols + 1)) / cols, th = (h - g * (rows + 1)) / rows;

          if (v.paused && !STILL && v.src) v.play().catch(() => {});
          const px = g + (i % cols) * (tw + g), py = g + Math.floor(i / cols) * (th + g);
          const src = v.readyState >= 2 ? v : img(v.poster);

          if (src) { const sw = src.videoWidth || src.naturalWidth, sh = src.videoHeight || src.naturalHeight, k = Math.max(tw / sw, th / sh); x.drawImage(src, (tw - sw * k) / 2, (th - sh * k) / 2, sw * k, sh * k); }
          x.restore();
        });
      },

      // Exploration: the deck's star chart — orbits around a small sun, each
      // module a body going round on its own clock.
      orbits(x, w, h, t, st) {
        st.b ||= Array.from({ length: 6 }, (_, i) => ({ r: 0.16 + i * 0.13, s: 0.6 / (1 + i * 0.7), a: st.r() * 7, z: 2 + st.r() * 4 }));
        st.stars ||= Array.from({ length: 160 }, () => [st.r(), st.r(), st.r()]);
        x.fillStyle = "#0a0716"; x.fillRect(0, 0, w, h);
        for (const [a, b, c] of st.stars) { x.fillStyle = `rgba(239,234,255,${0.15 + c * 0.5 * (0.6 + 0.4 * Math.sin(t * 2 + c * 30))})`; x.fillRect(a * w, b * h, 1.2, 1.2); }

        x.fillStyle = "#ffd8a8"; x.shadowColor = "#ffb86b"; x.shadowBlur = 30; x.beginPath(); x.arc(cx, cy, 9, 0, 7); x.fill(); x.shadowBlur = 0;
        for (const o of st.b) { const a = o.a + t * o.s; x.fillStyle = "#c9b8ff"; x.shadowColor = "#9d7bff"; x.shadowBlur = 12; x.beginPath(); x.arc(cx + Math.cos(a) * o.r * R, cy + Math.sin(a) * o.r * R * 0.42, o.z, 0, 7); x.fill(); }
        x.shadowBlur = 0;
      },

      // Psyche: an ink blot, mirrored down the fold, slowly changing shape —
      // what do you see? Worked out on a small grid and drawn up smooth.
      inkblot(x, w, h, t, st) {
        st.n ||= noise2(st.r);
        const S = 4, cw = Math.ceil(w / 2 / S), ch = Math.ceil(h / S), tt = t * 0.12;
        const c = (st.c ||= document.createElement("canvas")); if (c.width !== cw * 2 || c.height !== ch) { c.width = cw * 2; c.height = ch; st.d = null; }

          const a = Math.max(0, Math.min(1, (val - 0.2) * 14)) * 255;

      },
    };

    // ─── the feed ────────────────────────────────────────
    // Rooms are laid down as posts, one after another, each once, and then the
    // feed ends. Everything heavy in a post — its torn edges, its
    // video, its drawing — is let go once the post is far off screen and made
    // again when it comes back, so a long scroll costs no more than a short one.
    // Every tear and every drawing is seeded fresh on each visit.
    const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const phone = () => innerWidth <= 860;
    const rng = (seed) => { let s = (seed >>> 0) % 2147483647 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
    const VISIT = (crypto.getRandomValues ? crypto.getRandomValues(new Uint32Array(1))[0] : Date.now()) >>> 0;
    const seedFor = (n) => (VISIT ^ Math.imul(n + 1, 2654435761)) >>> 0;
    const poly = (pts) => `polygon(${pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(", ")})`;

    // ── noise ──
    const smooth = (r, span) => {
      const v = Array.from({ length: Math.ceil(9800 / span) + 4 }, () => r() * 2 - 1);
      return (x) => { const f = (x + 400) / span, i = Math.floor(f), t = f - i, u = t * t * (3 - 2 * t); return v[i] + (v[i + 1] - v[i]) * u; };
    };

    // ── the drawn media: one loop for every drawing on screen ──
    const live = new Set();
    let last = performance.now();
    (function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      for (const c of live) {
        const w = c.clientWidth, h = c.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
        if (!w || !h || !c.seen) continue;
        if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
        const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.st.dt = STILL ? 0 : dt; c.st.time = (c.st.time || 0) + (STILL ? 0 : dt);
        try { ART[c.dataset.art](x, w, h, STILL ? 3 : c.st.time, c.st); } catch (e) { /* a drawing that fails leaves its paper */ }
      }
      requestAnimationFrame(frame);
    })(last);
    window.FD = { ART, live, rng, seedFor, POSTS };

    // ── the shelves ──
    // Nine subjects in a fixed order, the rooms on each in a fixed order, so
    // a thing is always where it was last time.
    // In the order people use them — measured from the visitor counter over
    // the 90 days to 2026-10-29, Ric's own devices left out: Weather Pro 21
    // people, Weather 17, Counter-Strike 13, the terminal 11, Training 8 (with
    // its calendar 7), Climbing, the boards, KONDRITE and Entertainment 7
    // each, everything else 4 or fewer. Re-measure before reordering by feel.
    // What people open next from the front door is the test of this page.
    // Baseline, the old feed, 90 days to 2026-10-29: left without opening
    // anything 29, reloaded 23, Weather 14, the terminal 9, CS 5, Training 3.
    // Rerun from worker/ to compare:
    //   npx wrangler d1 execute visitors --remote --command "WITH v AS (SELECT session, path, ts,
    //   LEAD(path) OVER (PARTITION BY session ORDER BY ts) AS nxt FROM views WHERE visitor NOT IN
    //   (SELECT visitor FROM ignored) AND ts > (strftime('%s','now') - 90*86400) * 1000)
    //   SELECT COALESCE(nxt,'(left)') AS next, COUNT(*) n FROM v WHERE path IN ('/','/index.html')
    //   GROUP BY next ORDER BY n DESC"
    const SHELVES = [
      ["weather", "Weather", ["weather", "weather-pro"]],
      ["games", "Games", ["cs", "kondrite", "arcade", "interstate", "starfield", "farlight", "apex"]],
      ["training", "Training", ["training", "calendar", "races"]],
      ["climbing", "Climbing", ["climbing", "boards", "stats", "gallery"]],
      ["films", "Films & TV", ["entertainment", "siege", "library"]],
      ["built", "Things I built", ["terminal", "orrin", "atlas"]],
      ["space", "Space", ["exploration", "scale", "speed", "spacetime", "dilation", "simultaneity", "expansion", "leviathan"]],
      ["mind", "Mind", ["psyche", "mind", "criteria", "studies"]],
      ["photos", "Photos", ["captures"]],
    ];
    const feed = document.getElementById("feed");
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const byId = Object.fromEntries(POSTS.map((p) => [p.id, p]));
    byId["weather-pro"] = { id: "weather-pro", skin: "wx", name: "Weather Pro", what: "radar, satellite, models", href: "weather-pro.html",
      media: { art: "radar" }, alt: "Made-up rain cells in radar colours over an invented map" };
    // ── most used first, always (Ric, 2026-10-30) ──
    // The Worker's /popular is the order pages were used in over the last 30
    // days (people, not views; Ric's own devices left out). The page sorts by
    // the order it saved on the last visit, so nothing moves while you look,
    // and fetches a fresh one for next time. Never fetched yet (a first visit)
    // or the service down: the order in SHELVES, as measured on 2026-10-29.
    const POPULAR_URL = "https://training-log.rmbuster82.workers.dev/popular";
    let POP = null;
    try { const c = JSON.parse(localStorage.getItem("fd:popular") || "null"); if (c && Array.isArray(c.order)) POP = c.order; } catch (e) {}
    fetch(POPULAR_URL, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((d) => {
      if (d && Array.isArray(d.order)) try { localStorage.setItem("fd:popular", JSON.stringify({ order: d.order, at: Date.now() })); } catch (e) {}
    }).catch(() => {});
    const pageOf = (href) => ("/" + href).replace(/\/index\.html$/, "").replace(/\.html$/, "").replace(/\/$/, "");
    const rankOf = (p) => { const i = POP ? POP.indexOf(pageOf(p.href)) : -1; return i < 0 ? Infinity : i; };
    if (POP) {
      // rooms within a shelf, then shelves by their best room; ties keep the measured order
      SHELVES.forEach((sh) => { const o = sh[2].slice(); sh[2].sort((a, b) => (rankOf(byId[a]) - rankOf(byId[b])) || (o.indexOf(a) - o.indexOf(b))); });
      const o = SHELVES.slice();
      SHELVES.sort((a, b) => (rankOf(byId[a[2][0]]) - rankOf(byId[b[2][0]])) || (o.indexOf(a) - o.indexOf(b)));
    }
    // every room, most used first — the feature and the phone's bar read this
    const RANKED = SHELVES.flatMap(([sid, , ids]) => ids.map((id) => ({ id, sid }))).sort((a, b) => POP ? (rankOf(byId[a.id]) - rankOf(byId[b.id])) : 0);
    window.FD.TOP = RANKED[0]?.id; window.FD.byId = byId;
    const PHONE = matchMedia("(max-width: 760px)").matches, HOVER = matchMedia("(hover: hover) and (min-width: 1000px)").matches;
    // small stills for the drawings that otherwise pull full-size photographs or several clips
    const THUMB = { captures: "assets/frontdoor/thumbs/captures.jpg", climbing: "assets/frontdoor/thumbs/climbing.jpg", gallery: "assets/frontdoor/thumbs/gallery.jpg", arcade: "assets/games/kondrite.jpg",
      entertainment: "assets/frontdoor/thumbs/films.jpg", library: "assets/frontdoor/thumbs/films.jpg" };
    let n = 0;
    feed.innerHTML = SHELVES.map(([id, title, ids], si) => `<section class="shelf" data-band="${id}" id="g-${id}" aria-labelledby="h-${id}"><div class="shelf-head"><h3 id="h-${id}">${esc(title)}</h3></div><div class="cards">${
      ids.map((k) => byId[k]).map((p, i) => {
        // On a phone the list's thumbnails are 88px: a still, never a clip or
        // a drawing that pulls 1600px photographs (web.dev: nothing off the
        // first screen may weigh it down)
        if (PHONE && (p.media.video || THUMB[p.id])) return `<a class="card" data-skin="${p.skin}" href="${p.href}"><div class="media"><img src="${p.media.video ? p.media.video + ".jpg" : THUMB[p.id]}" alt="" loading="lazy" decoding="async"></div><div class="txt"><span class="nm">${esc(p.name)}</span><span class="what">${esc(p.what)}</span></div></a>`;
        const media = p.media.video
          ? `<video muted loop playsinline preload="none" poster="${p.media.video}.jpg" data-src="${p.media.video}.mp4" aria-hidden="true"></video>`
          : `<canvas data-art="${p.media.art}" data-n="${n++}" aria-hidden="true"></canvas>`;
        return `<a class="card${i ? "" : " big"}" data-skin="${p.skin}" href="${p.href}"><div class="media" role="img" aria-label="${esc(p.alt)}">${media}</div><div class="txt"><span class="nm">${esc(p.name)}</span><span class="what">${esc(p.what)}</span></div></a>`;
      }).join("")}</div></section>`).join("");
    // the phone's bar is the four most used rooms, then the terminal; the
    // markup's five are what a page without scripts shows
    {
      const ICON = { weather: '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.2 3.5 3.5 0 0 0 7 18z"/>',
        games: '<circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>', training: '<path d="M3 17l5-6 4 4 4-7 5 9"/>',
        climbing: '<path d="M3 20l6-11 4 6 3-4 5 9z"/>', films: '<rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 9h18M8 5v4M16 5v4"/>',
        space: '<circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="3.5"/>', mind: '<path d="M12 4a6 6 0 0 0-6 6c0 3 2 4 2 7h8c0-3 2-4 2-7a6 6 0 0 0-6-6zM9 20h6"/>',
        built: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>', photos: '<rect x="3" y="6" width="18" height="13" rx="1"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>' };
      const SHORT = { cs: "CS", entertainment: "Films", "weather-pro": "Pro", "how-big": "Scale" };
      ICON.pro = '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6.4-6.4"/>';
      const top = RANKED.filter((r) => r.id !== "terminal").slice(0, 4);
      const bar = document.querySelector(".tabbar"), tt = bar.querySelector(".tt");
      bar.querySelectorAll("a").forEach((a) => a.remove());
      top.forEach(({ id, sid }) => { const p = byId[id]; tt.insertAdjacentHTML("beforebegin", `<a href="${p.href}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[id === "weather-pro" ? "pro" : sid]}</svg>${esc(SHORT[id] || p.name)}</a>`); });
    }
    // the terminal's tab: up above the bar, ready to type; again to put it away
    {
      const tt = document.getElementById("tt"), run = document.getElementById("run");
      tt.addEventListener("click", () => {
        const up = document.body.classList.toggle("term-up");
        tt.setAttribute("aria-expanded", String(up));
        if (up) run.focus(); else { run.blur(); document.getElementById("term-out").hidden = true; }
      });
    }
    // desktop's room index, down the left from the top
    {
      const side = document.getElementById("side");
      side.innerHTML = `<a class="home" href="terminal.html">Terminal</a>` + SHELVES.map(([id, title, ids]) =>
        `<p class="sh" data-to="g-${id}"><a href="#g-${id}">${esc(title)}</a></p><ul>${ids.map((k) => byId[k]).map((p) => `<li><a href="${p.href}">${esc(p.name)}</a></li>`).join("")}</ul>`).join("");
      // line the stats' last line up with the name's last line: measure both
      // with no correction, then drop the stats by the difference
      const lift = () => {
        const g = document.getElementById("glance"), h = document.querySelector("h1");
        g.style.setProperty("--drop", "0px");
        if (!matchMedia("(min-width: 1000px)").matches || !g.querySelector(".gl-big")) return;
        const textBottom = (el) => { const r = document.createRange(); r.selectNodeContents(el); const a = [...r.getClientRects()]; return a[a.length - 1].bottom; };
        // the name may still be sliding up into place (.rv): measure where it will rest
        const still = new DOMMatrixReadOnly(getComputedStyle(h).transform).m42;
        g.style.setProperty("--drop", `${Math.round(textBottom(h) - still - textBottom([...g.querySelectorAll(".gl-big")].pop()))}px`);
      };
      // the stats are laid down by the portal's script further down the page
      addEventListener("DOMContentLoaded", lift); addEventListener("resize", lift); document.fonts?.ready.then(lift);
      side.addEventListener("click", (e) => { const h = e.target.closest(".sh"); if (!h) return; e.preventDefault(); document.getElementById(h.dataset.to).scrollIntoView({ behavior: STILL ? "auto" : "smooth" }); });
      const on = new IntersectionObserver((list) => list.forEach((x) => { if (x.isIntersecting) side.querySelectorAll(".sh").forEach((h) => h.classList.toggle("on", h.dataset.to === x.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });
      feed.querySelectorAll(".shelf").forEach((sh) => on.observe(sh));
    }

    document.querySelector(".fin-top")?.addEventListener("click", (e) => { e.preventDefault(); scrollTo({ top: 0, behavior: STILL ? "auto" : "smooth" }); });

    // A card's clip loads as it comes near and plays only while it's in view;
    // a drawing runs only while it's in view.
    const near = new IntersectionObserver((list) => list.forEach(({ target: c, isIntersecting: on }) => {
      if (c.tagName === "VIDEO") { if (on && !c.getAttribute("src") && !held(c)) { c.preload = "auto"; c.src = c.dataset.src; } return; }
      if (on) { c.st ||= { r: rng(seedFor(+c.dataset.n)) }; live.add(c); } else { live.delete(c); c.st?.vids?.forEach((v) => v.pause()); }
    }), { rootMargin: "100% 0px" });
    // On a desktop, five clips decoding at once was the old feed's lag; there
    // a small card's clip, and the Arcade's four, play only under the pointer.
    const held = (c) => HOVER && !c.closest(".card.big") && (c.tagName === "VIDEO" || c.dataset.art === "arcade");
    const seen = new IntersectionObserver((list) => list.forEach(({ target: c, isIntersecting: on }) => {
      c.inview = on;
      if (held(c)) { if (!on) c.tagName === "VIDEO" ? c.pause() : (c.seen = false); return; }
      if (c.tagName === "VIDEO") { on && !STILL ? c.play().catch(() => {}) : c.pause(); } else c.seen = on;
    }));
    // the pointer has to settle on a card for 0.3s before its clip starts
    // (NN/g: 0.3–0.5s), so sweeping across the grid starts nothing
    let wait = 0;
    feed.addEventListener("pointerover", (e) => { const card = e.target.closest(".card"), c = card?.querySelector(".media > video, .media > canvas"); if (!c || !held(c) || STILL || card.contains(e.relatedTarget)) return;
      clearTimeout(wait); wait = setTimeout(() => {
        if (c.tagName === "VIDEO") { if (!c.getAttribute("src")) c.src = c.dataset.src; c.play().catch(() => {}); } else { c.st ||= { r: rng(seedFor(+c.dataset.n)) }; live.add(c); c.seen = true; } }, 300); });
    feed.addEventListener("pointerout", (e) => { const card = e.target.closest(".card"); if (!card || card.contains(e.relatedTarget)) return; clearTimeout(wait); const c = card.querySelector(".media > video, .media > canvas"); if (!c || !held(c)) return;
      if (c.tagName === "VIDEO") c.pause(); else c.seen = false; });
    feed.querySelectorAll(".media > video, .media > canvas").forEach((c) => { near.observe(c); seen.observe(c); });

    // ─── the terminal ───────────────────────────────────
    // The prompt in the bar runs terminal commands right here: the terminal
    // sits in a hidden frame (terminal.html?embed=1), loaded the first time the
    // prompt is touched, and answers in the panel under the bar. Whatever a
    // command does — going to a room, waking Mochi, a trip mode — happens on
    // this page; the frame only thinks. A post's name goes straight to its
    // page, `home` comes back to the top, Enter on nothing opens the terminal,
    // and / from anywhere puts you at the prompt. Without the frame (it fails
    // to load, or no JS) the command goes to the terminal as ?run=.
    {
      const form = document.getElementById("term"), input = document.getElementById("run");
      const panel = document.getElementById("term-out"), lines = document.getElementById("term-lines");
      const key = (t) => t.toLowerCase().replace(/^\/+/, "").replace(/^(open|cd)\s+/, "").replace(/[^a-z0-9]+/g, "");
      let frame = null, ready = false, waiting = [];
      const wake = () => {
        if (frame) return;
        frame = document.createElement("iframe");
        frame.src = "terminal.html?embed=1"; frame.title = "terminal"; frame.tabIndex = -1;
        frame.setAttribute("aria-hidden", "true");
        frame.style.cssText = "position:fixed;width:1px;height:1px;left:-9999px;top:0;border:0;visibility:hidden";
        document.body.appendChild(frame);
      };
      const send = (cmd) => frame.contentWindow.postMessage({ term: "run", cmd, cats: !!window.RELAY_CATS?.active?.(), effect: window.RELAY_EFFECTS?.current?.() || null }, location.origin);
      const show = (list, cleared) => {
        if (cleared) lines.textContent = "";
        for (const l of list) { const d = document.createElement("div"); if (l.bright) { d.className = "cmd"; d.textContent = l.text.replace(/^\$\s*/, ""); } else d.textContent = l.text; lines.appendChild(d); }
        panel.hidden = !lines.childElementCount;
        panel.scrollTop = panel.scrollHeight;
      };
      addEventListener("message", (e) => {
        if (!frame || e.source !== frame.contentWindow || e.origin !== location.origin || !e.data) return;
        const m = e.data;
        if (m.term === "ready") { ready = true; waiting.splice(0).forEach(send); }
        else if (m.term === "out") show(m.lines || [], m.cleared);
        else if (m.term === "go") {
          const to = new URL(m.href, location.href);
          if (to.origin !== location.origin) return;
          if (/\/(index\.html)?$/.test(to.pathname)) { panel.hidden = true; scrollTo({ top: 0, behavior: STILL ? "auto" : "smooth" }); }
          else location.href = to.href;
        }
        else if (m.term === "back") history.back();
        else if (m.term === "cats") m.on ? window.RELAY_CATS?.enable() : window.RELAY_CATS?.clear();
        else if (m.term === "effect") m.mode ? window.RELAY_EFFECTS?.set(m.mode) : window.RELAY_EFFECTS?.clear();
      });
      for (const ev of ["focus", "pointerenter", "touchstart"]) input.addEventListener(ev, wake, { passive: true });
      const past = []; let back = 0;
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const typed = input.value.trim().slice(0, 200);
        if (!typed) { location.href = "terminal.html"; return; }
        input.value = ""; past.push(typed); back = past.length;
        if (/^(front[\s_-]*door|home|cd home|open home)$/i.test(typed)) { panel.hidden = true; scrollTo({ top: 0, behavior: STILL ? "auto" : "smooth" }); return; }
        const k = key(typed), post = POSTS.find((p) => key(p.name) === k || key(p.id) === k);
        if (post) { location.href = post.href; return; }
        wake();
        if (ready) send(typed);
        else {
          waiting.push(typed);
          // a frame that never answers must not swallow the command
          setTimeout(() => { if (!ready && waiting.includes(typed)) location.href = `terminal.html?run=${encodeURIComponent(typed)}`; }, 5000);
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { panel.hidden = true; return; }
        if ((e.key === "ArrowUp" || e.key === "ArrowDown") && past.length) {
          e.preventDefault();
          back = e.key === "ArrowUp" ? Math.max(0, back - 1) : Math.min(past.length, back + 1);
          input.value = past[back] ?? "";
        }
      });
      document.getElementById("term-x").addEventListener("click", () => { panel.hidden = true; input.focus(); });
      addEventListener("pointerdown", (e) => { if (!panel.hidden && !panel.contains(e.target) && !form.contains(e.target)) panel.hidden = true; });
      addEventListener("keydown", (e) => {
        const el = document.activeElement;
        if (e.key === "Escape") panel.hidden = true;
        if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
        if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
        e.preventDefault();
        // at phone width the prompt waits behind the bar's Terminal tab
        const tt = document.getElementById("tt");
        if (getComputedStyle(form).display === "none" && tt) tt.click(); else input.focus();
      });
    }

  <script src="projects/cs/cs-data.js"></script>
  <script>
    // ─── the portal's modules ───
    // For whoever is visiting first: their sky, something to play, something
    // to watch, something to explore, what's new. Ric's own activity joins
    // only while it is fresh — a page that says "right now" can't lead with
    // July. Every module is dressed as its room, and says where its numbers
    // came from and how old they are.
    (() => {
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const age = (t) => (Date.now() - new Date(t).getTime()) / 864e5;
      const ago = (t) => {
        const s = (Date.now() - new Date(t).getTime()) / 1000;
        if (!isFinite(s)) return "";
        if (s < 90) return "just now";
        const m = s / 60, h = m / 60, d = h / 24;
        return m < 60 ? `${Math.round(m)} min ago` : h < 36 ? `${Math.round(h)} h ago` : d < 45 ? `${Math.round(d)} days ago` : `${Math.round(d / 30)} months ago`;
      };
      const short = (t) => { const d = (Date.now() - new Date(t).getTime()) / 864e5; if (!isFinite(d)) return "";
        return d < 1 / 24 ? "now" : d < 1 ? `${Math.round(d * 24)}h` : d < 45 ? `${Math.round(d)}d` : `${Math.round(d / 30)}mo`; };
      const day = (iso) => new Date(iso + (iso.length === 10 ? "T12:00:00" : "")).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      const n = (v) => Number(v).toLocaleString();
      const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const today = new Date(), DAY = Math.floor(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) / 864e5);
      const FD = window.FD, byId = Object.fromEntries(FD.POSTS.map((p) => [p.id, p]));
      const portal = $("portal");
      let into = portal;

      // A module: its room's paper, a heading in the room's way, a body, a source line.
      function mod(cls, skin, head, link, body = "", src = "") {
        const a = document.createElement("article");
        a.className = `mod ${cls}`; if (skin) a.dataset.skin = skin;
        a.innerHTML = `${head != null ? `<div class="mod-h"><h2 style="font:inherit">${head}</h2>${link ? `<a href="${link[0]}">${esc(link[1])} ↗</a>` : ""}</div>` : ""}<div class="mod-b">${body}</div>${src != null ? `<p class="src">${src}</p>` : ""}`;
        into.appendChild(a); return a;
      }
      const feeds = new Map();
      function feed(name, up) { feeds.set(name, up); if (!$("feeds")) return; $("feeds").innerHTML = [...feeds].map(([k, v]) => `<span class="${v ? "up" : "down"}">${esc(k)}</span>`).join(""); }
      const clock = () => { const d = new Date();
        $("clock").innerHTML = `${esc(d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }))} · <b>${esc(d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }))}</b> your time`; };
      if ($("clock")) { clock(); setInterval(clock, 15000); }

      // a room running, with one button: the clip if it has one, else its live drawing
      function running(cls, p, kicker, verb) {
        const a = mod(`${cls} m-run-room`, p.skin, null, null, "", null);
        // nothing loads or runs until it is on screen: on a phone the rail's
        // second and third modules sit off to the side until swiped to
        const media = p.media.video
          ? `<video muted loop playsinline preload="none" poster="${p.media.video}.jpg" data-src="${p.media.video}.mp4" aria-hidden="true"></video>`
          : `<canvas data-art="${p.media.art}" aria-hidden="true"></canvas>`;
        a.innerHTML = `${media}<div class="over"><div><h2 class="nm2">${esc(p.name)}</h2><p class="what2">${esc(p.what)}</p></div><a class="go2" href="${p.href}">${esc(verb)} →</a></div>`;
        const c = a.querySelector("canvas"), v = a.querySelector("video");
        if (c) { c.st = { r: FD.rng(FD.seedFor(900 + DAY)) }; FD.live.add(c); }
        inView.observe(a);
      }
      const inView = new IntersectionObserver((list) => list.forEach(({ target: a, isIntersecting: on }) => {
        const c = a.querySelector("canvas"), v = a.querySelector("video");
        if (c) c.seen = on;
        if (v) { if (on && !v.getAttribute("src")) { v.src = v.dataset.src; } on && !STILL ? v.play().catch(() => {}) : v.pause(); }
      }), { threshold: 0.35 });

      // ── at a glance: four tiles, each one big number and one line ──
      const G = $("glance");
      function gl(cls, skin, href, label) {
        const a = document.createElement("a");
        a.className = `gl ${cls}`; a.href = href; if (skin) a.dataset.skin = skin;
        a.innerHTML = `<span class="gl-k">${esc(label)}</span><span class="gl-val"><span class="gl-big">…</span><span class="gl-line"></span></span><span class="gl-src"></span>`;
        G.appendChild(a);
        return (big, line, src) => { a.querySelector(".gl-big").innerHTML = big; a.querySelector(".gl-line").innerHTML = line; a.querySelector(".gl-src").textContent = src; };
      }
      const setRun = gl("gl-run", null, "training.html", "Last run");
      const setClimb = gl("gl-climb", null, "climbing.html", "Last climb");
      const setCs = gl("gl-cs", null, "cs.html", "Last CS game");
      const setNew = gl("gl-new", null, "terminal.html", "Newest");
      // A run or a day at the crag counts as an update (Ric, 2026-10-29: "if
      // strava or climbing get updated that counts as an update"). Whichever of
      // them and the site's newest addition happened last says "new" by its
      // label, so a run is never listed twice; the Newest slot itself is the
      // newest thing added to the site.
      const news = [];
      function offer(at, cls) {
        news.push({ at: new Date(at).getTime(), cls });
        G.querySelectorAll(".gl-k b").forEach((b) => b.remove());
        const x = news.sort((a, b) => b.at - a.at)[0];
        G.querySelector(`.${x.cls} .gl-k`).insertAdjacentHTML("beforeend", "<b>new</b>");
      }

      // the last run: numbers only — the route stays on the training page
      fetch("https://training-log.rmbuster82.workers.dev/strava", { cache: "no-store" }).then((r) => (r.ok ? r.json() : Promise.reject())).then((d) => {
        const r = Object.values(d.days || {}).flat().filter((a) => /Run/.test(a.sport_type || a.type)).sort((a, b) => b.start_date_local.localeCompare(a.start_date_local))[0];
        if (!r) { setRun("—", "No runs yet", "Strava"); return; }
        const mi = r.distance / 1609.344, pace = r.moving_time / 60 / mi;
        setRun(`${mi.toFixed(1)} mi`, short(r.at || r.start_date_local), "");
        offer(r.at || r.start_date_local, "gl-run");
        feed("Strava", true);
      }).catch(() => { setRun("—", "no answer", ""); feed("Strava", false); });

      // the last CS game: Valve's own record of it
      {
        const m = (window.CS_DATA?.matches || []).slice().sort((a, b) => b.at.localeCompare(a.at))[0];
        if (!m) setCs("—", "No matches yet", "Valve");
        else {
          const map = m.map.replace(/^de_|^cs_/, "").replace(/^./, (c) => c.toUpperCase());
          setCs(`${m.score[0]}–${m.score[1]} <span class="res ${m.result}">${m.result}</span>`, `${esc(map)} · ${short(m.at)}`, "");
        }
      }

      // the last day climbing outside: the newest of the committed log
      // (latest-climb.js stops at the last build) and the days logged from a
      // phone at the crag, which only the log service has. A day at "Home" is
      // a board session at the house, not outside.
      (async () => {
        const days = [];
        const c = window.RELAY_LATEST_CLIMB;
        if (c) days.push({ date: c.date, name: c.title.split(" — ").pop(), href: c.href || "climbing.html" });
        try {
          const r = await (window.ClimbHost ? ClimbHost.fetch("/climb", { cache: "no-store" }) : fetch("https://training-log.rmbuster82.workers.dev/climb", { cache: "no-store" }));
          if (r.ok) for (const d of Object.values((await r.json()).days || {})) {
            if (/^home$/i.test((d.area || "").trim()) || !(d.routes || []).length) continue;
            const sent = d.routes.find((x) => x.outcome === "sent") || d.routes[0];
            days.push({ date: d.date, name: (d.area || "").trim() || sent.name, href: `projects/climbing/index.html#trip-${d.date}` });
          }
        } catch (e) { /* the committed log stands on its own */ }
        const x = days.sort((a, b) => b.date.localeCompare(a.date))[0];
        if (!x) { setClimb("—", "", ""); return; }
        setClimb(esc(x.name), short(x.date + "T12:00:00"), "");
        G.querySelector(".gl-climb").href = x.href;
        offer(x.date + "T12:00:00", "gl-climb");
      })();
      // the newest thing added to the site
      {
        const x = (window.RELAY_LATEST || [])[0];
        if (x) { setNew(esc(x.title), short(x.date + "T12:00:00"), ""); G.querySelector(".gl-new").href = x.href; offer(x.date + "T12:00:00", "gl-new"); }
        else setNew("—", "", "");
      }

      // ── the most used room first ── whatever /popular puts on top. Weather
      // (on top today) gets its own version: the sky where you are, and Pro.
      const TOP = FD.TOP || "weather";
      if (!/^weather/.test(TOP)) {
        const p = FD.byId[TOP];
        running("m-wxf", p, "", "Open");
      } else {
        const a = mod("m-run-room m-wxf", "wx", null, null, "", null);
        a.innerHTML = `<canvas data-art="radar" aria-hidden="true"></canvas><div class="over"><div><h2 class="nm2">Weather</h2><p class="what2" id="wx-now">the sky where you are · radar · ten days</p></div>
          <div class="go2s"><a class="go2" href="weather.html">Open →</a><a class="go2" href="weather-pro.html">Pro →</a></div></div>`;
        const c = a.querySelector("canvas"); c.st = { r: FD.rng(FD.seedFor(7 + DAY)) }; c.seen = true; FD.live.add(c); inView.observe(a);
        // the sky right now, for the place chosen on the Weather page — never a default
        (async () => {
          let place = null, units = "us";
          try { place = JSON.parse(localStorage.getItem("wx:place")); units = JSON.parse(localStorage.getItem("wx:units")) === "metric" ? "metric" : "us"; } catch (e) {}
          if (!(place && isFinite(+place.lat) && isFinite(+place.lon))) return;
          const r2 = (v) => Math.round(+v * 100) / 100;
          const toUnit = (c) => Math.round(units === "metric" ? c : c * 9 / 5 + 32);
          const W = { 0: "clear", 1: "mostly clear", 2: "partly cloudy", 3: "overcast", 45: "fog", 48: "fog", 51: "drizzle", 53: "drizzle", 55: "drizzle", 61: "rain", 63: "rain", 65: "heavy rain", 71: "snow", 73: "snow", 75: "heavy snow", 80: "showers", 81: "showers", 82: "heavy showers", 95: "thunderstorms", 96: "thunderstorms", 99: "thunderstorms" };
          try {
            // the Weather room's own request, so the two share the Worker's cache;
            // °C from the source, converted here. Asked of Open-Meteo directly if the Worker fails.
            const q = `lat=${r2(place.lat)}&lon=${r2(place.lon)}`;
            let res = await fetch(`https://training-log.rmbuster82.workers.dev/wx/om?${q}`).catch(() => null);
            if (!res || !res.ok) res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${r2(place.lat)}&longitude=${r2(place.lon)}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&past_days=3&timezone=auto&timeformat=unixtime`);
            if (!res.ok) throw 0;
            const d = await res.json(), cur = d.current;
            // today in the daily arrays (the Worker's answer starts three days back):
            // each day is its local midnight in unix seconds, so find the one we're in
            const off = d.utc_offset_seconds || 0, midnight = Math.floor((Date.now() / 1000 + off) / 86400) * 86400 - off;
            const today = Math.max(0, (d.daily.time || []).indexOf(midnight));
            $("wx-now").innerHTML = `<b>${toUnit(cur.temperature_2m)}°</b> ${esc(W[cur.weather_code] || "")} in ${esc(place.name)} · high ${toUnit(d.daily.temperature_2m_max[today])}° low ${toUnit(d.daily.temperature_2m_min[today])}°`;
          } catch (e) { /* the line keeps saying what the room is */ }
        })();
      }

      // everything after Weather sits in the rail
      const rail = document.createElement("div"); rail.className = "rail"; rail.setAttribute("aria-label", "More right now"); portal.appendChild(rail); into = rail;

      // ── play now: one of the games, a different one each day ──
      // never the room that already has the big feature
      const GAMES = ["kondrite", "interstate", "starfield", "farlight"].filter((g) => g !== TOP);
      running("m-play", byId[GAMES[DAY % GAMES.length]], "Play", "Play");

      // ── tonight's pick: one title from the watchlist, the same one all day ──
      // The list is the Entertainment room's whole file (95 KB compressed), so
      // it is fetched once the page is up; the module holds its place till then.
      {
        const slot = mod("m-tv", "cinema", "Tonight", ["entertainment.html", "More"], "", null);
        const fill = () => {
        const L = (window.ENTERTAINMENT_DATA || []).filter((t) => t.status === "watchlist" && t.poster);
        if (!L.length) { slot.remove(); return; }
        {
          const t = L[DAY % L.length];
          slot.querySelector(".mod-b").innerHTML = (
            `<a class="tv" href="entertainment.html" style="color:inherit;text-decoration:none"><img src="assets/posters/${esc(t.id)}.jpg" alt="${esc(t.title)} poster" loading="lazy">
            <div><div class="mid">${esc(t.title)}</div><div class="row" style="margin-top:4px"><span>${t.year || ""}</span>${t.runtime ? `<span>${Math.floor(t.runtime / 60)}h ${t.runtime % 60}m</span>` : ""}${t.rating ? `<span>★ <b>${t.rating}</b></span>` : ""}</div>
            <div class="tags">${(t.streams || []).slice(0, 3).map((x) => `<span class="tag">${esc(x)}</span>`).join("") || `<span class="tag">Not streaming</span>`}</div></div></a>`);
        }
        };
        const s = document.createElement("script"); s.src = "projects/entertainment/entertainment-data.js"; s.async = true;
        s.onload = fill; s.onerror = () => slot.remove(); document.head.appendChild(s);
      }

      // ── explore: something to wander through, a different one each day ──
      const EXPLORE = ["scale", "speed", "spacetime", "dilation", "simultaneity", "expansion"].filter((g) => g !== TOP);
      running("m-explore", byId[EXPLORE[(DAY + 2) % EXPLORE.length]], "Explore", "Go");

      // ── Ric, lately: each only while it's fresh ──
      {
        const c = window.RELAY_LATEST_CLIMB;
        if (c && age(c.date + "T12:00:00") <= 21)
          mod("m-crag", "logbook", "At the crag", ["climbing.html", "the log"],
            `<p class="k">${esc(day(c.date))} · ${esc(c.kind)}</p><div class="mid">${esc(c.title)}</div><div class="row"><span>${esc(c.description)}</span></div>`, "from the climbing log");
        fetch("https://orrin-status.rmbuster82.workers.dev/status", { headers: { accept: "application/json" } }).then((r) => (r.ok ? r.json() : Promise.reject())).then((d) => {
          feed("Orrin", true);
          const run = d.run; if (!d.live || !run) return;
          mod("m-orrin", "orrin", "Orrin", ["orrin.html", "Watch"],
            `<div class="mid"><span class="live-dot on"></span>Running</div><div class="row"><span>${run.startedAt ? `up since ${esc(ago(run.startedAt))}` : ""}</span>${run.cyclesTotal ? `<span><b>${n(run.cyclesTotal)}</b> cycles</span>` : ""}</div>
            ${run.goal ? `<p class="k" style="margin-top:14px">Working on</p><p class="said">${esc(run.goal.replace(/^Answer:\s*/, ""))}</p>` : ""}`, "the status service · live");
        }).catch(() => feed("Orrin", false));
      }
    })();
  </script>
</body>
</html>
