  <meta property="og:title" content="Training — Ric's Terminal">
  <meta property="og:description" content="Ric's training feed — runs, workouts, and health telemetry.">
  <meta property="og:url" content="https://ricmassey.com/training.html">

<body>

<!-- The terminal bar and the section's four tabs, built once in one place.
     The room nav that used to sit here is gone: this page is a room now, with
     pages of its own, and the way back up is the "all rooms" link the bar
     carries — the same shape the climbing room settled on. -->
<script src="assets/training-nav.js" data-nav="home"></script>

  <div class="wrap">
    <div class="athlete">
      <div class="avatar">🏃</div>
      <div class="who">
        <h1 class="name">Ric Massey</h1>
        <div class="sub">Runner · climber · perpetually in Zone 4</div>
      </div>
    </div>

    <!-- The three tiles show what the plan actually knows. Elevation and moving
         time used to sit here and could only ever render a dash, because
         nothing upstream produces them — a permanent dash is just a broken
         promise with better manners. -->
    <div class="week">
      <h2>This Week</h2>
      <div class="stats">
        <div class="stat"><div class="n" id="w-target">— <small>mi</small></div><div class="l">Running target</div></div>
        <div class="stat"><div class="n" id="w-done">—</div><div class="l">Sessions done</div></div>
        <div class="stat"><div class="n" id="w-dist">— <small>mi</small></div><div class="l">Current mileage</div></div>
      </div>
      <p class="week-note" id="w-note">Loading the plan…</p>
    </div>

    <!-- What you last actually did, with the workout itself open — the run off
         the watch, or the climbs you logged, and a way through to the place
         that holds the detail. Today's card used to sit here, but today is on
         the calendar with every other day and that is where it gets ticked;
         the thing the home page can say that no other page does is how the
         last one went. -->
    <div class="section-label">Last workout</div>
    <div id="last"></div>

    <!-- Far enough ahead to pack a bag for, not so far it becomes the calendar
         again. The calendar tab is one tap away and does that job properly. -->
    <div class="section-label">Coming up</div>
    <div id="soon"></div>

    <!-- Owner controls. Hidden for everyone, including Ric, until a token is
         stored — and storing one buys nothing on its own, because the Worker is
         what checks it. Someone who sets this by hand gets a row of checkboxes
         that return 401 and change nothing. -->
    <div class="owner" id="ownerbar" hidden>
      <strong>Owner mode.</strong> <span id="ownerstate">checking…</span>
      <button type="button" class="ownerbtn" id="signout">sign out</button>
    </div>

    <footer>
      Ric's personal training log · powered by stubbornness<br>
      <span class="foot-dim">The plan is generated; ticks and notes are live.</span>
    </footer>
  </div>

  <script src="assets/owner.js"></script>
  <script src="projects/climbing/climb-host.js?v=1"></script>
  <script src="projects/climbing/climb-media.js?v=4"></script>
  <script src="assets/training-core.js?v=1"></script>
  <script>
  /* TRAINING — home
     ──────────────────────────────────────────────────────────────────────────
     What this page answers, in the order it answers it: how is the week going,
     what block am I in and why, what is today, and what is coming. Everything
     it draws with comes from Training (assets/training-core.js); nothing about
     loading, ticking or saving lives here. */
  (function () {
    const $ = s => document.querySelector(s);
    const T = Training;

    /* The next few days with something on them worth knowing about.

       "Something" is doing work here. Every single day in the plan carries a
       morning practice, and a rest day carries one too — so a plain "has a
       session that is not a rest" test let Saturday through reading "Coming up:
       Morning practice", which is both true and useless. A day earns a row by
       having a session that is neither a rest nor the standing body practice;
       the same test the workout index uses, for the same reason. */
    const substantive = s => s.kind !== 'rest' && !(s.kind === 'body' && !s.key);

    function renderSoon(todayISO) {
      const rows = T.days()
        .filter(d => d.date > todayISO)
        .filter(d => d.sessions.some(substantive))
        .slice(0, 4)
        .map(d => {
          const real = d.sessions.filter(substantive);
          const main = real.find(s => s.key)
                    || real.find(s => s.kind === 'climb' || s.kind === 'run')
                    || real[0];
          const rest = real.length - 1;
          return `<a class="soonrow" href="projects/training/calendar.html#d-${T.esc(d.date)}">
            <span class="so-ico">${T.ICON[main.kind] || ''}</span>
            <span class="so-txt">
              <span class="so-t">${T.esc(main.title)}${main.key ? '<span class="keytag">key</span>' : ''}</span>
              <span class="so-m">${T.esc(T.pretty(d.date))}${main.meta ? ' · ' + T.esc(main.meta) : ''}${
                rest ? ` · +${rest} more` : ''}</span>
            </span>
            <span class="so-go">›</span></a>`;
        }).join('');
      $('#soon').innerHTML = rows || '<div class="loadfail">Nothing further in the plan.</div>';
    }

    /* ── the last workout ──
       Scanning back from today for the most recent day that carries evidence of
       real work, and then for the session on it that the evidence belongs to.

       The morning practice is excluded on purpose — it happens every day, and a
       home page reporting "your last workout was: stretching" would be true and
       worthless. Rest days are out for the same reason.

       Weighting rather than first-match, because a day can hold more than one
       candidate: a run that landed off the watch, or climbs logged at a crag,
       outrank a box someone ticked by hand, because they carry detail to show.
       A tick alone still counts — it is the only evidence a gym session or a
       lift ever produces. */
    function lastWorkout() {
      const today = T.todayISO();
      const past = T.days().filter(d => d.date <= today).reverse();
      for (const d of past) {
        const st = T.stateOf(d.date);
        const split = T.runSplit(d.date);
        const climbed = T.climbOn(d.date);
        const boards = T.boardOn(d.date);
        const found = d.sessions
          .filter(substantive)
          .map(sn => {
            const runs = split.bySession[sn.id] || [];
            const onRock = sn.kind === 'climb' && (climbed || boards.length);
            const weight = (runs.length ? 3 : 0) + (onRock ? 3 : 0) + (T.doneOf(st, sn) ? 1 : 0);
            return { d, s: sn, runs, climbed: onRock, weight };
          })
          .filter(x => x.weight > 0)
          .sort((a, b) => b.weight - a.weight);
        if (found.length) return found[0];
      }
      return null;
    }

    function renderLast() {
      const w = lastWorkout();
      if (!w) {
        $('#last').innerHTML =
          '<div class="loadfail">Nothing logged yet. Tick a session on the calendar, ' +
          'or go for a run and let the watch do it.</div>';
        return;
      }
      const { d, s, runs } = w;
      const when = d.date === T.todayISO() ? 'Today' : T.pretty(d.date);

      /* ── what happened, before what was asked for ──
         A session row puts the prescription first and folds the evidence in
         underneath, which is right when you are about to go and do it. This
         card is the other way round: it is here because the thing is DONE, so
         the run off the watch and the problems off the board lead, and the
         exercise list only appears when there is no evidence to lead with —
         a lift or a gym session leaves nothing behind but a tick, and for
         those the prescription is the only honest answer to "what did I do". */
      const board = T.boardOn(d.date).length ? T.boardBlock(d.date) : '';
      const crag = T.climbLink(d.date);
      const evidence = runs.map(T.runBlock).join('') + board + crag;

      /* Each kind of evidence has somewhere it came from, and the card is not
         much use if it dead-ends. The run carries its own Strava link inside
         its detail panel and a crag day carries its own link to the climbing
         log, so the only one missing a way out is the board night. */
      const out = board && !crag
        ? `<a class="lw-out" href="projects/climbing/board.html">See the boards →</a>` : '';

      /* Open, not a chevron you have to find. This is one card and the whole
         reason it is here is the detail inside it — the splits, the map, the
         problems — so hiding that behind a tap would leave the page saying
         only that a run happened. */
      $('#last').innerHTML = `<div class="lastw">
        <div class="lw-head">
          <span class="lw-ico">${T.ICON[s.kind] || ''}</span>
          <span class="lw-txt">
            <span class="lw-t">${T.esc(s.title)}</span>
            <span class="lw-m">${T.esc(when)} · ${T.esc(d.phase)}${
              s.meta ? ' · ' + T.esc(s.meta) : ''}</span>
          </span>
          <a class="lw-go" href="projects/training/calendar.html#d-${T.esc(d.date)}"
             aria-label="Open this day on the calendar">›</a>
        </div>
        <div class="lw-body">${evidence || T.exercisePanel(s)}${out}</div>
      </div>`;
      /* The run panel inside carries its own expanders. */
      T.wire($('#last'));
    }

    function render() {
      if (!T.ready()) return;
      const iso = T.todayISO();
      const d = T.dayOf(iso);
      T.mountOwnerBar();

      if (!d) {
        $('#w-note').textContent = "Outside the plan's 52 weeks.";
        renderLast();
        renderSoon(iso);
        return;
      }

      const wk = T.weeks()[d.week] || {};
      /* Target and actual as two separate tiles rather than one "6 of 10"
         reading: they are two different facts, and the one you want on a
         Thursday is the gap between them, which two numbers side by side show
         as well as a sentence does. */
      $('#w-target').innerHTML = `${wk.miles ?? '—'} <small>mi</small>`;
      $('#w-dist').innerHTML = `${T.miles(T.weekMetres(d.week))} <small>mi</small>`;
      /* Out of how many, because a bare "2" means nothing on its own — two of
         three is a good week and two of fourteen is not, and the tile was
         showing the same number for both. */
      let done = 0, total = 0;
      T.days().filter(x => x.week === d.week).forEach(x => {
        done += T.doneCountOf(T.stateOf(x.date), x.sessions);
        total += (x.sessions || []).length;
      });
      $('#w-done').innerHTML = total ? `${done} <small>of ${total}</small>` : (done || '—');
      /* Say it out loud when the ticks on screen came from the cache rather
         than from the log. Otherwise a signal drop is indistinguishable from
         somebody's work disappearing. */
      $('#w-note').textContent = T.stale()
        ? 'Offline — showing the last ticks this device saw. Nothing is lost.'
        : d.deload
          ? `${wk.phase || d.phase} · deload week, volume down by design.`
          : `${wk.phase || d.phase} · week ${d.week} of 52.`;

      renderLast();
      renderSoon(iso);
    }

    T.onChange(render);
    T.load();
  })();
  </script>
  <script src="effects.js"></script>
</body>
</html>
