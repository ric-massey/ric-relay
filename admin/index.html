<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <!-- Passwords are typed here. Its own scripts and the Supabase client only, and
       it talks only to Supabase — and, for the Analytics tab, the Worker that
       keeps the visitor numbers (worker/visitors.mjs). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321 https://training-log.rmbuster82.workers.dev; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Account admin for ricmassey.com.">
  <title>Admin</title>
  <style>
    /* Not a room: a tool. Plain, quiet, and readable at a glance — on purpose
       the one page on the site that does not dress up. */
    :root {
      color-scheme: light dark;
      --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --ink:#16181d; --dim:#5b6270; --faint:#8a919e;
      --accent:#2f5bea; --accent-ink:#fff; --hover:#f0f2f5;
      --ok:#137a3f; --ok-bg:#e6f4ec; --warn:#8a5a00; --warn-bg:#fdf1d8; --bad:#b42318; --bad-bg:#fdecea;
      --muted-bg:#eef0f3; --admin:#4338ca; --admin-bg:#eceafd;
      --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1115; --panel:#171a20; --line:#2a2f38; --ink:#e8eaee; --dim:#a3a9b5; --faint:#7b8290;
        --accent:#5b7cfa; --accent-ink:#fff; --hover:#1e222a;
        --ok:#5fd394; --ok-bg:#15291e; --warn:#f2c060; --warn-bg:#2d2412; --bad:#ff8a80; --bad-bg:#331a19;
        --muted-bg:#232831; --admin:#a5a0ff; --admin-bg:#24213f; --shadow:none;
      }
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    button, input, select, textarea { font:inherit; color:inherit; }
    [hidden] { display:none !important; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:0 14px;
           border:1px solid var(--line); border-radius:8px; background:var(--panel); cursor:pointer; font-weight:500; white-space:nowrap; }
    .btn:hover { background:var(--hover); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
    .btn.primary:hover { filter:brightness(1.08); }
    .btn.danger { color:var(--bad); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .link { background:none; border:0; padding:0; color:var(--dim); cursor:pointer; text-decoration:underline; }
    input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
      width:100%; min-height:38px; padding:8px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    textarea { min-height:180px; resize:vertical; line-height:1.5; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

    /* ── sign in ── */
    .gate { min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
    .card { width:min(100%, 380px); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:var(--shadow); }
    .card h1 { margin:0 0 4px; font-size:20px; }
    .card p { margin:0 0 20px; color:var(--dim); }
    .card label { display:block; margin:12px 0 6px; font-weight:500; font-size:13px; }
    .card .btn { width:100%; margin-top:18px; min-height:40px; }
    .error { color:var(--bad); min-height:20px; margin:10px 0 0; font-size:13px; }

    /* ── the app ── */
    header.top { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); }
    .bar { max-width:1080px; margin:0 auto; padding:0 16px; height:56px; display:flex; align-items:center; gap:16px; }
    .brand { font-weight:700; font-size:16px; }
    .tabs { display:flex; gap:4px; min-width:0; overflow-x:auto; scrollbar-width:none; }
    .tab { border:0; background:none; padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--dim); font-weight:500; }
    .tab[aria-selected="true"] { background:var(--hover); color:var(--ink); }
    .me { margin-left:auto; display:flex; align-items:center; gap:12px; color:var(--dim); font-size:13px; min-width:0; }
    .me span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    main { max-width:1080px; margin:0 auto; padding:20px 16px 80px; }
    .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .tools input[type=search] { flex:1 1 220px; }
    .tools select { width:auto; flex:0 0 auto; }
    .summary { color:var(--dim); font-size:13px; margin:0 0 10px; }
    .notice { background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:10px 12px; margin:0 0 12px; font-size:13px; }

    /* stat cards — they are also the filter */
    .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .stat { text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:12px 14px; cursor:pointer; box-shadow:var(--shadow); }
    .stat:hover { background:var(--hover); }
    .stat[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .stat b { display:block; font-size:22px; line-height:1.2; font-variant-numeric:tabular-nums; }
    .stat span { color:var(--dim); font-size:13px; }
    .stat.warn b { color:var(--warn); } .stat.bad b { color:var(--bad); }

    ul.list { list-style:none; margin:0; padding:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
    .row + .row, .list-head + .row { border-top:1px solid var(--line); }
    .list-head { display:flex; align-items:center; min-height:40px; color:var(--dim); font-size:12px; background:var(--hover); }
    .list-head span { padding-right:16px; }
    .line { display:flex; align-items:center; }
    .pick { display:flex; align-items:center; justify-content:center; width:44px; min-height:56px; cursor:pointer; flex:0 0 auto; }
    .list-head .pick { min-height:40px; }
    .pick input { width:16px; height:16px; accent-color:var(--accent); }
    .toggle { flex:1; min-width:0; display:grid; grid-template-columns:32px minmax(0,1fr) 100px minmax(0,170px) 80px 16px; align-items:center; gap:12px;
              border:0; background:none; text-align:left; padding:10px 16px 10px 0; min-height:56px; cursor:pointer; }
    .toggle:hover { background:var(--hover); }
    .row.active { background:color-mix(in srgb, var(--accent) 9%, transparent); box-shadow:inset 3px 0 0 var(--accent); }
    .row.picked { background:color-mix(in srgb, var(--accent) 5%, transparent); }
    .avatar { width:32px; height:32px; border-radius:50%; background:var(--muted-bg); display:grid; place-items:center; font-weight:600; color:var(--dim); flex:0 0 auto; }
    .avatar.big { width:44px; height:44px; font-size:18px; }
    .who { min-width:0; display:flex; flex-direction:column; }
    .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .email { color:var(--dim); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .side { color:var(--dim); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .seen { color:var(--faint); font-size:12px; text-align:right; }
    .chev::before { content:""; display:block; width:7px; height:7px; border-right:2px solid var(--faint); border-top:2px solid var(--faint); transform:rotate(45deg); }
    .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--muted-bg); color:var(--dim); white-space:nowrap; }
    .badge.admin { background:var(--admin-bg); color:var(--admin); }
    .badge.warn { background:var(--warn-bg); color:var(--warn); }
    .badge.bad { background:var(--bad-bg); color:var(--bad); }
    .empty { padding:40px 16px; text-align:center; color:var(--dim); }

    /* loading */
    .skel { display:flex; align-items:center; gap:12px; padding:14px 16px 14px 44px; }
    .skel + .skel { border-top:1px solid var(--line); }
    .skel i { display:block; height:10px; border-radius:6px; background:var(--muted-bg); }
    .skel i.dot { width:32px; height:32px; border-radius:50%; flex:0 0 auto; }
    .skel .lines { flex:1; display:grid; gap:7px; }
    .stat.skel-stat b { color:transparent; background:var(--muted-bg); border-radius:6px; width:40px; }
    @media (prefers-reduced-motion: no-preference) {
      .skel i { background:linear-gradient(90deg, var(--muted-bg) 0%, var(--hover) 50%, var(--muted-bg) 100%); background-size:200% 100%; animation:shimmer 1.2s linear infinite; }
      @keyframes shimmer { to { background-position:-200% 0; } }
      .btn[aria-busy="true"]::after { animation:spin .7s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
    }
    .btn[aria-busy="true"] { cursor:wait; opacity:.8; }
    .btn[aria-busy="true"]::after { content:""; width:12px; height:12px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; }

    /* the drawer: one person's details, beside the list */
    .scrim { position:fixed; inset:0; background:rgba(15,17,21,.35); z-index:9; }
    .drawer { position:fixed; top:0; right:0; bottom:0; width:min(460px, 100vw); background:var(--panel); border-left:1px solid var(--line);
              box-shadow:-12px 0 40px rgba(0,0,0,.12); z-index:10; display:flex; flex-direction:column; }
    .drawer header { display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
    .drawer header .who { flex:1; }
    .drawer header .name { font-size:16px; }
    .drawer .close { border:0; background:none; width:36px; height:36px; border-radius:8px; cursor:pointer; color:var(--dim); font-size:22px; line-height:1; }
    .drawer .close:hover { background:var(--hover); }
    .drawer-body { overflow:auto; padding:18px; display:grid; gap:22px; align-content:start; }
    .drawer-body section h4 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); }
    .checks { display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:10px; }
    .checks label { display:flex; align-items:center; gap:7px; min-height:32px; cursor:pointer; }
    .checks input { width:16px; height:16px; accent-color:var(--accent); }
    .fields { display:grid; gap:10px; margin-bottom:10px; }
    .fields label { display:grid; gap:5px; font-size:13px; color:var(--dim); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .hint { margin:0; color:var(--dim); }
    .dirty { font-size:12px; color:var(--warn); margin:0 0 8px; }
    .facts { display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; margin:0; }
    .facts div { min-width:0; }
    .facts dt { font-size:12px; color:var(--faint); }
    .facts dd { margin:2px 0 0; overflow-wrap:anywhere; white-space:pre-wrap; }
    /* Wide screens keep the list beside the drawer instead of under it. */
    @media (min-width:1100px) {
      body.drawer-open .scrim { display:none; }
      body.drawer-open main, body.drawer-open .bar { margin-left:max(0px, calc((100vw - 1080px - 476px) / 2)); margin-right:476px; }
      body.drawer-open .bulk { left:calc((100vw - 476px) / 2); }
    }

    /* bulk bar */
    .bulk { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:8; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
            background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 14px; box-shadow:0 10px 30px rgba(0,0,0,.18); max-width:calc(100vw - 32px); }
    .bulk b { margin-right:6px; }

    dialog { border:1px solid var(--line); border-radius:14px; padding:0; width:min(560px, calc(100vw - 32px)); background:var(--panel); color:var(--ink); box-shadow:0 20px 50px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(15,17,21,.45); }
    dialog form { padding:22px; display:grid; gap:12px; }
    dialog h2 { margin:0; font-size:17px; }
    dialog label { display:grid; gap:6px; font-size:13px; font-weight:500; }
    dialog .to { color:var(--dim); font-size:13px; overflow-wrap:anywhere; max-height:72px; overflow:auto; }
    dialog .foot { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }

    .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px;
             font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); max-width:calc(100vw - 32px); z-index:20; }
    .toast.bad { background:var(--bad); color:#fff; }


    /* ── analytics ── one hue for every bar; numbers wear ink, not the accent. */
    .an-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:14px; }
    .an-ranges { display:flex; flex-wrap:wrap; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px; }
    .an-range { border:0; background:none; padding:6px 11px; min-height:32px; border-radius:7px; cursor:pointer; color:var(--dim); font-weight:500; }
    .an-range[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
    .an-stamp { color:var(--dim); font-size:12px; margin-right:auto; }
    .an-kpis { grid-template-columns:repeat(4, minmax(0,1fr)); }
    .an-kpi { cursor:default; }
    .an-kpi:hover { background:var(--panel); }
    .an-kpi small { display:block; color:var(--dim); font-size:12px; margin-top:2px; }
    .an-panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); min-width:0; margin-bottom:12px; }
    .an-panel h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
    .an-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0 12px; }
    .an-grid .wide { grid-column:1 / -1; }
    .an-head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; }
    .an-legend { display:flex; gap:14px; color:var(--dim); font-size:12px; }
    .an-legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
    .an-legend .v, .an-col .v { background:color-mix(in srgb, var(--accent) 30%, var(--panel)); }
    .an-legend .u, .an-col .u { background:var(--accent); }
    .an-readout { margin:0 0 8px; color:var(--dim); font-size:13px; min-height:19px; }
    .an-chart { display:flex; align-items:flex-end; gap:2px; height:180px; border-bottom:1px solid var(--line); }
    .an-col { flex:1 1 0; min-width:0; height:100%; position:relative; cursor:default; }
    .an-col:hover, .an-col:focus-visible { background:var(--hover); }
    .an-col i { position:absolute; left:15%; right:15%; bottom:0; border-radius:4px 4px 0 0; }
    .an-axis { display:flex; justify-content:space-between; color:var(--faint); font-size:12px; margin-top:6px; }
    .an-t { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:6px; }
    .an-t th { text-align:left; font-weight:500; color:var(--faint); font-size:12px; padding:0 8px 6px 0; white-space:nowrap; }
    .an-t td { padding:5px 8px 5px 0; border-top:1px solid var(--line); vertical-align:middle; }
    .an-t .n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .an-t td.k { position:relative; width:100%; min-width:140px; }
    .an-t td.k span { position:relative; overflow-wrap:anywhere; }
    .an-t .fill { position:absolute; left:0; top:3px; bottom:3px; border-radius:4px; background:color-mix(in srgb, var(--accent) 14%, transparent); }
    .an-scroll { overflow-x:auto; }
    .an-pages td.k { min-width:180px; }
    .an-sort { border:0; background:none; padding:0; color:inherit; font:inherit; cursor:pointer; }
    .an-sort[aria-pressed="true"] { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
    .an-empty { color:var(--dim); margin:4px 0 8px; }
    .an-note { color:var(--dim); font-size:12px; margin:8px 0 0; }
    .an-arrow { color:var(--faint); margin:0 4px; }
    .an-heat { display:grid; grid-template-columns:34px repeat(24, minmax(0,1fr)); gap:2px; font-size:11px; color:var(--faint); }
    .an-heat .hh { white-space:nowrap; overflow:visible; }
    .an-heat .dd { align-self:center; }
    .an-heat i { aspect-ratio:1; border-radius:3px; background:color-mix(in srgb, var(--accent) calc(var(--a) * 100%), var(--muted-bg)); }
    .an-sessions .row { border-top:1px solid var(--line); }
    .an-sessions .row:first-child { border-top:0; }
    .an-session { width:100%; display:grid; grid-template-columns:150px minmax(0,1fr) minmax(0,260px); gap:12px; align-items:center;
                  border:0; background:none; text-align:left; padding:10px 14px; cursor:pointer; min-height:56px; }
    .an-session:hover { background:var(--hover); }
    .an-when { display:flex; flex-direction:column; font-size:13px; }
    .an-when span, .an-meta { color:var(--dim); font-size:12px; }
    .an-when em { font-style:normal; color:var(--ok); }
    .an-trail { display:flex; flex-wrap:wrap; align-items:center; gap:2px; min-width:0; }
    .an-step { background:var(--muted-bg); border-radius:6px; padding:2px 7px; font-size:12px; overflow-wrap:anywhere; }
    .an-more { color:var(--dim); font-size:12px; margin-left:6px; }
    .an-meta { display:flex; flex-direction:column; min-width:0; }
    .an-meta span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .an-door { margin:30px auto; }
    .an-jump { position:sticky; top:56px; z-index:4; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin:-8px -16px 12px; padding:8px 16px;
               background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
    .an-jump button { flex:0 0 auto; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 12px; min-height:32px; cursor:pointer; color:var(--dim); font-size:13px; }
    .an-jump button:hover { color:var(--ink); }
    [id^="an-"].an-panel, #an-top { scroll-margin-top:110px; }
    .an-pick { border:0; background:none; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; overflow-wrap:anywhere; }
    .an-pick:hover { text-decoration:underline; text-underline-offset:3px; }
    .an-chips { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 12px; color:var(--dim); font-size:13px; }
    .an-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--panel));
               color:var(--ink); border-radius:999px; padding:3px 10px; min-height:30px; cursor:pointer; font-size:13px; }
    .an-chip span { color:var(--dim); font-size:15px; line-height:1; }
    .an-since, .an-info { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:10px 12px; margin:0 0 12px; font-size:13px; }
    .an-delta { display:block; font-size:12px; margin-top:4px; color:var(--dim); }
    .an-delta.up, .an-d.up { color:var(--ok); }
    .an-delta.down, .an-d.down { color:var(--bad); }
    .an-d { font-size:12px; color:var(--faint); }
    .an-panel .an-head { align-items:baseline; }
    .an-csv { font-size:12px; }
    .an-all { margin:10px 0 0; }
    @media (max-width:420px) { .brand { display:none; } }
    .an-door h2 { margin:0 0 6px; font-size:18px; }
    .an-dlg { width:min(760px, calc(100vw - 24px)); max-height:calc(100vh - 40px); }
    .an-dlg-in { padding:0 22px 22px; overflow:auto; max-height:calc(100vh - 42px); }
    .an-dlg header { position:sticky; top:0; background:var(--panel); display:flex; align-items:center; gap:10px; padding:18px 0 12px; border-bottom:1px solid var(--line); margin-bottom:14px; }
    .an-dlg header h2 { flex:1; }
    .an-dlg .close { border:0; background:none; width:36px; height:36px; border-radius:8px; cursor:pointer; color:var(--dim); font-size:22px; }
    .an-dlg h4 { margin:18px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); }
    .an-history { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
    .an-history > li { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    .an-hhead { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:13px; }
    .an-hhead span { color:var(--dim); }
    .an-steps { margin:8px 0 0; padding-left:20px; font-size:13px; }
    .an-steps li { display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
    .an-dim { color:var(--dim); white-space:nowrap; }
    code { font-size:12px; background:var(--muted-bg); padding:1px 5px; border-radius:4px; }
    @media (max-width:860px) {
      .an-grid { grid-template-columns:minmax(0,1fr); }
      .an-session { grid-template-columns:minmax(0,1fr); gap:6px; }
    }
    @media (max-width:720px) {
      .an-kpis { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .an-stamp { flex-basis:100%; order:3; }
      .an-jump { top:56px; }
      .an-heat { grid-template-columns:30px repeat(24, minmax(0,1fr)); gap:1px; }
    }

    @media (max-width:720px) {
      .bar { gap:10px; }
      .tab { padding:8px 9px; flex:0 0 auto; }
      .me span { display:none; }
      .stats { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .toggle { grid-template-columns:32px minmax(0,1fr) auto 16px; }
      .badge-cell:empty { display:none; }
      .side, .seen { display:none; }
      .bulk { left:12px; right:12px; transform:none; bottom:12px; gap:6px; padding:8px; }
      .bulk .btn { padding:0 10px; }
      .bulk b { margin-right:2px; }
    }
  </style>
</head>
<body>
  <!-- Signed out, or signed in as somebody who is not an admin. -->
  <div class="gate" id="gate" hidden>
    <form class="card" id="signin" novalidate>
      <h1>Admin</h1>
      <p>ricmassey.com accounts</p>
      <label for="si-email">Email</label>
      <input id="si-email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="si-pass">Password</label>
      <input id="si-pass" type="password" autocomplete="current-password" required>
      <button class="btn primary" id="si-go" type="submit">Sign in</button>
      <p class="error" id="si-msg" role="alert"></p>
    </form>
    <div class="card" id="denied" hidden>
      <h1>No access</h1>
      <p id="denied-who"></p>
      <button class="btn" id="denied-out" type="button">Sign out</button>
    </div>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="bar">
        <span class="brand">Admin</span>
        <nav class="tabs" role="tablist" aria-label="Account lists">
          <button class="tab" role="tab" id="tab-site" data-tab="site" aria-selected="true">Site</button>
          <button class="tab" role="tab" id="tab-kondrite" data-tab="kondrite" aria-selected="false">KONDRITE</button>
          <button class="tab" role="tab" id="tab-analytics" data-tab="analytics" aria-selected="false">Analytics</button>
        </nav>
        <div class="me"><span id="me-email"></span><button class="btn" id="signout" type="button">Sign out</button></div>
      </div>
    </header>
    <main>
      <div class="tools" id="tools">
        <input type="search" id="find" placeholder="Search name or email" aria-label="Search">
        <button class="btn" id="compose" type="button">Email</button>
        <button class="btn primary" id="invite" type="button">Invite</button>
      </div>
      <p class="notice" id="notice" hidden></p>
      <div class="stats" id="stats"></div>
      <div id="body"></div>
    </main>

    <div class="bulk" id="bulk" hidden>
      <b id="bulk-count"></b>
      <button class="btn" type="button" data-bulk="email">Email</button>
      <button class="btn" type="button" data-bulk="approve">Approve</button>
      <button class="btn danger" type="button" data-bulk="ban">Ban</button>
      <button class="btn danger" type="button" data-bulk="delete">Delete</button>
      <button class="btn" type="button" data-bulk="clear">Clear</button>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-labelledby="drawer-name">
      <header>
        <span class="avatar big" id="drawer-avatar" aria-hidden="true"></span>
        <span class="who"><span class="name" id="drawer-name"></span><span class="email" id="drawer-email"></span></span>
        <span id="drawer-badge"></span>
        <button class="close" id="drawer-close" type="button" aria-label="Close">×</button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
  </div>

  <dialog id="confirm-dlg">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p class="hint" id="confirm-body"></p>
      <div class="foot"><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="confirm-yes" value="yes"></button></div>
    </form>
  </dialog>

  <dialog id="mail-dlg">
    <form method="dialog" id="mail-form">
      <h2>Email</h2>
      <div class="to" id="mail-to"></div>
      <label>Subject<input type="text" id="mail-subject" maxlength="150" required></label>
      <label>Message<textarea id="mail-text" maxlength="10000" required></textarea></label>
      <p class="error" id="mail-msg" role="alert"></p>
      <div class="foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" id="mail-send" value="send">Send</button></div>
    </form>
  </dialog>

  <dialog id="invite-dlg">
    <form method="dialog" id="invite-form">
      <h2>Invite</h2>
      <label>Email<input type="email" id="inv-email" autocapitalize="none" spellcheck="false" required></label>
      <label>Name<input type="text" id="inv-name" maxlength="60"></label>
      <div><div style="font-size:13px;font-weight:500;margin-bottom:6px">Can open</div><div class="checks" id="inv-pages"></div></div>
      <p class="error" id="inv-msg" role="alert"></p>
      <div class="foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" id="inv-send" value="send">Send invite</button></div>
    </form>
  </dialog>

  <dialog id="ban-dlg">
    <form method="dialog" id="ban-form">
      <h2 id="ban-title">Ban</h2>
      <label>For<select id="ban-hours">
        <option value="24">1 day</option>
        <option value="168">1 week</option>
        <option value="720">30 days</option>
        <option value="876000" selected>Forever</option>
      </select></label>
      <div class="foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ban">Ban</button></div>
    </form>
  </dialog>

  <dialog id="visitor-dlg" class="an-dlg" aria-labelledby="visitor-title">
    <div class="an-dlg-in">
      <header><h2 id="visitor-title">Visitor</h2>
        <button class="btn" id="visitor-ignore" type="button" hidden></button>
        <button class="close" type="button" data-close aria-label="Close">×</button></header>
      <div id="visitor-body"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../atlas/config.js"></script>
  <script src="../assets/site-gate.js"></script>
  <script src="../projects/kondrite/config.js"></script>
  <script src="view.js"></script>
  <script src="kondrite.js"></script>
  <script src="analytics.js"></script>
  <script src="admin.js"></script>
</body>
</html>
